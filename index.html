ire) o Simpatia (la creatura è attratta e vuole stare vicino all'obiettivo).","rituale":false},"apertura":{"it":"Apertura","lv":2,"sc":"Trasmutazione","ca":"A","ra":"18 metri","du":"Istantanea","co":"V","de":"L'incantatore sceglie un oggetto entro gittata. L'oggetto può essere una porta, una scatola, un baule, un paio di manette, un lucchetto o un altro oggetto che contenga un meccanismo di chiusura mondano o magico. Se l'oggetto è chiuso da un lucchetto mondano, questo si sblocca. Se è chiuso magicamente da Serratura Arcana, l'incantesimo viene soppresso per 10 minuti.","rituale":false},"appiccare fuoco":{"it":"Produrre Fiamma","lv":0,"sc":"Invocazione","ca":"A","ra":"Personale","du":"Istantanea","co":"V,S","de":"Una fiammata si sprigiona dalla mano dell'incantatore. Ogni creatura entro un cubo di 1,5 metri deve superare un tiro salvezza su Destrezza o subire 1d10 danni da fuoco. Questo incantesimo incendia gli oggetti infiammabili nell'area che non sono indossati o trasportati.\n\nA livelli superiori: Il danno dell'incantesimo aumenta di 1d10 quando l'incantatore raggiunge il 5º livello (2d10), l'11º livello (3d10) e il 17º livello (4d10).","rituale":false,"da":"1d10","daHigher":"1d10","sv":"dex"},"occhio arcano":{"it":"Occhio Arcano","lv":4,"sc":"Divinazione","ca":"A","ra":"9 metri","du":"Concentrazione, fino a 1 ora","co":"V,S,M (un pizzico di pelliccia di pipistrello)","de":"L'incantatore crea un occhio invisibile e fluttuante che si muove al suo comando. L'occhio ha scurovisione fino a 9 metri e può muoversi in ogni direzione. L'incantatore riceve mentalmente le informazioni visive dall'occhio.","rituale":false},"arma spirituale":{"it":"Arma Spirituale","lv":2,"sc":"Evocazione","ca":"AB","ra":"18 metri","du":"1 minuto","co":"V,S","de":"L'incantatore crea un'arma spettrale fluttuante che attacca i suoi nemici. Quando lancia l'incantesimo, può effettuare un attacco incantesimo in mischia contro una creatura entro 1,5 metri dall'arma. Se colpisce, il bersaglio subisce danni da forza pari a 1d8 + il modificatore della caratteristica da incantatore.\n\nA livelli superiori: Quando l'incantatore lancia questo incantesimo usando uno slot incantesimo di 3º livello o superiore, il danno aumenta di 1d8 per ogni due livelli dello slot sopra il 2º.","rituale":false,"daHigher":"1d8"},"armatura di agathys":{"it":"Armatura di Agathys","lv":1,"sc":"Abiurazione","ca":"A","ra":"Personale","du":"1 ora","co":"V,S,M (una tazza d'acqua)","de":"Una forza magica protettiva circonda l'incantatore, manifestandosi come un gelo spettrale. Guadagna 5 punti ferita temporanei. Se una creatura colpisce l'incantatore con un attacco in mischia mentre ha questi punti ferita, subisce 5 danni da freddo.\n\nA livelli superiori: Sia i punti ferita temporanei che i danni da freddo aumentano di 5 per ogni livello dello slot sopra il 1º.","rituale":false},"armatura magica":{"it":"Armatura del Mago","lv":1,"sc":"Abiurazione","ca":"A","ra":"Contatto","du":"8 ore","co":"V,S,M (un pezzetto di cuoio conciato)","de":"L'incantatore tocca una creatura consenziente che non indossa armatura. Finché l'incantesimo non termina, la CA base del bersaglio diventa 13 + il suo modificatore di Destrezza. L'incantesimo termina se il bersaglio indossa un'armatura o se l'incantatore lo interrompe come azione.","rituale":false},"astuzia della volpe (splendore dell'aquila)":{"it":"Potenziamento","lv":2,"sc":"Trasmutazione","ca":"A","ra":"Contatto","du":"Concentrazione, fino a 1 ora","co":"V,S,M (peli o piume di un animale)","de":"L'incantatore infonde a una creatura la resistenza o l'abilità di una bestia. Sceglie uno dei seguenti effetti: Forza del Toro, Grazia del Gatto, Costituzione dell'Orso, Astuzia della Volpe, Saggezza del Gufo o Splendore dell'Aquila. Il bersaglio ottiene vantaggio alle prove relative alla caratteristica scelta.\n\nA livelli superiori: Puoi colpire una creatura aggiuntiva per ogni livello dello slot sopra il 2º.","rituale":false},"attutire caduta":{"it":"Caduta Morbida","lv":1,"sc":"Trasmutazione","ca":"R","ra":"18 metri","du":"1 minuto","co":"M (una piccola piuma o del piumino)","de":"Sceglie fino a cinque creature che cadono entro gittata. La velocità di caduta dei bersagli scende a 18 metri per round. Se il bersaglio atterra prima del termine, non subisce danni dalla caduta e atterra in piedi.","rituale":false},"augurio":{"it":"Presagio","lv":2,"sc":"Divinazione","ca":"special","ra":"Personale","du":"Istantanea","co":"V,S,M (bastoncini, ossa o carte contrassegnate del valore di almeno 25 mo)","de":"Interrogando entità extraplanari, l'incantatore riceve un presagio su un'azione specifica che intende compiere entro i successivi 30 minuti. Il DM sceglie tra: Bene, Male, Bene e Male, Nulla.","rituale":true},"aura di purezza":{"it":"Aura di Purezza","lv":4,"sc":"Abiurazione","ca":"A","ra":"Personale (9 metri)","du":"Concentrazione, fino a 10 minuti","co":"V","de":"Un'energia purificatrice si irradia dall'incantatore in un raggio di 9 metri. Per la durata, le creature non ostili nell'aura non possono contrarre malattie, hanno resistenza ai danni da veleno e vantaggio ai tiri salvezza contro effetti che le renderebbero accecate, affascinate, assordate, spaventate, paralizzate, avvelenate o stordite.","rituale":false},"aura di vitalità":{"it":"Aura di Vitalità","lv":3,"sc":"Evocazione","ca":"A","ra":"Personale (9 metri)","du":"Concentrazione, fino a 1 minuto","co":"V","de":"Un'aura di energia curativa si sprigiona dall'incantatore. Finché l'incantesimo non termina, l'incantatore può usare un'azione bonus nel suo turno per far recuperare 2d6 punti ferita a una creatura entro l'aura (incluso se stesso).","rituale":false,"da":"2d6"},"aura santuario":{"it":"Aura Santuario","lv":5,"sc":"Abiurazione","ca":"A","ra":"Personale (9 metri)","du":"Concentrazione, fino a 1 minuto","co":"V","de":"Una luce sacra si sprigiona dall'incantatore. Le creature non ostili entro 9 metri hanno vantaggio a tutti i tiri salvezza, e le creature demoniache o non morte hanno svantaggio ai tiri per colpire contro di esse.","rituale":false},"bacche buone":{"it":"Bacche Benefiche","lv":1,"sc":"Trasmutazione","ca":"A","ra":"Contatto","du":"Istantanea","co":"V,S,M (un rametto di vischio)","de":"Appaiono fino a dieci bacche nella mano dell'incantatore. Una creatura può usare la sua azione per mangiare una bacca. Mangiare una bacca fa recuperare 1 punto ferita e fornisce nutrimento sufficiente per un giorno intero.","rituale":false},"banchetto degli eroi":{"it":"Banchetto degli Eroi","lv":6,"sc":"Evocazione","ca":"A","ra":"9 metri","du":"Istantanea","co":"V,S,M (un calice incrostato di gemme del valore di almeno 1.000 mo (consumato))","de":"L'incantatore evoca un banchetto magnifico. Fino a dodici creature possono banchettare per un'ora. I partecipanti ottengono: immunità al veleno e alla condizione spaventato, vantaggio ai tiri salvezza su Saggezza e un aumento di 2d10 punti ferita massimi per 24 ore.","rituale":false,"da":"2d10"},"bastone incantato":{"it":"Bastone Incantato","lv":0,"sc":"Trasmutazione","ca":"AB","ra":"Contatto","du":"1 minuto","co":"V,S,M (vischio, una foglia di trifoglio e un bastone o un randello di legno)","de":"L'incantatore infonde il potere della natura in un bastone o un randello che impugna. Per la durata, può usare la sua caratteristica da incantatore anziché la Forza per i tiri per colpire e per i danni degli attacchi in mischia effettuati con quell'arma, e il dado del danno dell'arma diventa un d8. L'arma diventa inoltre magica.","rituale":false},"benedizione":{"it":"Benedizione","lv":1,"sc":"Ammaliamento","ca":"A","ra":"9 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S,M (una goccia di acqua santa)","de":"L'incantatore benedice fino a tre creature a sua scelta entro gittata. Ogni volta che un bersaglio effettua un tiro per colpire o un tiro salvezza prima del termine dell'incantesimo, può tirare un d4 e aggiungere il risultato al tiro.\n\nA livelli superiori: L'incantatore può colpire una creatura aggiuntiva per ogni livello dello slot sopra il 1º.","rituale":false},"bocca magica":{"it":"Bocca Magica","lv":2,"sc":"Illusione","ca":"special","ra":"9 metri","du":"Fino a quando non viene dissolto","co":"V,S,M (un pezzetto di favo e un po' di polvere di giada del valore di almeno 10 mo (consumata))","de":"L'incantatore imprime un messaggio magico su un oggetto entro gittata. L'incantatore stabilisce una circostanza specifica che faccia attivare l'incantesimo. Quando quella circostanza si verifica, una bocca appare sull'oggetto e recita il messaggio (fino a 25 parole) con la voce dell'incantatore.","rituale":true},"buio":{"it":"Buio","lv":2,"sc":"Invocazione","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 10 minuti","co":"V,M (un po' di pelliccia di pipistrello e un pezzetto di carbone o una goccia di catrame)","de":"Un'oscurità magica si sprigiona da un punto scelto dall'incantatore fino a riempire una sfera del raggio di 4,5 metri. L'oscurità si diffonde oltre gli angoli. Una creatura dotata di scurovisione non può vedere attraverso questa oscurità e la luce non magica non può illuminarla.","rituale":false},"caduta morbida":{"it":"Caduta Morbida","lv":1,"sc":"Trasmutazione","ca":"R","ra":"18 metri","du":"1 minuto","co":"M (una piccola piuma o del piumino)","de":"L'incantatore sceglie fino a cinque creature che cadono entro gittata. La velocità di caduta dei bersagli scende a 18 metri per round fino al termine dell'incantesimo. Se il bersaglio atterra prima del termine, non subisce danni dalla caduta e atterra in piedi.","rituale":false},"calmare emozioni":{"it":"Calmare Emozioni","lv":2,"sc":"Ammaliamento","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S","de":"L'incantatore tenta di sopprimere le forti emozioni di un gruppo di persone. Ogni umanoide entro una sfera del raggio di 6 metri deve effettuare un tiro salvezza su Carisma. Se fallisce, l'incantatore può scegliere di rendere indifferente una creatura ostile o di sopprimere gli effetti di spaventato o affascinato.","rituale":false,"sv":"cha"},"camminare sull'acqua":{"it":"Camminare sull'Acqua","lv":3,"sc":"Trasmutazione","ca":"A","ra":"9 metri","du":"1 ora","co":"V,S,M (un pezzetto di sughero)","de":"Questo incantesimo conferisce la capacità di muoversi su qualsiasi superficie liquida (acqua, fango, neve, sabbie mobili, lava) come se fosse terreno solido a un massimo di dieci creature consenzienti entro gittata.","rituale":true},"campo anti-magia":{"it":"Campo Anti-magia","lv":8,"sc":"Abiurazione","ca":"A","ra":"Personale (sfera del raggio di 3 metri)","du":"Concentrazione, fino a 1 ora","co":"V,S,M (un pizzico di polvere di ferro o limatura di ferro)","de":"Una sfera invisibile di antimagia circonda l'incantatore. All'interno della sfera gli incantesimi non possono essere lanciati, le creature evocate scompaiono e persino gli oggetti magici diventano mondani.","rituale":false},"capanna di leomund":{"it":"Capanna di Leomund","lv":3,"sc":"Evocazione","ca":"special","ra":"Personale (emisfero del raggio di 3 metri)","du":"8 ore","co":"V,S,M (una sferetta di cristallo)","de":"Una cupola di forza immobile di colore opaco appare attorno e sopra l'incantatore. Possono trovarsi all'interno fino a nove creature di taglia Media o inferiore. L'incantesimo termina se l'incantatore ne esce. Atmosfera e temperatura restano confortevoli, la magia e le creature esterne non possono attraversarla.","rituale":true},"caratteristica migliorata":{"it":"Potenziamento","lv":2,"sc":"Trasmutazione","ca":"A","ra":"Contatto","du":"Concentrazione, fino a 1 ora","co":"V,S,M (peli o piume di un animale)","de":"L'incantatore infonde a una creatura la forza o l'abilità di una bestia. Sceglie una caratteristica (Forza, Destrezza, Costituzione, Intelligenza, Saggezza, Carisma). Il bersaglio ottiene vantaggio alle prove relative a quella caratteristica (e punti ferita temporanei per Costituzione).\n\nA livelli superiori: L'incantatore può colpire una creatura aggiuntiva per ogni livello dello slot sopra il 2º.","rituale":false},"carne in pietra":{"it":"Pietrificazione","lv":6,"sc":"Trasmutazione","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S,M (un pizzico di calce, acqua e terra)","de":"L'incantatore tenta di trasformare in pietra una creatura che egli è in grado di vedere entro gittata. Il bersaglio deve effettuare un tiro salvezza su Costituzione. Se lo fallisce, è trattenuto poiché la sua carne inizia a indurirsi. Deve ripetere il tiro salvezza alla fine di ogni suo turno. Se lo fallisce per tre volte, la creatura è pietrificata per la durata.","rituale":false,"sv":"con"},"catena di fulmini":{"it":"Catena di Fulmini","lv":6,"sc":"Invocazione","ca":"A","ra":"45 metri","du":"Istantanea","co":"V,S,M (un po' di pelliccia, un pezzo di ambra, vetro o una bacchetta di cristallo e tre spilli d'argento)","de":"L'incantatore scaglia un fulmine verso un bersaglio a sua scelta entro gittata. Dal bersaglio scaturiscono poi altri tre fulmini che colpiscono altri tre bersagli entro 9 metri dal primo. Ogni bersaglio deve effettuare un tiro salvezza su Destrezza: subisce 10d8 danni da fulmine se lo fallisce, o la metà se lo supera.\n\nA livelli superiori: Il numero di fulmini secondari aumenta di uno per ogni livello dello slot sopra il 6º.","rituale":false,"da":"10d8","sv":"dex"},"caos diretto (dardo del caos)":{"it":"Dardo del Caos","lv":1,"sc":"Invocazione","ca":"A","ra":"36 metri","du":"Istantanea","co":"V,S","de":"L'incantatore scaglia una massa oscillante di energia caotica. Effettua un attacco incantesimo a distanza. Se colpisce, il bersaglio subisce 2d8 + 1d6 danni. Il tipo di danno è determinato dal risultato dei d8. Se entrambi i d8 mostrano lo stesso numero, l'energia balza su un altro bersaglio entro 9 metri.\n\nA livelli superiori: Il danno aumenta di 1d6 per ogni livello dello slot sopra il 1º.","rituale":false,"da":"1d6","daHigher":"1d6"},"cerchio di morte":{"it":"Cerchio di Morte","lv":6,"sc":"Necromanzia","ca":"A","ra":"45 metri","du":"Istantanea","co":"V,M (la polvere di una perla nera frantumata del valore di almeno 500 mo)","de":"Un'energia negativa si sprigiona in una sfera del raggio di 18 metri centrata su un punto entro gittata. Ogni creatura nell'area deve effettuare un tiro salvezza su Costituzione, subendo 8d6 danni da necromanzia se lo fallisce, o la metà se lo supera.\n\nA livelli superiori: Il danno aumenta di 2d6 per ogni livello dello slot sopra il 6º.","rituale":false,"da":"8d6","daHigher":"2d6","sv":"con"},"cerchio di potere":{"it":"Cerchio di Potere","lv":5,"sc":"Abiurazione","ca":"A","ra":"Personale (9 metri)","du":"Concentrazione, fino a 10 minuti","co":"V","de":"Un'energia divina si irradia dall'incantatore in un raggio di 9 metri. Per la durata, le creature non ostili nell'aura hanno vantaggio ai tiri salvezza contro gli incantesimi e altri effetti magici.","rituale":false},"cerchio magico":{"it":"Cerchio Magico","lv":3,"sc":"Abiurazione","ca":"special","ra":"3 metri","du":"1 ora","co":"V,S,M (acqua santa o polvere d'argento e ferro del valore di almeno 100 mo (consumata))","de":"L'incantatore crea un cilindro di energia magica centrato su un punto a terra. Sceglie uno o più tipi di creature: celestiali, elementali, folletti, demoni o non morti. Il cerchio impedisce a tali creature di entrare, uscire o influenzare magicamente chi è all'interno.\n\nA livelli superiori: La durata aumenta di 1 ora per ogni livello dello slot sopra il 3º.","rituale":false},"chiamare fulmini":{"it":"Chiamare Fulmini","lv":3,"sc":"Invocazione","ca":"A","ra":"36 metri","du":"Concentrazione, fino a 10 minuti","co":"V,S","de":"Una nube temporalesca appare nel cielo sopra un punto scelto dall'incantatore. Finché l'incantesimo non termina, l'incantatore può usare la sua azione per far cadere un fulmine dalla nube. Ogni creatura entro 1,5 metri dal punto colpito deve superare un tiro salvezza su Destrezza o subire 3d10 danni da fulmine.\n\nA livelli superiori: Il danno aumenta di 1d10 per ogni livello dello slot sopra il 3º.","rituale":false,"da":"3d10","daHigher":"1d10","sv":"dex"},"chiaroveggenza":{"it":"Chiaroveggenza","lv":3,"sc":"Divinazione","ca":"A","ra":"1,5 km","du":"Concentrazione, fino a 10 minuti","co":"V,S,M (un sensore focalizzatore del valore di almeno 100 mo (un corno di vetro o un occhio di vetro))","de":"L'incantatore crea un sensore invisibile in un luogo a lui familiare o un luogo ovvio entro gittata. Può scegliere di vedere o di sentire attraverso il sensore come se si trovasse lì.","rituale":false},"comanda vegetali":{"it":"Comanda Vegetali","lv":3,"sc":"Trasmutazione","ca":"A","ra":"45 metri","du":"Istantanea o 8 ore","co":"V,S","de":"L'incantatore infonde energia nelle piante in un'area. Può rendere il terreno difficile (le piante intralciano) o rendere le piante estremamente produttive per un anno se lanciato in 8 ore.","rituale":false},"comprendere linguaggi":{"it":"Comprendere i Linguaggi","lv":1,"sc":"Divinazione","ca":"A","ra":"Personale","du":"1 ora","co":"V,S,M (un pizzico di fuliggine e qualche granello di sale)","de":"Per la durata, l'incantatore comprende il significato letterale di ogni linguaggio parlato che sente e di ogni linguaggio scritto che vede (toccando la superficie su cui è scritto).","rituale":true},"comando":{"it":"Comando","lv":1,"sc":"Ammaliamento","ca":"A","ra":"18 metri","du":"1 round","co":"V","de":"L'incantatore pronuncia un comando di una sola parola a una creatura che egli è in grado di vedere entro gittata. Il bersaglio deve superare un tiro salvezza su Saggezza, altrimenti dovrà obbedire al comando nel suo turno successivo. L'incantesimo non ha effetto se il bersaglio è un non morto, se non capisce il linguaggio dell'incantatore o se il comando è direttamente dannoso per esso.\n\nA livelli superiori: L'incantatore può colpire una creatura aggiuntiva per ogni livello dello slot sopra il 1º.","rituale":false,"sv":"wis"},"comunione":{"it":"Comunione","lv":5,"sc":"Divinazione","ca":"special","ra":"Personale","du":"1 minuto","co":"V,S,M (incenso e una fiala di acqua santa)","de":"L'incantatore entra in contatto con una divinità o un intermediario divino e può porre fino a tre domande a cui è possibile rispondere con un 'sì' o un 'no'. Le risposte ricevute sono corrette. Se l'incantatore lancia l'incantesimo più di una volta prima di aver completato un riposo lungo, c'è una probabilità cumulativa del 25% che riceva una risposta casuale.","rituale":true},"comunione con la natura":{"it":"Comunione con la Natura","lv":5,"sc":"Divinazione","ca":"special","ra":"Personale","du":"Istantanea","co":"V,S","de":"L'incantatore diventa un tutt'uno con la natura e ottiene conoscenze sul territorio circostante. All'aperto, l'incantesimo fornisce informazioni entro un raggio di 4,5 km (900 metri in grotte o sotterranei). Può apprendere la posizione di: specchi d'acqua, vegetazione, fauna, insediamenti o presenze di creature non naturali.","rituale":true},"confusione":{"it":"Confusione","lv":4,"sc":"Ammaliamento","ca":"A","ra":"27 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S,M (tre gusi di noce)","de":"Questo incantesimo assale la mente delle creature, generando deliri e provocando azioni incontrollate. Ogni creatura in una sfera del raggio di 3 metri centrata su un punto deve superare un tiro salvezza su Saggezza. Una creatura influenzata deve tirare un d10 all'inizio di ogni suo turno per determinare il suo comportamento (se si muove, se attacca o se non fa nulla).\n\nA livelli superiori: Il raggio della sfera aumenta di 1,5 metri per ogni livello dello slot sopra il 4º.","rituale":false,"sv":"wis"},"congelare sangue (tocco gelido)":{"it":"Tocco Gelido","lv":0,"sc":"Necromanzia","ca":"A","ra":"36 metri","du":"1 round","co":"V,S","de":"L'incantatore crea una mano scheletrica e spettrale nello spazio di una creatura entro gittata. Effettua un attacco incantesimo a distanza: se colpisce, il bersaglio subisce 1d8 danni da necromanzia e non può recuperare punti ferita fino all'inizio del turno successivo dell'incantatore. Se colpisce un non morto, esso ha anche svantaggio ai tiri per colpire contro l'incantatore.\n\nA livelli superiori: Il danno aumenta di 1d8 al 5º, 11º e 17º livello.","rituale":false,"da":"1d8","daHigher":"1d8"},"conoscenza delle leggende":{"it":"Leggenda","lv":5,"sc":"Divinazione","ca":"A","ra":"Personale","du":"Istantanea","co":"V,S,M (incenso del valore di almeno 250 mo (consumato) e quattro strisce d'avorio del valore di almeno 50 mo l'una)","de":"L'incantatore richiama alla mente leggende riguardanti una persona, un oggetto o un luogo importante. Se l'oggetto della ricerca è di importanza leggendaria, l'incantatore apprende informazioni che possono includere racconti dimenticati o segreti nascosti.","rituale":false},"contagio":{"it":"Contagio","lv":5,"sc":"Necromanzia","ca":"A","ra":"Contatto","du":"7 giorni","co":"V,S","de":"L'incantatore tenta di colpire una creatura con una malattia terribile. Effettua un attacco incantesimo in mischia. Se colpisce, il bersaglio è avvelenato. Alla fine di ogni suo turno, deve effettuare un tiro salvezza su Costituzione. Dopo tre fallimenti, la malattia ha pieno effetto e il bersaglio subisce gli effetti di una patologia a scelta (es. Cecità, Febbre della Mente, ecc.) per la durata.","rituale":false,"sv":"con"},"controllare acqua":{"it":"Controllare Acqua","lv":4,"sc":"Trasmutazione","ca":"A","ra":"90 metri","du":"Concentrazione, fino a 10 minuti","co":"V,S,M (una goccia d'acqua e un pizzico di polvere)","de":"L'incantatore controlla una massa d'acqua entro un'area cubica di 30 metri di lato. Può scegliere uno dei seguenti effetti: Alzare l'Acqua, Spartire l'Acqua, Inondare o Deviare il Corso. Può cambiare l'effetto usando un'azione nel suo turno.","rituale":false},"controllare tempo atmosferico":{"it":"Controllare Tempo Atmosferico","lv":8,"sc":"Trasmutazione","ca":"A","ra":"Personale (raggio di 7,5 km)","du":"Concentrazione, fino a 8 ore","co":"V,S,M (incenso e terra mischiati con acqua)","de":"L'incantatore cambia le condizioni atmosferiche all'aperto in un raggio di 7,5 km. Può modificare precipitazioni, temperatura e vento. Occorrono 1d4 x 10 minuti affinché le nuove condizioni si manifestino dopo ogni cambiamento.","rituale":false},"controincantesimo":{"it":"Controincantesimo","lv":3,"sc":"Abiurazione","ca":"R","ra":"18 metri","du":"Istantanea","co":"S","de":"L'incantatore tenta di interrompere una creatura nel processo di lancio di un incantesimo. Se la creatura sta lanciando un incantesimo di 3º livello o inferiore, l'incantesimo fallisce. Se è di 4º livello o superiore, l'incantatore effettua una prova della sua caratteristica da incantatore (CD 10 + livello dell'incantesimo).\n\nA livelli superiori: L'incantesimo avversario fallisce automaticamente se il suo livello è pari o inferiore al livello dello slot usato per Controincantesimo.","rituale":false},"danza irresistibile di otto":{"it":"Danza Irresistibile di Otto","lv":6,"sc":"Ammaliamento","ca":"A","ra":"9 metri","du":"Concentrazione, fino a 1 minuto","co":"V","de":"L'incantatore sceglie una creatura entro gittata. Il bersaglio inizia a ballare vorticosamente sul posto, saltellando e battendo i piedi per la durata. La creatura danzante ha svantaggio ai tiri salvezza su Destrezza e ai tiri per colpire, e gli altri hanno vantaggio ai tiri per colpire contro di essa. Il bersaglio deve usare tutto il suo movimento per danzare senza allontanarsi.","rituale":false},"dardo incantato":{"it":"Dardo Incantato","lv":1,"sc":"Invocazione","ca":"A","ra":"36 metri","du":"Istantanea","co":"V,S","de":"L'incantatore crea tre dardi di forza magica. Ogni dardo colpisce una creatura a sua scelta che egli sia in grado di vedere entro gittata. Un dardo infligge 1d4 + 1 danni da forza al bersaglio. I dardi colpiscono tutti simultaneamente e l'incantatore può dirigerli contro un unico bersaglio o contro bersagli diversi.\n\nA livelli superiori: L'incantatore crea un dardo aggiuntivo per ogni livello dello slot sopra il 1º.","rituale":false,"da":"1d4+1"},"dardo tracciante":{"it":"Dardo Tracciante","lv":1,"sc":"Evocazione","ca":"A","ra":"36 metri","du":"1 round","co":"V,S","de":"Un dardo di luce scagliato contro una creatura entro gittata. Effettua un attacco incantesimo a distanza. Se colpisce, il bersaglio subisce 4d6 danni radiosi e il prossimo tiro per colpire effettuato contro questo bersaglio prima della fine del turno successivo dell'incantatore ha vantaggio grazie alla luce mistica che lo avvolge.\n\nA livelli superiori: Il danno aumenta di 1d6 per ogni livello dello slot sopra il 1º.","rituale":false,"da":"4d6","daHigher":"1d6"},"debolezza mentale":{"it":"Debolezza Mentale","lv":8,"sc":"Ammaliamento","ca":"A","ra":"45 metri","du":"Istantanea","co":"V,S,M (una manciata di sferette di argilla, cristallo, vetro o minerale)","de":"L'incantatore tenta di frantumare la mente di una creatura entro gittata. Il bersaglio subisce 4d6 danni psichici e deve effettuare un tiro salvezza su Intelligenza. Se lo fallisce, i suoi punteggi di Intelligenza e Carisma diventano 1. La creatura non può lanciare incantesimi, attivare oggetti magici o comprendere linguaggi, ma può proteggere i suoi amici.","rituale":false,"da":"4d6","sv":"int"},"decifrare scritto (comprendere linguaggi)":{"it":"Comprendere i Linguaggi","lv":1,"sc":"Divinazione","ca":"A","ra":"Personale","du":"1 ora","co":"V,S,M (un pizzico di fuliggine e qualche granello di sale)","de":"L'incantatore comprende il significato letterale di ogni linguaggio parlato che sente. Inoltre, toccando una superficie su cui è riportato un testo scritto, ne comprende il significato letterale (un linguaggio alla volta).","rituale":true},"desiderio":{"it":"Desiderio","lv":9,"sc":"Invocazione","ca":"A","ra":"Personale","du":"Istantanea","co":"V","de":"L'incantesimo più potente che un mortale possa lanciare. Semplicemente parlando, l'incantatore può alterare la realtà. L'uso base è replicare qualsiasi altro incantesimo di 8º livello o inferiore senza requisiti. Può essere usato per effetti più potenti (creare oggetti, curare ferite, ecc.), ma comporta un forte stress magico per l'incantatore.","rituale":false},"destriero fantomatico":{"it":"Corsiero Fantasma","lv":3,"sc":"Illusione","ca":"special","ra":"9 metri","du":"1 ora","co":"V,S","de":"L'incantatore evoca una creatura quasi reale che ricorda un cavallo. La creatura ha CA 10, 7 punti ferita e una velocità di 30 metri. Può trasportare l'incantatore o una creatura a sua scelta. Quando l'incantesimo termina, il destriero svanisce gradualmente in 1 minuto.","rituale":true},"individuazione del bene e del male":{"it":"Individuare il Bene e il Male","lv":1,"sc":"Divinazione","ca":"A","ra":"Personale (9 metri)","du":"Concentrazione, fino a 10 minuti","co":"V,S","de":"Per la durata, l'incantatore percepisce se entro 9 metri da lui è presente un celestiale, un elementale, un folletto, un demonio, un non morto o un'aberrazione, nonché la sua posizione. Percepisce inoltre la presenza di luoghi o oggetti consacrati o sconsacrati.","rituale":false},"dissolvi magia":{"it":"Dissolvi Magia","lv":3,"sc":"Abiurazione","ca":"A","ra":"36 metri","du":"Istantanea","co":"V,S","de":"L'incantatore sceglie una creatura, un oggetto o un effetto magico entro gittata. Ogni incantesimo di 3º livello o inferiore attivo sul bersaglio termina. Per ogni incantesimo di 4º livello o superiore, l'incantatore effettua una prova della sua caratteristica da incantatore (CD 10 + livello dell'incantesimo).\n\nA livelli superiori: Se lanciato con uno slot di livello superiore, interrompe automaticamente gli incantesimi di livello pari o inferiore a quello dello slot usato.","rituale":false},"dito della morte":{"it":"Dito della Morte","lv":7,"sc":"Necromanzia","ca":"A","ra":"18 metri","du":"Istantanea","co":"V,S","de":"L'incantatore punta il dito verso una creatura entro gittata ed emette un'energia negativa lacerante. Il bersaglio deve effettuare un tiro salvezza su Costituzione: subisce 7d8 + 30 danni da necromanzia se lo fallisce, o la metà se lo supera. Se questo danno uccide il bersaglio, esso sorge all'inizio del turno successivo dell'incantatore come uno zombi sotto il suo controllo permanente.","rituale":false,"da":"7d8+30","sv":"con"},"divinazione":{"it":"Divinazione","lv":4,"sc":"Divinazione","ca":"A","ra":"Personale","du":"Istantanea","co":"V,S,M (incenso e un'offerta sacra appropriata alla divinità del valore di almeno 25 mo (consumati))","de":"L'incantatore pone una domanda riguardante un obiettivo, un evento o un'attività specifica che avverrà entro i prossimi 7 giorni. Una divinità o un intermediario fornisce una risposta veritiera, che può essere una frase breve, un verso criptico o un presagio.","rituale":true},"dominare bestie":{"it":"Dominare Bestie","lv":4,"sc":"Ammaliamento","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S","de":"L'incantatore tenta di assumere il controllo di una bestia entro gittata. Il bersaglio deve superare un tiro salvezza su Saggezza o essere affascinato. Finché è affascinato, l'incantatore ha un legame telepatico con essa e può impartirle comandi (nessun'azione richiesta). Se la bestia subisce danni, ripete il tiro salvezza.\n\nA livelli superiori: La durata della concentrazione aumenta a 10 minuti al 5º livello, 1 ora al 6º livello e 8 ore al 7º livello o superiore.","rituale":false,"sv":"wis"},"dominare mostri":{"it":"Dominare Mostri","lv":8,"sc":"Ammaliamento","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 1 ora","co":"V,S","de":"L'incantatore tenta di assumere il controllo di una creatura qualsiasi entro gittata. Il bersaglio deve superare un tiro salvezza su Saggezza con svantaggio se l'incantatore è in combattimento con esso. Funziona come Dominare Bestie, ma su ogni tipo di creatura.\n\nA livelli superiori: Usando uno slot di 9º livello, la durata della concentrazione aumenta a 8 ore.","rituale":false,"sv":"wis"},"dominare persone":{"it":"Dominare Persone","lv":5,"sc":"Ammaliamento","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S","de":"L'incantatore tenta di assumere il controllo di un umanoide entro gittata. Il bersaglio deve superare un tiro salvezza su Saggezza o essere affascinato. L'incantatore può impartire comandi telepatici. Se il bersaglio subisce danni, ripete il tiro salvezza.\n\nA livelli superiori: La durata aumenta a 10 minuti al 6º livello, 1 ora al 7º e 8 ore all'8º livello o superiore.","rituale":false,"sv":"wis"},"donum vitae (parola guaritrice)":{"it":"Parola Guaritrice","lv":1,"sc":"Evocazione","ca":"AB","ra":"18 metri","du":"Istantanea","co":"V","de":"Una creatura a scelta dell'incantatore, che egli sia in grado di vedere entro gittata, recupera un numero di punti ferita pari a 1d4 + il modificatore della caratteristica da incantatore. Questo incantesimo non ha effetto su non morti o costrutti.\n\nA livelli superiori: Il recupero aumenta di 1d4 per ogni livello dello slot sopra il 1º.","rituale":false,"daHigher":"1d4","da":"1d4"},"doppio passo (passo veloce)":{"it":"Andatura Spedita","lv":1,"sc":"Trasmutazione","ca":"A","ra":"Contatto","du":"1 ora","co":"V,S,M (un pizzico di sporcizia)","de":"L'incantatore tocca una creatura. La velocità sul terreno del bersaglio aumenta di 3 metri fino al termine dell'incantesimo.\n\nA livelli superiori: L'incantatore può colpire una creatura aggiuntiva per ogni livello dello slot sopra il 1º.","rituale":false},"duellare (costrizione)":{"it":"Costrizione","lv":1,"sc":"Ammaliamento","ca":"AB","ra":"9 metri","du":"Concentrazione, fino a 1 minuto","co":"V","de":"L'incantatore sfida una creatura a duello. Il bersaglio deve effettuare un tiro salvezza su Saggezza. Se lo fallisce, è costretto a focalizzare la sua attenzione sull'incantatore: ha svantaggio ai tiri per colpire contro creature diverse dall'incantatore e deve effettuare un tiro salvezza su Saggezza ogni volta che tenta di muoversi in uno spazio che sia a più di 9 metri dall'incantatore.","rituale":false,"sv":"wis"},"esilio":{"it":"Esilio","lv":4,"sc":"Abiurazione","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S,M (un oggetto sgradevole per il bersaglio)","de":"L'incantatore tenta di inviare una creatura in un altro piano di esistenza. Il bersaglio deve superare un tiro salvezza su Carisma o essere esiliato. Se la creatura è nativa del piano in cui si trova, viene inviata in un semipiano innocuo. Se è nativa di un altro piano, torna nel suo piano d'origine.\n\nA livelli superiori: L'incantatore può colpire una creatura aggiuntiva per ogni livello dello slot sopra il 4º.","rituale":false,"sv":"cha"},"esplosione di fuoco (dardo di fuoco)":{"it":"Esplosione di Fuoco (Dardo di Fuoco)","lv":0,"sc":"Invocazione","ca":"A","ra":"36 metri","du":"Istantanea","co":"V,S","de":"L'incantatore scaglia un dardo di fuoco contro una creatura o un oggetto entro gittata. Effettua un attacco incantesimo a distanza. Se colpisce, il bersaglio subisce 1d10 danni da fuoco. Un oggetto infiammabile colpito da questo incantesimo prende fuoco se non è indossato o trasportato.\n\nA livelli superiori: Il danno aumenta di 1d10 al 5º, 11º e 17º livello.","rituale":false,"da":"1d10","daHigher":"1d10"},"evoca animali":{"it":"Evocare Animali","lv":3,"sc":"Evocazione","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 1 ora","co":"V,S","de":"L'incantatore evoca degli spiriti naturali che assumono la forma di bestie. Può evocare: una bestia di GS 2, due bestie di GS 1, quattro bestie di GS 1/2 o otto bestie di GS 1/4. Le creature appaiono in spazi liberi entro gittata e obbediscono ai comandi verbali dell'incantatore.\n\nA livelli superiori: Il numero di creature evocate raddoppia con uno slot di 5º livello, triplica al 7º e quadruplica al 9º.","rituale":false},"evoca celestiale":{"it":"Evocare Celestiale","lv":7,"sc":"Evocazione","ca":"A","ra":"27 metri","du":"Concentrazione, fino a 10 minuti","co":"V,S","de":"L'incantatore evoca uno spirito dai Piani Superiori che si manifesta come un pilastro di luce. Può scegliere tra Luce Curatrice (recupera 4d12 + mod. caratteristica PF) o Luce Ustionante (6d12 danni radiosi, TS Destrezza dimezza). Può muovere il cilindro di 9 metri ogni turno.\n\nA livelli superiori: I danni e la guarigione aumentano di 1d12 per ogni livello dello slot sopra il 7º.","rituale":false,"da":"6d12","daHigher":"1d12"},"evoca creature boschive":{"it":"Evoca Creature Boschive","lv":4,"sc":"Evocazione","ca":"A","ra":"Incantatore","du":"Concentrazione, fino a 10 minuti","co":"V,S","de":"L'incantatore evoca spiriti della natura che assumono la forma di creature fatate (come satiri o ninfe). Le creature appaiono in spazi liberi e obbediscono ai comandi. Svaniscono quando i loro PF scendono a 0 o al termine dell'incantesimo.","rituale":false},"esplosione solare":{"it":"Esplosione Solare","lv":8,"sc":"Invocazione","ca":"A","ra":"45 metri","du":"Istantanea","co":"V,S,M (un frammento di pietra di sole)","de":"Una luce solare radiosa esplode in una sfera di 18 metri di raggio. Ogni creatura nell'area deve effettuare un TS su Costituzione: subisce 12d6 danni radiosi e rimane accecata per 1 minuto se fallisce, o metà danni se riesce.","rituale":false,"da":"12d6"},"estasiare":{"it":"Distrazione","lv":2,"sc":"Ammaliamento","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S","de":"L'incantatore tesse una serie di parole e gesti per distrarre le creature scelte. Ogni bersaglio deve superare un TS su Saggezza, altrimenti ha svantaggio alle prove di Saggezza (Percezione) per notare altre creature che non siano l'incantatore.","rituale":false},"fiamma perenne":{"it":"Fiamma Perenne","lv":2,"sc":"Invocazione","ca":"A","ra":"Contatto","du":"Fino a quando non viene dissolto","co":"V,S,M (polvere di rubino del valore di 50 mo (consumata))","de":"Una fiamma magica, simile a una torcia ma che non produce calore e non consuma ossigeno, scaturisce da un oggetto toccato. Produce luce intensa in un raggio di 6 metri e luce fioca per altri 6 metri.","rituale":false},"frantumare":{"it":"Frantumare","lv":2,"sc":"Invocazione","ca":"A","ra":"18 metri","du":"Istantanea","co":"V,S,M (un frammento di mica)","de":"Un rumore assordante esplode in un punto scelto. Ogni creatura in una sfera di 3 metri effettua un TS su Costituzione: subisce 3d8 danni da tuono se fallisce, o la metà se riesce. I costrutti e gli oggetti hanno svantaggio al tiro.\n\nA livelli superiori: I danni aumentano di 1d8 per ogni livello dello slot sopra il 2º.","rituale":false,"da":"3d8","daHigher":"1d8"},"guardiano della fede":{"it":"Guardiano della Fede","lv":4,"sc":"Evocazione","ca":"A","ra":"9 metri","du":"8 ore","co":"V","de":"Un guardiano spettrale di taglia Grande appare in uno spazio libero. Qualsiasi nemico si muova entro 3 metri da esso deve superare un TS su Destrezza o subire 20 danni radiosi (metà se supera). Il guardiano svanisce dopo aver inflitto 60 danni totali.","rituale":false},"guarigione":{"it":"Guarigione","lv":6,"sc":"Abiurazione","ca":"A","ra":"18 metri","du":"Istantanea","co":"V,S","de":"L'incantatore infonde un'ondata di energia curativa in una creatura. Il bersaglio recupera 70 punti ferita. Questo incantesimo pone fine anche a cecità, sordità e a qualsiasi malattia che affligga il bersaglio.\n\nA livelli superiori: La quantità di punti ferita recuperati aumenta di 10 per ogni livello dello slot sopra il 6º.","rituale":false},"individuazione del magico":{"it":"Individuare la Magia","lv":1,"sc":"Divinazione","ca":"A","ra":"Incantatore (9 metri)","du":"Concentrazione, fino a 10 minuti","co":"V,S","de":"L'incantatore percepisce la presenza di magia entro 9 metri. Può usare un'azione per vedere un'aura debole attorno a creature o oggetti magici e conoscere la loro scuola di magia. Può penetrare barriere comuni ma è bloccato da metallo o piombo.","rituale":true},"intimorire infernale":{"it":"Punizione Infernale","lv":1,"sc":"Invocazione","ca":"R","ra":"18 metri","du":"Istantanea","co":"V,S","de":"In risposta al subire danni, l'incantatore punta il dito contro l'aggressore, che viene avvolto da fiamme. Il bersaglio effettua un TS su Destrezza: subisce 2d10 danni da fuoco se fallisce, o la metà se riesce.\n\nA livelli superiori: I danni aumentano di 1d10 per ogni livello dello slot sopra il 1º.","rituale":false,"da":"2d10","daHigher":"1d10"},"identificare":{"it":"Identificare","lv":1,"sc":"Divinazione","ca":"special","ra":"Contatto","du":"Istantanea","co":"V,S,M (una perla del valore di almeno 100 mo e una piuma di gufo)","de":"L'incantatore tocca un oggetto per tutta la durata del lancio. Se si tratta di un oggetto magico, ne apprende le proprietà e come usarle, se richiede sintonia e quante cariche ha. Se tocca una creatura, apprende quali incantesimi la stanno influenzando.","rituale":true},"immagine maggiore":{"it":"Immagine Maggiore","lv":3,"sc":"Illusione","ca":"A","ra":"36 metri","du":"Concentrazione, fino a 10 minuti","co":"V,S,M (un pizzico di lana)","de":"L'incantatore crea l'immagine di un oggetto, una creatura o un altro fenomeno visibile che non superi un cubo con spigolo di 6 metri. L'illusione include suoni, odori e calore. Se l'incantatore usa uno slot di 6º livello o superiore, l'incantesimo dura finché non viene dissolto senza richiedere concentrazione.","rituale":false},"immagine silenziosa":{"it":"Immagine Silenziosa","lv":1,"sc":"Illusione","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 10 minuti","co":"V,S,M (un pizzico di lana)","de":"L'incantatore crea l'immagine visiva di un oggetto, una creatura o un altro fenomeno che non superi un cubo con spigolo di 4,5 metri. L'illusione è puramente visiva e non include suoni o altri sensi.","rituale":false},"immagine speculare":{"it":"Immagine Speculare","lv":2,"sc":"Illusione","ca":"A","ra":"Personale","du":"1 minuto","co":"V,S","de":"Tre duplicati illusori dell'incantatore appaiono nel suo spazio. Ogni volta che una creatura bersaglia l'incantatore con un attacco, deve tirare un d20 per determinare se l'attacco colpisce lui o uno dei duplicati. La CA di un duplicato è 10 + mod. Destrezza.","rituale":false},"impersonare (camuffare sé stesso)":{"it":"Camuffare Sé Stesso","lv":1,"sc":"Illusione","ca":"A","ra":"Personale","du":"1 ora","co":"V,S","de":"L'incantatore cambia il proprio aspetto, inclusi vestiti e armi. Può apparire più alto o più basso di 30 cm, ma la struttura fisica deve rimanere simile. Una creatura può esaminare l'illusione con una prova di Intelligenza (Indagare) contro la CD dell'incantatore.","rituale":false},"incenerire (palla di fuoco)":{"it":"Palla di Fuoco","lv":3,"sc":"Invocazione","ca":"A","ra":"45 metri","du":"Istantanea","co":"V,S,M (una pallina di guano di pipistrello e dello zolfo)","de":"Un'esplosione di fiamme divampa in una sfera di 6 metri di raggio. Ogni creatura nell'area deve effettuare un tiro salvezza su Destrezza. Se lo fallisce, subisce 8d6 danni da fuoco, altrimenti la metà. Il fuoco si diffonde oltre gli angoli.\n\nA livelli superiori: Il danno aumenta di 1d6 per ogni livello dello slot sopra il 3º.","rituale":false,"da":"8d6","daHigher":"1d6","sv":"dex"},"individuazione dei pensieri":{"it":"Individuare i Pensieri","lv":2,"sc":"Divinazione","ca":"A","ra":"Personale","du":"Concentrazione, fino a 1 minuto","co":"V,S,M (una moneta di rame)","de":"L'incantatore percepisce i pensieri superficiali delle creature entro 9 metri. Può tentare di sondare più a fondo nei pensieri di una creatura; il bersaglio deve effettuare un tiro salvezza su Saggezza. Se fallisce, l'incantatore apprende i suoi ragionamenti, le emozioni e ciò che la preoccupa.","rituale":false,"sv":"wis"},"infuocare (mani brucianti)":{"it":"Mani Brucianti","lv":1,"sc":"Invocazione","ca":"A","ra":"Personale (cono di 4,5 metri)","du":"Istantanea","co":"V,S","de":"Un cono di fiamme scaturisce dalle mani dell'incantatore. Ogni creatura nell'area deve effettuare un tiro salvezza su Destrezza. Se lo fallisce, subisce 3d6 danni da fuoco, altrimenti la metà.\n\nA livelli superiori: Il danno aumenta di 1d6 per ogni livello dello slot sopra il 1º.","rituale":false,"da":"3d6","daHigher":"1d6","sv":"dex"},"invisibilità":{"it":"Invisibilità","lv":2,"sc":"Illusione","ca":"A","ra":"Contatto","du":"Concentrazione, fino a 1 ora","co":"V,S,M (un ciglio avvolto nella gomma arabica)","de":"Una creatura toccata diventa invisibile. Tutto ciò che il bersaglio indossa o trasporta è invisibile finché rimane addosso a lui. L'incantesimo termina se il bersaglio attacca o lancia un incantesimo.\n\nA livelli superiori: L'incantatore può rendere invisibile una creatura aggiuntiva per ogni livello dello slot sopra il 2º.","rituale":false},"lentezza":{"it":"Lentezza","lv":3,"sc":"Trasmutazione","ca":"A","ra":"36 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S,M (una goccia di melassa)","de":"L'incantatore altera il tempo per un massimo di sei creature in un cubo con spigolo di 12 metri. I bersagli devono superare un TS su Saggezza, altrimenti la loro velocità è dimezzata, hanno -2 alla CA e ai TS su Destrezza, e non possono usare reazioni. Possono effettuare un'unica azione o un'azione bonus nel loro turno, ma non entrambe.","rituale":false},"luci danzanti":{"it":"Luci Danzanti","lv":0,"sc":"Illusione","ca":"A","ra":"36 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S,M (un frammento di fosforo)","de":"L'incantatore crea fino a quattro luci grandi come torce che fluttuano nell'aria. Può muoverle fino a 18 metri come azione bonus. Le luci possono apparire come torce, lanterne o sfere luminose, oppure possono essere fuse in un'unica forma vagamente umana di taglia Media[cite: 16].","rituale":false},"luce":{"it":"Luce","lv":0,"sc":"Invocazione","ca":"A","ra":"Contatto","du":"1 ora","co":"V,M (una lucciola o del muschio fosforescente)","de":"L'incantatore tocca un oggetto non più grande di 3 metri. L'oggetto emette luce intensa in un raggio di 6 metri e luce fioca per altri 6 metri. Se l'oggetto viene coperto da qualcosa di opaco, la luce viene bloccata.","rituale":false},"mano magica":{"it":"Mano Magica","lv":0,"sc":"Evocazione","ca":"A","ra":"9 metri","du":"1 minuto","co":"V,S","de":"Una mano spettrale e fluttuante appare in un punto scelto. L'incantatore può usarla per manipolare oggetti, aprire porte non bloccate, o versare il contenuto di fiale. La mano non può attaccare né sollevare più di 4,5 kg.","rituale":false},"messaggio":{"it":"Messaggio","lv":0,"sc":"Trasmutazione","ca":"A","ra":"36 metri","du":"1 round","co":"V,S,M (un breve pezzo di filo di rame)","de":"L'incantatore punta il dito verso una creatura e sussurra un messaggio. Il bersaglio sente il messaggio e può rispondere con un sussurro che solo l'incantatore sente. Può passare attraverso barriere magiche o materiali comuni se l'incantatore conosce il percorso.","rituale":false},"mimetismo (passo senza tracce)":{"it":"Mimetismo (Passo Senza Tracce)","lv":2,"sc":"Abiurazione","ca":"A","ra":"Personale (emanazione di 9 metri)","du":"Concentrazione, fino a 1 ora","co":"V,S,M (cenere di foglie di vischio bruciate e un rametto di abete)","de":"Un velo di ombre e silenzio avvolge l'incantatore e i suoi alleati. Ogni creatura scelta entro 9 metri ottiene un bonus di +10 alle prove di Destrezza (Furtività) e non può essere tracciata se non con mezzi magici. Non lascia impronte.","rituale":false},"muro di fuoco":{"it":"Muro di Fuoco","lv":4,"sc":"Invocazione","ca":"A","ra":"36 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S,M (un pezzetto di fosforo)","de":"L'incantatore crea un muro di fiamme lungo fino a 18 metri o un anello di 6 metri di diametro. Una creatura che termina il turno entro 3 metri dal lato caldi subisce 5d8 danni da fuoco. Una creatura subisce lo stesso danno quando entra nel muro per la prima volta nel turno o vi termina il turno.\n\nA livelli superiori: Il danno aumenta di 1d8 per ogni livello dello slot sopra il 4º.","rituale":false,"da":"5d8","daHigher":"1d8"},"muro di forza":{"it":"Muro di Forza","lv":5,"sc":"Invocazione","ca":"A","ra":"36 metri","du":"Concentrazione, fino a 10 minuti","co":"V,S,M (un pizzico di polvere di diamante)","de":"L'incantatore crea una barriera invisibile di forza magica. Può essere una superficie piana (fino a dieci pannelli di 3 metri per lato) o una semisfera/cupola (raggio fino a 3 metri). Nulla può attraversare fisicamente il muro, che è immune a ogni danno.","rituale":false},"muro di pietra":{"it":"Muro di Pietra","lv":5,"sc":"Invocazione","ca":"A","ra":"36 metri","du":"Concentrazione, fino a 10 minuti","co":"V,S,M (un blocco di granito)","de":"L'incantatore crea un muro di pietra solida composto da dieci pannelli (3 metri per lato, spessore 15 cm). Ogni pannello ha CA 15 e 30 PF per ogni 2,5 cm di spessore. Se la concentrazione viene mantenuta per l'intera durata, il muro diventa permanente.","rituale":false},"nebbia oscurante":{"it":"Nube di Nebbia","lv":1,"sc":"Evocazione","ca":"A","ra":"36 metri","du":"Concentrazione, fino a 1 ora","co":"V,S","de":"L'incantatore crea una sfera di nebbia con raggio di 6 metri centrata su un punto. L'area è pesantemente oscurata. Un vento moderato (almeno 15 km/h) disperde la nebbia dopo 1 round.\n\nA livelli superiori: Il raggio della nebbia aumenta di 6 metri per ogni livello dello slot sopra il 1º.","rituale":false},"onda tonante":{"it":"Onda Tonante","lv":1,"sc":"Invocazione","ca":"A","ra":"Personale (cubo di 4,5 metri)","du":"Istantanea","co":"V,S","de":"Un'ondata di forza tonante si sprigiona dall'incantatore. Ogni creatura nel cubo deve effettuare un TS su Costituzione: subisce 2d8 danni da tuono e viene spinta 3 metri lontano se fallisce, o metà danni se riesce[cite: 667]. Gli oggetti non fissati vengono spinti automaticamente.\n\nA livelli superiori: Il danno aumenta di 1d8 per ogni livello dello slot sopra il 1º.","rituale":false,"da":"2d8","daHigher":"1d8"},"parola guaritrice":{"it":"Parola Guaritrice","lv":1,"sc":"Abiurazione","ca":"AB","ra":"18 metri","du":"Istantanea","co":"V","de":"Una creatura a scelta entro gittata recupera un ammontare di punti ferita pari a 2d4 più il modificatore di caratteristica da incantatore[cite: 404]. L'incantesimo non ha effetto su non morti o costrutti.\n\nA livelli superiori: La guarigione aumenta di 2d4 per ogni livello dello slot sopra il 1º[cite: 405].","rituale":false,"daHigher":"2d4","da":"2d4"},"parola guaritrice di massa":{"it":"Parola Guaritrice di Massa","lv":3,"sc":"Abiurazione","ca":"AB","ra":"18 metri","du":"Istantanea","co":"V","de":"Fino a sei creature a scelta entro gittata recuperano 2d4 punti ferita più il modificatore di caratteristica da incantatore[cite: 406]. Non ha effetto su non morti o costrutti.\n\nA livelli superiori: La guarigione aumenta di 1d4 per ogni livello dello slot sopra il 3º.","rituale":false,"da":"2d4","daHigher":"1d4"},"passo veloce (passo d'urto)":{"it":"Passo Velato","lv":1,"sc":"Trasmutazione","ca":"AB","ra":"Personale","du":"1 round","co":"V","de":"La velocità dell'incantatore aumenta di 3 metri fino alla fine del turno corrente, e il movimento non provoca attacchi d'opportunità.","rituale":false},"pelle coracea (pelle di pietra)":{"it":"Pelle di Pietra","lv":4,"sc":"Abiurazione","ca":"A","ra":"Contatto","du":"Concentrazione, fino a 1 ora","co":"V,S,M (polvere di diamante del valore di almeno 100 mo, consumata dall'incantesimo)","de":"L'incantatore tocca una creatura consenziente. Fino al termine dell'incantesimo, la carne del bersaglio diventa dura come la pietra, e il bersaglio ha resistenza ai danni contundenti, perforanti e taglienti non magici.","rituale":false},"paura":{"it":"Paura","lv":3,"sc":"Illusione","ca":"A","ra":"Personale (cono di 9 metri)","du":"Concentrazione, fino a 1 minuto","co":"V,S,M (una piuma bianca o il cuore di una gallina)","de":"L'incantatore proietta un'immagine visiva delle peggiori paure dei bersagli. Ogni creatura nel cono deve superare un TS su Saggezza o lasciar cadere ciò che tiene in mano e diventare spaventata. Finché è spaventata, la creatura deve usare l'azione di Scatto per allontanarsi dall'incantatore lungo il percorso più breve.","rituale":false},"presagio":{"it":"Presagio","lv":2,"sc":"Divinazione","ca":"special","ra":"Personale","du":"Istantanea","co":"V,S,M (bastoncini, ossa o carte del valore di 25 mo [cite: 418])","de":"L'incantatore riceve un presagio su un corso d'azione che intende intraprendere entro i prossimi 30 minuti. Il GM sceglie tra: Bene, Male, Bene e Male, o Nessun risultato particolare[cite: 418, 419].","rituale":true},"protezione dal bene e dal male":{"it":"Protezione dal Bene e dal Male","lv":1,"sc":"Abiurazione","ca":"A","ra":"Contatto","du":"Concentrazione, fino a 10 minuti","co":"V,S,M (acqua santa o polvere d'argento e ferro)","de":"Una creatura toccata è protetta contro aberrazioni, celestiali, elementali, folletti, immondi e non morti. Tali creature hanno svantaggio ai tiri per colpire contro il bersaglio, e il bersaglio non può essere affascinato, spaventato o posseduto da esse.","rituale":false},"protezione dall'energia":{"it":"Protezione dall'Energia","lv":3,"sc":"Abiurazione","ca":"A","ra":"Contatto","du":"Concentrazione, fino a 1 ora","co":"V,S","de":"Una creatura toccata ottiene resistenza a un tipo di danno a scelta tra: acido, freddo, fuoco, fulmine o tuono.","rituale":false},"purificare cibo e bevande":{"it":"Purificare Cibo e Bevande","lv":1,"sc":"Trasmutazione","ca":"A","ra":"3 metri","du":"Istantanea","co":"V,S","de":"L'incantatore rimuove veleno e marciume da cibi e bevande non magici in una sfera di 1,5 metri di raggio[cite: 430].","rituale":true},"quadro mentale (scrutare)":{"it":"Scrutare","lv":5,"sc":"Divinazione","ca":"A","ra":"Personale","du":"Concentrazione, fino a 10 minuti","co":"V,S,M (un focus del valore di almeno 1.000 mo (specchio d'argento o sfera di cristallo))","de":"L'incantatore può vedere e sentire una creatura a scelta che si trovi sul suo stesso piano. Il bersaglio deve effettuare un TS su Saggezza, modificato da quanto bene l'incantatore lo conosce e dalla sua connessione fisica.","rituale":false},"raggio di affaticamento":{"it":"Raggio di Indebolimento","lv":2,"sc":"Necromanzia","ca":"A","ra":"18 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S","de":"Un raggio di energia scaturisce verso una creatura. Il bersaglio deve effettuare un TS su Costituzione: se fallisce, subisce svantaggio alle prove basate sulla Forza e sottrae 1d8 dai suoi tiri per i danni. Se riesce, subisce solo svantaggio al suo prossimo tiro per colpire fino all'inizio del turno successivo dell'incantatore.\n\nA livelli superiori: I danni aumentano di 1d6 per ogni livello dello slot sopra il 2º.","rituale":false,"daHigher":"1d6"},"raggio di gelo":{"it":"Raggio di Gelo","lv":0,"sc":"Invocazione","ca":"A","ra":"18 metri","du":"Istantanea","co":"V,S","de":"Un raggio gelido di luce colpisce una creatura. L'incantatore effettua un attacco a distanza con incantesimo: se colpisce, il bersaglio subisce 1d8 danni da freddo e la sua velocità è ridotta di 3 metri fino all'inizio del turno successivo dell'incantatore.\n\nA livelli superiori: I danni aumentano di 1d8 ai livelli 5 (2d8), 11 (3d8) e 17 (4d8).","rituale":false,"da":"1d8","daHigher":"1d8"},"rigenerazione":{"it":"Rigenerazione","lv":7,"sc":"Trasmutazione","ca":"special","ra":"Contatto","du":"1 ora","co":"V,S,M (una ruota della preghiera)","de":"Una creatura toccata recupera 4d8 + 15 punti ferita. Per la durata, il bersaglio recupera 1 punto ferita all'inizio di ogni suo turno e qualsiasi parte del corpo recisa ricresce dopo 2 minuti.","rituale":false,"da":"4d8+15"},"rimuovi maledizione":{"it":"Rimuovere Maledizione","lv":3,"sc":"Abiurazione","ca":"A","ra":"Contatto","du":"Istantanea","co":"V,S","de":"Tutte le maledizioni che affliggono una creatura o un oggetto terminano. Per un oggetto magico maledetto, la maledizione rimane ma l'incantesimo spezza la sintonia del proprietario col bene.","rituale":false},"rinascita (revivify)":{"it":"Rinascita (Revivify)","lv":3,"sc":"Necromanzia","ca":"A","ra":"Contatto","du":"Istantanea","co":"V,S,M (un diamante del valore di almeno 300 mo, consumato dall'incantesimo)","de":"L'incantatore tocca una creatura morta nell'ultimo minuto. La creatura torna in vita con 1 punto ferita. Non può riparare organi o arti mancanti.","rituale":false},"riparare":{"it":"Riparare","lv":0,"sc":"Trasmutazione","ca":"special","ra":"Contatto","du":"Istantanea","co":"V,S,M (due calamite)","de":"Ripara una singola crepa o squarcio (massimo 30 cm) in un oggetto toccato. Può riparare fisicamente un oggetto magico, ma non ne ripristina la magia.","rituale":false},"riposo inviolato":{"it":"Riposo Inviolato","lv":2,"sc":"Necromanzia","ca":"A","ra":"Contatto","du":"10 giorni","co":"V,S,M (2 monete di rame, consumate dall'incantesimo)","de":"Protegge un cadavere dalla decomposizione e impedisce che diventi un non morto. Estende il limite di tempo per gli incantesimi di rianimazione.","rituale":true},"risata incontenibile (di tasha)":{"it":"Ilarità di Tasha","lv":1,"sc":"Ammaliamento","ca":"A","ra":"9 metri","du":"Concentrazione, fino a 1 minuto","co":"V,S,M (una crostata e una piuma)","de":"Una creatura che fallisce un TS su Saggezza cade a terra prona, diventando incapacitata e incapace di rialzarsi dalle risate. Il bersaglio ripete il TS alla fine di ogni turno e ogni volta che subisce danni.","rituale":false},"scagliare maledizione":{"it":"Maledire","lv":3,"sc":"Necromanzia","ca":"A","ra":"Contatto","du":"Concentrazione, fino a 1 minuto","co":"V,S","de":"Toccando una creatura, l'incantatore le infligge una maledizione (TS Saggezza). Gli effetti includono svantaggio alle prove di una caratteristica, svantaggio ai tiri contro l'incantatore, o perdita dell'azione in cambio di Schivata.\n\nA livelli superiori: Con slot di 4º livello la durata è 10 min. Dal 5º livello in su non richiede concentrazione e dura 8 ore o più.","rituale":false},"scritto illusorio":{"it":"Scr // Estrae automaticamente dado danno, scaling e tipo TS da una descrizione,
// sia in italiano che in inglese — usato per incantesimi custom senza dati salvati
function autoDetectSpellDice(desc){
  if(!desc)return{da:null,daHigher:null,sv:null};
  let da=null,daHigher=null,sv=null;

  // ── DADO BASE (italiano + inglese) ──
  let m=desc.match(/(\d+d\d+)(?:\s*\+\s*(?:\d+|il modificatore[^,.]*?))?\s+(?:danni|punti ferita)/i);
  if(!m)m=desc.match(/(\d+d\d+)\s+(?:damage|hit points|hp)/i);
  if(!m)m=desc.match(/recupera[^.]*?pari a (\d+d\d+)/i);
  if(!m)m=desc.match(/(?:regains?|recovers?)[^.]*?(\d+d\d+)/i);
  if(!m)m=desc.match(/subisce (\d+d\d+)/i);
  if(!m)m=desc.match(/(?:takes?|suffers?)[^.]*?(\d+d\d+)/i);
  if(m)da=m[1].toLowerCase();

  // ── SCALING ──
  let higherText=null;
  let hm=desc.match(/A livelli superiori:(.+?)$/is);
  if(hm)higherText=hm[1];
  if(!higherText){
    hm=desc.match(/At Higher Levels\.?:?(.+?)$/is);
    if(hm)higherText=hm[1];
  }
  if(higherText){
    let sm2=higherText.match(/aument[ao]no?\s+(?:di\s+)?(\d+d\d+)/i);
    if(!sm2)sm2=higherText.match(/increases? by (\d+d\d+)/i);
    if(!sm2)sm2=higherText.match(/\+\s*(\d+d\d+)\s+per/i);
    if(sm2)daHigher=sm2[1].toLowerCase();
  }

  // ── TIRO SALVEZZA ──
  let sm3=desc.match(/tiro salvezza su (Forza|Destrezza|Costituzione|Intelligenza|Saggezza|Carisma)/i);
  if(sm3){
    const map={forza:'str',destrezza:'dex',costituzione:'con',intelligenza:'int',saggezza:'wis',carisma:'cha'};
    sv=map[sm3[1].toLowerCase()];
  }
  if(!sv){
    sm3=desc.match(/(Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma) saving throw/i);
    if(sm3){
      const map={strength:'str',dexterity:'dex',constitution:'con',intelligence:'int',wisdom:'wis',charisma:'cha'};
      sv=map[sm3[1].toLowerCase()];
    }
  }

  return{da,daHigher,sv};
}

function lkS(n,edition){
  if(!n)return null;
  const key=n.toLowerCase().trim();
  const ed=edition||C.spellEdition||'2014';
  const SRD=ed==='2024'?SRD24:SRD14;
  // Search SRD first (most complete)
  if(SRD[key])return SRD[key];
  // Search other edition as fallback
  const SRD_other=ed==='2024'?SRD14:SRD24;
  if(SRD_other[key])return SRD_other[key];
  // Search by Italian name in both DBs
  for(const v of Object.values(SRD)){if(v.it&&v.it.toLowerCase()===key)return v;}
  for(const v of Object.values(SRD_other)){if(v.it&&v.it.toLowerCase()===key)return v;}
  // Fallback to old hand-written SD
  if(SD[key])return SD[key];
  for(const v of Object.values(SD)){if(v.it&&v.it.toLowerCase()===key)return v;}
  return null;
}

// ── Sistema Undo: salva snapshot prima di ogni modifica ──
let _undoStack=[];
const UNDO_MAX=15;
let _undoSnapshotTimer=null;
function pushUndoSnapshot(){
  // Debounce: non salvare uno snapshot per ogni singolo keystroke
  clearTimeout(_undoSnapshotTimer);
  _undoSnapshotTimer=setTimeout(()=>{
    try{
      const snap=JSON.stringify(C);
      if(_undoStack.length===0||_undoStack[_undoStack.length-1]!==snap){
        _undoStack.push(snap);
        if(_undoStack.length>UNDO_MAX)_undoStack.shift();
      }
    }catch(e){}
  },1500);
}
function undoLastChange(){
  if(_undoStack.length<2){alert('Nessuna modifica precedente da annullare.');return;}
  _undoStack.pop(); // rimuovi lo stato corrente
  const prev=_undoStack[_undoStack.length-1];
  try{
    const restored=JSON.parse(prev);
    C=restored;
    save();
    render();
  }catch(e){alert('Errore nel ripristino.');}
}

function pactMagicTable(warlockLv){
  if(warlockLv<1)return{m:0,lv:0};
  if(warlockLv===1)return{m:1,lv:1};
  if(warlockLv<=10)return{m:2,lv:Math.ceil(warlockLv/2)};

// Recupera le risorse che si ricaricano con il tipo di riposo specificato ('short' o 'long')
function rechargeResources(restType){
  if(!C.res)return;
  C.res.forEach(r=>{
    const rt=r.recharge||'long';
    if(rt==='none')return;
    if(restType==='long'&&(rt==='long'||rt==='short')){r.cur=r.max||1;}
    else if(restType==='short'&&rt==='short'){r.cur=r.max||1;}
  });
}
function roll(f){
  if(!f||!f.trim())return{t:0,r:[],f:'0'};
  // Gestisce formule come "2d6+3", "1d8", "5", "2d6+1d4+3"
  let total=0;const allRolls=[];
  const formula=String(f).trim();
  // Separa in termini (es. "2d6+1d4+3" → ["2d6","1d4","3"])
  const terms=formula.replace(/\s/g,'').match(/[+-]?[^+-]+/g)||[];
  terms.forEach(term=>{
    const sign=term.startsWith('-')?-1:1;
    const t=term.replace(/^[+-]/,'');
    const dm=t.match(/^(\d+)d(\d+)$/i);
    if(dm){
      const n=parseInt(dm[1]),s=parseInt(dm[2]);
      const r=Array.from({length:n},()=>Math.floor(Math.random()*s)+1);
      allRolls.push(...r.map(v=>sign*v));
      total+=sign*r.reduce((a,b)=>a+b,0);
    } else {
      const v=parseInt(t)||0;
      total+=sign*v;
      if(v!==0)allRolls.push(sign*v);
    }
  });
  return{t:total,r:allRolls,f:formula};
}

// Funzione helper per costruire formula danni con stat e extra
function buildDmgFormula(dmgDice, statKey, extraBonus){
  const S={str:sm(C.str),dex:sm(C.dex),con:sm(C.con),int:sm(C.int),wis:sm(C.wis),cha:sm(C.cha)};
  let formula=dmgDice||'1d4';
  const statMod=S[statKey]||0;
  const extra=Number(extraBonus)||0;
  if(statMod>0)formula+='+'+statMod;
  else if(statMod<0)formula+=statMod;
  if(extra>0)formula+='+'+extra;
  else if(extra<0)formula+=extra;
  return formula;
}

function addRpopCloseBtn(p){
