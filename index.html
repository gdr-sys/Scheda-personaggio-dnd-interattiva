  // poi aggiunge header fisso con X in cima
  const existingChildren=Array.from(p.childNodes);
  const body=mk('div',{style:{overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'8px 22px 8px 12px',flex:'1',minHeight:'0'}});
  existingChildren.forEach(ch=>body.appendChild(ch));
  const hdr=mk('div',{style:{display:'flex',justifyContent:'flex-end',padding:'4px 6px 0',flexShrink:'0',background:'var(--card)',borderRadius:'8px 8px 0 0'}});
  const closeBtn=mk('span',{style:{color:'var(--td)',fontSize:'16px',cursor:'pointer',lineHeight:'1',padding:'2px 8px',userSelect:'none'},title:'Chiudi'},['✕']);
  closeBtn.addEventListener('click',()=>{p.style.display='none';clearTimeout(rpt);});
  hdr.appendChild(closeBtn);
  p.innerHTML='';
  p.appendChild(hdr);
  p.appendChild(body);
  // Imposta display flex sul popup (non 'block') per attivare il layout colonna
  // Le chiamate a p.style.display='block' successive vengono sovrascritte da questo
  // Nota: il chiamante farà p.style.display='block' dopo — va bene, ma dobbiamo
  // usare flex. Sovrascriviamo con un piccolo trick: monitoriamo con requestAnimationFrame
  // OPPURE più semplicemente: dopo la chiamata a addRpopCloseBtn, il chiamante
  // fa display='block' — noi qui forziamo flex con !important via style inline
  p.style.setProperty('display','flex','important');
}

function showAttackRoll(atk, isSpell){
  const S={str:sm(C.str),dex:sm(C.dex),con:sm(C.con),int:sm(C.int),wis:sm(C.wis),cha:sm(C.cha)};
  const pb=C.prof||2;
  const statKey=atk.stat||'str';
  const statMod=S[statKey]||0;
  const hasPr=!!atk.pr;
  const extra=Number(atk.ex)||0;
  const hitBonus=statMod+(hasPr?pb:0)+extra;

  // Edizione e ispirazione
  const _ed=C.baseEdition||'2014';
  const _hasIns=(C.ins||0)>0;

  // 2014: ispirazione = vantaggio immediato sui dadi prima del tiro
  let hitD20, hitTotal, isCrit, isFumble;
  if(_hasIns && _ed==='2014'){
    const r1=Math.floor(Math.random()*20)+1;
    const r2=Math.floor(Math.random()*20)+1;
    hitD20=Math.max(r1,r2);
    C.ins=Math.max(0,(C.ins||0)-1);save();
    isCrit=hitD20===20;isFumble=hitD20===1;
    hitTotal=hitD20+hitBonus;
    // Nota sul vantaggio: la aggiungiamo dopo nel breakdown
  } else {
    const hitRoll=roll('1d20');
    hitD20=hitRoll.r[0];
    isCrit=hitD20===20;isFumble=hitD20===1;
    hitTotal=hitD20+hitBonus;
  }

  // Formula danni
  const dmgStatKey=atk.dmgStat||atk.stat||'str';
  const dmgMod=dmgStatKey==='none'?0:(S[dmgStatKey]||0);
  const dmgExtra=Number(atk.ex)||0;
  const dmgDice=atk.dmg||'1d6';

  // Rage bonus (solo corpo a corpo, solo se in furia, solo Barbaro)
  const _rageRes=C.raging&&C.res?C.res.find(r=>r._scalingKey==='rage'):null;
  const _rageDmg=_rageRes?parseInt((_rageRes.die||'+2').replace(/[^0-9]/g,''))||2:0;
  const _isRaging=!!C.raging && _rageDmg>0 && !isSpell && !(atk.ranged);

  let dmgFormula=dmgDice;
  if(dmgMod>0)dmgFormula+='+'+dmgMod;
  else if(dmgMod<0)dmgFormula+=dmgMod;
  if(dmgExtra>0)dmgFormula+='+'+dmgExtra;
  else if(dmgExtra<0)dmgFormula+=dmgExtra;
  if(_isRaging)dmgFormula+='+'+_rageDmg;

  // Tiro danni
  let dmgResult, critResult=null;
  if(isCrit && atk.cd){
    critResult=roll(atk.cd);
  } else {
    dmgResult=roll(dmgFormula);
  }

  // Costruisci il popup
  const p=document.getElementById('rpop');
  p.innerHTML='';

  // Titolo
  const titleColor=isCrit?'var(--gl)':isFumble?'var(--rl)':'var(--td)';
  p.appendChild(mk('div',{style:{color:titleColor,fontFamily:'var(--ft)',fontSize:'11px',marginBottom:'6px',letterSpacing:'1px'}},
    [atk.n||(isSpell?'Incantesimo':'Attacco'),(isCrit?' ⭐ CRITICO!':(isFumble?' 💀 MANCATO!':''))]
  ));

  const row=mk('div',{style:{display:'flex',gap:'10px',alignItems:'flex-start'}});

  // Colonna: Colpire
  const hitCol=mk('div',{style:{textAlign:'center',flex:'1'}});
  hitCol.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',marginBottom:'2px'}},['COLPIRE']));
  hitCol.appendChild(mk('div',{style:{color:isCrit?'var(--gl)':isFumble?'var(--rl)':'var(--text)',fontFamily:'var(--ft)',fontSize:'24px',lineHeight:'1'}},[String(hitTotal)]));
  // Breakdown
  let hitBreak='d20('+hitD20+')';
  if(_hasIns && _ed==='2014')hitBreak=' Vantaggio ♦ d20('+hitD20+')';
  if(statMod!==0)hitBreak+=(statMod>0?'+':'')+statMod+'('+statKey.toUpperCase()+')';
  if(hasPr)hitBreak+=(pb>0?'+':'')+pb+'(comp)';
  if(extra!==0)hitBreak+=(extra>0?'+':'')+extra;
  hitCol.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'9px',marginTop:'2px',lineHeight:'1.3'}},[hitBreak]));
  row.appendChild(hitCol);

  // Separatore
  row.appendChild(mk('div',{style:{width:'1px',background:'var(--border)',alignSelf:'stretch'}}));

  // Colonna: Danni
  const dmgCol=mk('div',{style:{textAlign:'center',flex:'1'}});
  if(isCrit&&atk.cd){
    dmgCol.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',marginBottom:'2px'}},['CRITICO']));
    dmgCol.appendChild(mk('div',{style:{color:'var(--rl)',fontFamily:'var(--ft)',fontSize:'24px',lineHeight:'1'}},[String(critResult.t)]));
    dmgCol.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'9px',marginTop:'2px'}},[atk.cd+' → ['+critResult.r.join(',')+']']));
  } else {
    dmgCol.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',marginBottom:'2px'}},['DANNI']));
    dmgCol.appendChild(mk('div',{style:{color:'var(--rl)',fontFamily:'var(--ft)',fontSize:'24px',lineHeight:'1'}},[String(dmgResult.t)]));
    const dmgBreak=dmgFormula+' \u2192 ['+dmgResult.r.join(',')+']';
    dmgCol.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'9px',marginTop:'2px'}},[dmgBreak]));
    if(_isRaging)dmgCol.appendChild(mk('div',{style:{color:'var(--rl)',fontSize:'9px',marginTop:'1px'}},['⚔ +'+_rageDmg+' Furia incluso']));
  }
  row.appendChild(dmgCol);
  p.appendChild(row);

  // ── Ispirazione 2024: offri ritiro dopo aver visto il d20 ──
  if(!isFumble && !isCrit && (C.ins||0)>0 && (C.baseEdition||'2014')==='2024'){
    const insBtn=BTN('✧ Usa Ispirazione Eroica — Ritira il d20',()=>{
      C.ins=Math.max(0,(C.ins||0)-1);save();
      const r2=Math.floor(Math.random()*20)+1;
      const newTotal=r2+hitBonus;
      const newCrit=r2===20;const newFumble=r2===1;
      // Aggiorna i valori mostrati inline
      hitCol.querySelector('div:nth-child(2)').textContent=String(newTotal);
      hitCol.querySelector('div:nth-child(2)').style.color=newCrit?'var(--gl)':newFumble?'var(--rl)':'var(--text)';
      hitCol.querySelector('div:nth-child(3)').textContent='d20('+r2+')'+(statMod!==0?(statMod>0?'+':'')+statMod+'('+statKey.toUpperCase()+')':'')+(hasPr?(pb>0?'+':'')+pb+'(comp)':'')+(extra!==0?(extra>0?'+':'')+extra:'')+' ← Ritiro';
      insBtn.replaceWith(mk('div',{style:{color:'var(--gold)',fontSize:'10px',textAlign:'center',marginTop:'4px'}},['✦ Ispirazione usata — '+r2+' → totale '+newTotal]));
    },'gold sm',{style:{width:'100%',marginTop:'6px',fontSize:'11px'}});
    p.appendChild(insBtn);
  }

  // ── Sneak Attack (Ladro) — try/catch per sicurezza ──
  try {
    // Cerca Ladro in multiclasse (case-insensitive) OPPURE in singola classe
    const rogLv=(()=>{
      if(C.classes&&C.classes.length>0){
        const rc=C.classes.find(c=>(c.name||'').toLowerCase()==='ladro'||(c.customName||'').toLowerCase()==='ladro');
        return rc?Number(rc.lv)||0:0;
      }
      return (C.cls||'').toLowerCase()==='ladro'?(C.lv||0):0;
    })();
    if(rogLv>0 && !isSpell){
      const snDice=Math.ceil(rogLv/2);
      const snFormula=snDice+'d6';
      const snSep=mk('div',{style:{height:'1px',background:'var(--border)',margin:'6px 0'}});
      p.appendChild(snSep);
      p.appendChild(mk('div',{style:{color:'var(--rl)',fontFamily:'var(--ft)',fontSize:'10px',letterSpacing:'1px',marginBottom:'4px'}},['ATTACCO FURTIVO — '+snFormula]));
      const snBtn=BTN('⚄ Tira Attacco Furtivo',()=>{
        const snResult=roll(snFormula);
        const snFinal=isCrit?roll(snDice*2+'d6'):snResult;
        const snRow2=mk('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginTop:'4px'}});
        snRow2.appendChild(mk('div',{style:{color:'var(--rl)',fontFamily:'var(--ft)',fontSize:'20px',flex:'0'}},[String(snFinal.t)]));
        snRow2.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'9px',flex:'1'}},[(isCrit?(snDice*2)+'d6':snFormula)+' → ['+snFinal.r.join(',')+']'+(isCrit?' (CRITICO)':'')]));
        snBtn.replaceWith(snRow2);
        clearTimeout(rpt); // Non auto-chiudere dopo il tiro — l'utente chiude con X
      },'sm',{style:{width:'100%',fontSize:'11px',borderColor:'var(--rl)',color:'var(--rl)'}});
      p.appendChild(snBtn);
    }
  } catch(e){console.warn('Sneak Attack error:',e);}

  // ── Divine Smite (Paladino) — try/catch per sicurezza ──
  try {
    // Cerca Paladino in multiclasse (case-insensitive) OPPURE in singola classe
    const palLv=(()=>{
      if(C.classes&&C.classes.length>0){
        const pc=C.classes.find(c=>(c.name||'').toLowerCase()==='paladino'||(c.customName||'').toLowerCase()==='paladino');
        return pc?Number(pc.lv)||0:0;
      }
      return (C.cls||'').toLowerCase()==='paladino'?(C.lv||0):0;
    })();
    if(palLv>0 && !isSpell){
      const smiteSlots=[];
      for(let l=1;l<=5;l++){
        const s=C.ss[l]||{m:0,u:0};
        const av=(s.m||0)-(s.u||0);
        if(av>0)smiteSlots.push({l,av});
      }
      const wlSmite=(typeof getWarlockLevel==='function')?getWarlockLevel():0;
      const pactAvSmite=wlSmite>0?Math.max(0,(C.pactMagic?.m||0)-(C.pactMagic?.u||0)):0;
      const pactLvSmite=C.pactMagic?.lv||1;
      if(pactAvSmite>0&&pactLvSmite<=5)smiteSlots.unshift({l:'pact_'+pactLvSmite,av:pactAvSmite,isPact:true});

      if(smiteSlots.length>0){
        const smSep=mk('div',{style:{height:'1px',background:'var(--border)',margin:'6px 0'}});
        p.appendChild(smSep);
        p.appendChild(mk('div',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'10px',letterSpacing:'1px',marginBottom:'4px'}},['DIVINE SMITE']));
        const smSel=mk('select',{style:{background:'var(--card)',border:'1px solid var(--gold)',color:'var(--gl)',borderRadius:'4px',padding:'3px 6px',fontSize:'11px',width:'100%',marginBottom:'4px'}});
        smiteSlots.forEach(sl=>{
          const isPact2=!!sl.isPact;
          const realLv=isPact2?pactLvSmite:sl.l;
          const smDice=1+realLv;
          const label=isPact2?'🔮 Slot Patto '+realLv+'° — '+smDice+'d8 ('+sl.av+' disp.)':'Slot '+realLv+'° — '+smDice+'d8 radiosi ('+sl.av+' disp.)';
          smSel.appendChild(mk('option',{value:isPact2?'pact':String(sl.l)},[label]));
        });
        p.appendChild(smSel);
        const undeadChk=mk('span',{cls:'chkb'},[]);
        let isUndead=false;
        undeadChk.addEventListener('click',()=>{
          isUndead=!isUndead;
          undeadChk.classList.toggle('on',isUndead);
          undeadChk.textContent=isUndead?'✦':'';
        });
        const undeadRow=ROW([undeadChk,mk('span',{style:{color:'var(--td)',fontSize:'11px'}},['Vs non morto/non naturale (+1d8)'])],{gap:'6px',marginBottom:'4px'});
        p.appendChild(undeadRow);
        const smBtn=BTN('⚄ Tira Divine Smite',()=>{
          const chosenVal=smSel.value;
          const isPact3=chosenVal==='pact';
          const chosenLv=isPact3?pactLvSmite:Number(chosenVal);
          const baseDice=1+chosenLv;
          const totalDice=baseDice+(isUndead?1:0);
          const smFormula=totalDice+'d8';
          const smFinal=isCrit?roll(totalDice*2+'d8'):roll(smFormula);
          if(isPact3){if(C.pactMagic)C.pactMagic.u=(C.pactMagic.u||0)+1;save();}
          else{if(C.ss[chosenLv]&&C.ss[chosenLv].u<C.ss[chosenLv].m){C.ss[chosenLv].u++;save();}}
          const smRow2=mk('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginTop:'4px'}});
          smRow2.appendChild(mk('div',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'20px',flex:'0'}},[String(smFinal.t)]));
          smRow2.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'9px',flex:'1'}},[(isCrit?(totalDice*2)+'d8':smFormula)+' radiosi → ['+smFinal.r.join(',')+']'+(isCrit?' (CRITICO)':'')+(isPact3?' 🔮 patto consumato':' slot '+chosenLv+'° consumato')]));
          smSel.remove();undeadRow.remove();smBtn.replaceWith(smRow2);
          clearTimeout(rpt); // Non auto-chiudere dopo il tiro — l'utente chiude con X
        },'gold sm',{style:{width:'100%',fontSize:'11px'}});
        p.appendChild(smBtn);
      }
    }
  } catch(e){console.warn('Divine Smite error:',e);}

  addRpopCloseBtn(p);
  p.style.display='block';
  clearTimeout(rpt); // Nessun auto-close per il popup attacchi — l'utente chiude con X
}

// Popup per incantesimo con CD
function showSpellRollPopup(spellName, dmgDice, saveAttr, baseLv, daHigher, isCantrip){
  const S={str:sm(C.str),dex:sm(C.dex),con:sm(C.con),int:sm(C.int),wis:sm(C.wis),cha:sm(C.cha)};
  const pb=C.prof||2;
  const scaMod=S[C.sca||'int']||0;
  const spCD=8+pb+scaMod;

  // Se non c'è scaling, tira direttamente senza chiedere il livello
  // (e se è un incantesimo livellato, consuma comunque lo slot base se disponibile)
  if(!daHigher || !dmgDice){
    let consumed=null;
    let consumedPactNS=null;
    let pactLvNS=null;
    if(!isCantrip && baseLv>0){
      const wlNS=getWarlockLevel();
      const pactAvNS=wlNS>0?Math.max(0,(C.pactMagic?.m||0)-(C.pactMagic?.u||0)):0;
      const pactLvNS2=C.pactMagic?.lv||1;
      const normalAvail=(C.ss[baseLv]?.m||0)-(C.ss[baseLv]?.u||0);
      const pactUsableNS=pactAvNS>0 && pactLvNS2>=baseLv;
      if(normalAvail>0){consumeSlotIfAvailable(baseLv);consumed=baseLv;}
      else if(pactUsableNS){C.pactMagic.u=(C.pactMagic.u||0)+1;save();consumedPactNS='pact';pactLvNS=pactLvNS2;}
    }
    renderSpellRollResult(spellName, dmgDice, saveAttr, spCD, pb, scaMod, consumed, consumedPactNS, pactLvNS);
    return;
  }

  // Per incantesimi livellati: trova quali slot normali e slot patto disponibili
  let availableLevels=[];
  const wlLvPopup=getWarlockLevel();
  const pactAvailPopup=wlLvPopup>0?Math.max(0,(C.pactMagic?.m||0)-(C.pactMagic?.u||0)):0;
  const pactLvPopup=C.pactMagic?.lv||1;

  if(!isCantrip){
    const minLv=baseLv||1;
    for(let l=minLv;l<=9;l++){
      const s=C.ss[l]||{m:0,u:0};
      const avail=(s.m||0)-(s.u||0);
      if(avail>0)availableLevels.push(l);
    }
    // Controlla se lo slot patto è utilizzabile (livello patto >= livello base incantesimo)
    const pactUsable=pactAvailPopup>0 && pactLvPopup>=(baseLv||1);
    const hasNormalSlots=availableLevels.length>0;

    if(!hasNormalSlots && !pactUsable){
      // Nessuno slot disponibile — avvisa
      const p=document.getElementById('rpop');
      p.innerHTML='';
      p.appendChild(mk('div',{style:{color:'var(--td)',fontFamily:'var(--ft)',fontSize:'11px',marginBottom:'6px',letterSpacing:'1px'}},[spellName]));
      p.appendChild(mk('div',{style:{color:'var(--rl)',fontSize:'12px',marginBottom:'8px'}},['⚠ Nessuno slot disponibile di livello '+(baseLv||1)+'° o superiore.']));
      p.appendChild(BTN('Chiudi',()=>{p.style.display='none';},'ghost',{style:{width:'100%'}}));
      addRpopCloseBtn(p);
      p.style.display='block';
      clearTimeout(rpt);
      return;
    }

    // Se entrambi disponibili → chiedi quale usare (con scelta nel selettore)
    // Se solo patto → usa automaticamente patto senza chiedere
    // Se solo normali → comportamento normale
    if(!hasNormalSlots && pactUsable){
      // Solo slot patto disponibili — usa direttamente
      let finalDice=dmgDice;
      if(daHigher){
        const extraLevels=Math.max(0,pactLvPopup-(baseLv||1));
        if(extraLevels>0){
          const hm=daHigher.match(/^(\d+)(d\d+)$/i);
          const bm=(dmgDice||'').match(/^(\d+)(d\d+)(.*)$/i);
          if(hm&&bm&&hm[2]===bm[2]){
            finalDice=(parseInt(bm[1])+parseInt(hm[1])*extraLevels)+bm[2]+(bm[3]||'');
          }
        }
      }
      C.pactMagic.u=(C.pactMagic.u||0)+1;save();
      renderSpellRollResult(spellName,finalDice,saveAttr,spCD,pb,scaMod,null,'pact',pactLvPopup);
      return;
    }

    // Costruisce il selettore con eventuale slot patto in cima (se disponibile)
    const p=document.getElementById('rpop');
    p.innerHTML='';
    p.appendChild(mk('div',{style:{color:'var(--td)',fontFamily:'var(--ft)',fontSize:'11px',marginBottom:'6px',letterSpacing:'1px'}},[spellName]));
    p.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',marginBottom:'4px'}},['Con che slot lo lanci?']));

    const lvSel=mk('select',{style:{background:'var(--card)',border:'1px solid var(--gold)',color:'var(--gl)',borderRadius:'4px',padding:'4px 8px',fontSize:'13px',width:'100%',marginBottom:'6px'}});

    // Slot patto (se disponibile e compatibile) — prima opzione viola
    if(pactUsable){
      const o=mk('option',{value:'pact'},['🔮 Slot Patto '+pactLvPopup+'° (Warlock) — '+pactAvailPopup+' disp.']);
      o.style.color='var(--purl)';
      lvSel.appendChild(o);
    }
    // Slot normali
    availableLevels.forEach(l=>{
      const s=C.ss[l]||{m:0,u:0};
      const avail=(s.m||0)-(s.u||0);
      const o=mk('option',{value:String(l)},['Slot '+l+'° livello'+(l===baseLv?' (base)':'')+' — '+avail+' disp.']);
      if(l===baseLv && !pactUsable)o.selected=true;
      lvSel.appendChild(o);
    });
    p.appendChild(lvSel);

    const confirmBtn=BTN('⚄ Tira',()=>{
      const chosenVal=lvSel.value;
      const isPact=chosenVal==='pact';
      const chosenLv=isPact?pactLvPopup:Number(chosenVal);
      let finalDice=dmgDice;
      const extraLevels=Math.max(0,chosenLv-(baseLv||1));
      if(extraLevels>0&&daHigher){
        const hm=daHigher.match(/^(\d+)(d\d+)$/i);
        const bm=(dmgDice||'').match(/^(\d+)(d\d+)(.*)$/i);
        if(hm&&bm&&hm[2]===bm[2]){
          finalDice=(parseInt(bm[1])+parseInt(hm[1])*extraLevels)+bm[2]+(bm[3]||'');
        }
      }
      if(isPact){C.pactMagic.u=(C.pactMagic.u||0)+1;save();}
      else{consumeSlotIfAvailable(chosenLv);}
      renderSpellRollResult(spellName,finalDice,saveAttr,spCD,pb,scaMod,isPact?null:chosenLv,isPact?'pact':null,isPact?pactLvPopup:null);
    },'gold',{style:{width:'100%'}});
    p.appendChild(confirmBtn);
    addRpopCloseBtn(p);
    p.style.display='block';
    clearTimeout(rpt);
    return;
  }

  // Percorso trucchetti (isCantrip) — invariato
  const p=document.getElementById('rpop');
  p.innerHTML='';
  p.appendChild(mk('div',{style:{color:'var(--td)',fontFamily:'var(--ft)',fontSize:'11px',marginBottom:'6px',letterSpacing:'1px'}},[spellName]));
  p.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',marginBottom:'4px'}},['A che livello sei?']));

  const lvSel=mk('select',{style:{background:'var(--card)',border:'1px solid var(--gold)',color:'var(--gl)',borderRadius:'4px',padding:'4px 8px',fontSize:'13px',width:'100%',marginBottom:'6px'}});
  [[1,'Liv. 1-4 (base)'],[5,'Liv. 5-10'],[11,'Liv. 11-16'],[17,'Liv. 17-20']].forEach(([v,l])=>{
    const o=mk('option',{value:v},[l]);
    if((C.lv||1)>=v && (C.lv||1) < (v===1?5:v===5?11:v===11?17:99)) o.selected=true;
    lvSel.appendChild(o);
  });
  p.appendChild(lvSel);

  const confirmBtn=BTN('⚄ Tira',()=>{
    const chosenLv=Number(lvSel.value);
    let finalDice=dmgDice;
    const tier=chosenLv>=17?3:chosenLv>=11?2:chosenLv>=5?1:0;
    if(tier>0&&daHigher){
      const dm=dmgDice.match(/^(\d+)(d\d+.*)$/i);
      if(dm){const baseNum=parseInt(dm[1]);finalDice=(baseNum*(tier+1))+dm[2];}
    }
    renderSpellRollResult(spellName,finalDice,saveAttr,spCD,pb,scaMod,null,null,null);
  },'gold',{style:{width:'100%'}});
  p.appendChild(confirmBtn);
  addRpopCloseBtn(p);
  p.style.display='block';
  clearTimeout(rpt);
}

// Consuma uno slot incantesimo di un dato livello, se disponibile
function consumeSlotIfAvailable(level){
  if(!C.ss[level])return;
  const s=C.ss[level];
  if((s.u||0)<(s.m||0)){
    s.u=(s.u||0)+1;
    save();
    // Aggiorna la UI se siamo su una pagina che mostra gli slot
    if(typeof render==='function'){
      // Non richiamiamo render() completo per non chiudere il popup dadi,
      // ma salviamo i dati: la prossima apertura della pagina mostrerà lo slot aggiornato
    }
  }
}

function renderSpellRollResult(spellName, dmgDice, saveAttr, spCD, pb, scaMod, consumedSlot, consumedPact, pactLv){
  const p=document.getElementById('rpop');
  p.innerHTML='';

// DOM builder — NEVER causes re-render
function mk(tag,attr,children){
  const el=document.createElement(tag);
  if(attr){
    for(const[k,v] of Object.entries(attr)){
      if(v==null)continue;
      if(k==='style'){if(typeof v==='object')Object.assign(el.style,v);}
      else if(k.startsWith('on')){el.addEventListener(k.slice(2).toLowerCase(),v);}
      else if(k==='cls'){el.className=v;}
      else{el.setAttribute(k,v);}
    }
  }
  if(children){
    for(const c of (Array.isArray(children)?children:[children])){
      if(c==null||c===false||c===undefined)continue;
      if(c instanceof Node)el.appendChild(c);
      else el.appendChild(document.createTextNode(String(c)));
    }
  }
  return el;
}

// ── CRITICAL: inputs NEVER trigger render ──
// They only update state and save. render() is only called from buttons/nav.

function TI(val,cb,ph,st){
  // Text input - updates C via cb, NO render
  const el=mk('input',{type:'text',value:val||'',placeholder:ph||'',style:st||{}});
  el.addEventListener('input',ev=>cb(ev.target.value));
  return el;
}
function TA(val,cb,ph,st){
  // Textarea - NO render
  const el=mk('textarea',{placeholder:ph||'',style:st||{}},[val||'']);
  el.addEventListener('input',ev=>cb(ev.target.value));
  return el;
}
function NI(val,cb,mn,mx,st){
  // Number input custom con pulsanti − + per evitare problemi con frecce native su mobile
  const wrap=mk('div',{cls:'ni-wrap'});
  // Applica eventuali stili personalizzati al wrapper (width, ecc.)
  if(st){
    const wrapSt={};
    const inpSt={};
    // Separa gli stili: width/flex/etc vanno al wrapper, font/color vanno all'input
    for(const[k,v] of Object.entries(st)){
      if(['fontSize','color','fontFamily','textAlign'].includes(k))inpSt[k]=v;
      else wrapSt[k]=v;
    }
    Object.assign(wrap.style,wrapSt);
    var extraInpSt=inpSt;
  } else { var extraInpSt={}; }

  const minusBtn=mk('button',{cls:'ni-btn',title:'Diminuisci'},['−']);
  const el=mk('input',{type:'number',value:val??0,style:{...extraInpSt}});
  const plusBtn=mk('button',{cls:'ni-btn',title:'Aumenta'},['+']);

  if(mn!=null)el.min=mn;
  if(mx!=null)el.max=mx;

  function clamp(v){
    if(mn!=null&&v<mn)v=mn;
    if(mx!=null&&v>mx)v=mx;
    return v;
  }
  minusBtn.addEventListener('click',ev=>{
    ev.preventDefault();ev.stopPropagation();
    const v=clamp((Number(el.value)||0)-1);
    el.value=v;cb(v);
  });
  plusBtn.addEventListener('click',ev=>{
    ev.preventDefault();ev.stopPropagation();
    const v=clamp((Number(el.value)||0)+1);
    el.value=v;cb(v);
  });
  el.addEventListener('input',ev=>cb(clamp(Number(ev.target.value)||0)));

  wrap.appendChild(minusBtn);
  wrap.appendChild(el);
  wrap.appendChild(plusBtn);
  return wrap;
}
function SEL(val,opts,cb,st){
  // Select - triggers render after change (layout may change)
  const el=mk('select',{style:{background:'var(--card)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'4px',padding:'4px',fontSize:'12px',...(st||{})}});
  for(const[v,label] of opts){
    const o=mk('option',{value:v},[label]);
    if(v===val)o.selected=true;
    el.appendChild(o);
  }
  el.addEventListener('change',ev=>{cb(ev.target.value);render();});
  return el;
}
function CHK(checked,cb,label){
  // Checkbox - triggers render (affects layout/computed values)
  const box=mk('span',{cls:'chkb'+(checked?' on':'')},checked?['✦']:[]);
  box.addEventListener('click',()=>{cb(!checked);render();});
  if(!label)return box;
  const w=mk('label',{style:{display:'flex',alignItems:'center',gap:'4px',cursor:'pointer'}});
  w.appendChild(box);
  w.appendChild(mk('span',{style:{color:'var(--td)',fontFamily:'var(--fb)',fontSize:'12px'}},[label]));
  return w;
}
function BTN(label,cb,cls,st){
  const el=mk('button',{cls:cls||'',style:st||{}},[label]);
  el.addEventListener('click',cb);
  return el;
}
function LBL(t,st){return mk('div',{cls:'lbl',style:st||{}},[t]);}
function DIV(children,st){
  const d=mk('div',{style:st||{}});
  for(const c of (Array.isArray(children)?children:[children])){
    if(c==null||c===false)continue;
    d.appendChild(c instanceof Node?c:mk('span',null,[String(c)]));
  }
  return d;
}
function ROW(children,st){
  const d=mk('div',{cls:'row',style:st||{}});
  for(const c of (Array.isArray(children)?children:[children])){
    if(c==null||c===false)continue;
    d.appendChild(c instanceof Node?c:mk('span',null,[String(c)]));
  }
  return d;
}
function GRID(children,cols,gap,st){
  const d=mk('div',{style:{display:'grid',gridTemplateColumns:cols||'1fr 1fr',gap:(gap||6)+'px',...(st||{})}});
  for(const c of (Array.isArray(children)?children:[children])){
    if(c==null||c===false)continue;
    d.appendChild(c instanceof Node?c:mk('span',null,[String(c)]));
  }
  return d;
}
function CARD(children,st){
  const d=mk('div',{cls:'card',style:st||{}});
  for(const c of (Array.isArray(children)?children:[children])){
    if(c==null||c===false)continue;

// ── ROLL POPUP ──
let rpt=null;
function showRoll(formula,label){
  const ed=C.baseEdition||'2014';
  const hasIns=(C.ins||0)>0;
  const is1d20=formula.startsWith('1d20');

  // 2014: ispirazione = vantaggio immediato (solo su 1d20)
  let r, usedAdv=false;
  if(is1d20 && hasIns && ed==='2014'){
    const r1=roll(formula);const r2=roll(formula);
    r=r1.t>=r2.t?r1:r2;
    C.ins=Math.max(0,(C.ins||0)-1);save();
    usedAdv=true;
  } else {
    r=roll(formula);
  }

  const p=document.getElementById('rpop');
  p.innerHTML='';
  p.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',marginBottom:'2px'}},[label+(usedAdv?' ♦ Vantaggio':'')]));
  const totEl=mk('div',{style:{color:'var(--gl)',fontFamily:'var(--ft)',fontSize:'26px',textAlign:'center'}},[String(r.t)]);
  p.appendChild(totEl);
  p.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',textAlign:'center'}},[r.f+' → ['+r.r.join(',')+']']));

  // 2024: offri Ispirazione Eroica dopo aver visto il risultato (solo su 1d20)
  if(is1d20 && hasIns && ed==='2024' && !usedAdv){
    const insBtn=BTN('✧ Usa Ispirazione Eroica — Ritira',()=>{
      C.ins=Math.max(0,(C.ins||0)-1);save();
      const r2=roll(formula);
      totEl.textContent=String(r2.t);
      p.querySelector('div:nth-child(3)').textContent=r2.f+' → ['+r2.r.join(',')+'] ← Ritiro';
      insBtn.replaceWith(mk('div',{style:{color:'var(--gold)',fontSize:'10px',textAlign:'center',marginTop:'4px'}},
        ['❆ Ispirazione usata — nuovo risultato: '+r2.t]));
    },'gold sm',{style:{width:'100%',marginTop:'6px',fontSize:'11px'}});
    p.appendChild(insBtn);
  }

  addRpopCloseBtn(p);
  p.style.display='block';
  // Timer più lungo se c'è il pulsante ispirazione, altrimenti breve
  const timeout=(is1d20 && hasIns && ed==='2024')?10000:3000;
  clearTimeout(rpt);rpt=setTimeout(()=>p.style.display='none',timeout);
}

          show2.sv?'TS: '+({str:'Forza',dex:'Destrezza',con:'Costituzione',int:'Intelligenza',wis:'Saggezza',cha:'Carisma'}[show2.sv]||show2.sv):''
        ].join('')),
        !viewOnly&&BTN('✏ Modifica manuale',()=>{dr={...show2};editing=true;renderSpellModal();},'sm ghost',{marginTop:'10px'})
      ].filter(Boolean),{display:'flex',flexDirection:'column',gap:'6px'});
    }
    const box=CARD([
      ROW([mk('span',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'12px'}},[title]),BTN('✕',closeModal,'ghost sm')],{justifyContent:'space-between',marginBottom:'10px'}),
      content
    ]);
    showModal(box);
  }
  renderSpellModal();
}

function showMagicModal(idx){
  const item=C.mi[idx];
  if(!item)return;
  // Open in edit mode if new item (no name yet)
  let editing=!item.name;
  let dr={...item};
  const rarC={comune:'var(--text)',non_comune:'var(--greenl)',raro:'var(--bluel)','molto raro':'var(--purl)',leggendario:'var(--gl)'};

  function renderMagicModal(){
    const show=editing?dr:item;
    let content;
    if(editing){
      // Build form fields - inputs don't cause re-render
      const nameI=TI(dr.name||'',v=>{dr.name=v;},'Nome oggetto magico',{width:'100%'});
      const rarS=SEL(dr.rarity||'',[['','—'],['comune','Comune'],['non_comune','Non comune'],['raro','Raro'],['molto raro','Molto raro'],['leggendario','Leggendario']],v=>{dr.rarity=v;},{width:'100%'});
      const typeI=TI(dr.type||'',v=>{dr.type=v;},'Arma, Armatura, Oggetto meraviglioso...',{width:'100%'});
      const descA=TA(dr.desc||'',v=>{dr.desc=v;},'Proprietà, effetti, cariche...',{width:'100%',minHeight:'80px'});
      // Manual checkbox - does NOT call render(), just updates dr
      const attBox=mk('span',{cls:'chkb'+(dr.requiresAttunement?' on':'')},dr.requiresAttunement?['✦']:[]);
      attBox.addEventListener('click',()=>{
        dr.requiresAttunement=!dr.requiresAttunement;
        attBox.className='chkb'+(dr.requiresAttunement?' on':'');
        attBox.textContent=dr.requiresAttunement?'✦':'';
      });

      content=DIV([
        DIV([LBL('Nome'),nameI]),
        DIV([LBL('Rarità'),rarS]),
        DIV([LBL('Tipo'),typeI]),
        ROW([attBox,mk('span',{style:{color:'var(--td)',fontSize:'12px'}},['Richiede Sintonizzazione'])],{gap:'6px',margin:'4px 0'}),
        DIV([LBL('Descrizione / Effetti'),descA]),
        ROW([
          BTN('Salva',()=>{C.mi[idx]={...dr};save();closeModal();render();},'gold'),
          BTN('Annulla',()=>{editing=false;renderMagicModal();},'')
        ],{gap:'6px',marginTop:'8px'})
      ],{display:'flex',flexDirection:'column',gap:'8px'});
    } else {
      const rarity=show.rarity||'';
      // Manual toggle - updates C directly and re-renders modal inline
      let attRow;
      if(show.requiresAttunement){
        const attBox=mk('span',{cls:'chkb'+(show.attuned?' on':'')},show.attuned?['✦']:[]);
        const attLbl=mk('span',{style:{color:'var(--td)',fontSize:'12px'}},[show.attuned?'✦ Sintonizzato':'Non sintonizzato']);
        attBox.addEventListener('click',()=>{
          C.mi[idx].attuned=!C.mi[idx].attuned;save();
          const isNowOn=C.mi[idx].attuned;
          attBox.className='chkb'+(isNowOn?' on':'');
          attBox.textContent=isNowOn?'✦':'';
          attLbl.textContent=isNowOn?'✦ Sintonizzato':'Non sintonizzato';
          // Update dot in main page without full render
          render();
        });
        attRow=ROW([attBox,attLbl],{gap:'6px'});
      } else {
        attRow=mk('div',{style:{color:'var(--td)',fontSize:'12px'}},['Nessuna sintonizzazione richiesta']);
      }

      content=DIV([
        rarity&&DIV([LBL('Rarità'),mk('span',{style:{color:rarC[rarity]||'var(--text)',fontSize:'13px',textTransform:'capitalize'}},[rarity.replace('_',' ')])]),
        show.type&&DIV([LBL('Tipo'),mk('span',{style:{color:'var(--text)',fontSize:'13px'}},[show.type])]),
        DIV([LBL('Sintonizzazione'),attRow]),
        show.desc&&DIV([LBL('Descrizione'),mk('div',{style:{color:'var(--text)',fontFamily:'var(--fb)',fontSize:'13px',lineHeight:'1.6'}},[show.desc])]),
        ROW([
          BTN('✏ Modifica',()=>{dr={...show};editing=true;renderMagicModal();},'sm'),
          CHK(!!show.bagOfHolding,v=>{C.mi[idx].bagOfHolding=v;save();closeModal();render();}),
          mk('span',{style:{color:'var(--td)',fontSize:'12px'}},['Borsa Conservante'])
        ],{gap:'8px',marginTop:'10px',flexWrap:'wrap'})
      ].filter(Boolean),{display:'flex',flexDirection:'column',gap:'8px'});
    }
    const box=CARD([
      ROW([mk('span',{style:{color:'var(--purl)',fontFamily:'var(--ft)',fontSize:'12px'}},['✨ '+(show.name||'Oggetto Magico')]),BTN('✕',closeModal,'ghost sm')],{justifyContent:'space-between',marginBottom:'10px'}),
      content
    ]);
    box.classList.add('mpur');
    showModal(box);
  }
  renderMagicModal();
}

// ══ PAGES ══

function pgMain(){
  const pb=C.prof||2;
  const S={str:sm(C.str),dex:sm(C.dex),con:sm(C.con),int:sm(C.int),wis:sm(C.wis),cha:sm(C.cha)};
  const SK=['str','dex','con','int','wis','cha'];
  const SN={str:'For',dex:'Des',con:'Cos',int:'Int',wis:'Sag',cha:'Car'};
  function skB(k){const s=C.sk[k];return(S[s.s]||0)+(s.e?pb*2:s.p?pb:0)+(Number((C.skBonus||{})[k])||0);}
  const acT=(C.bac||10)+(C.acm||[]).filter(m=>m.on).reduce((a,m)=>a+(Number(m.v)||0),0);

  const p=mk('div',{cls:'page'});

  // Mappa dado vita per classe
  const CLASS_HD={
    'Barbaro':'1d12','Bardo':'1d8','Chierico':'1d8','Druido':'1d8',
    'Guerriero':'1d10','Ladro':'1d8','Mago':'1d6','Warlock':'1d8',
    'Stregone':'1d6','Paladino':'1d10','Ranger':'1d10','Monaco':'1d8',
    'Artefice':'1d8','Personalizzata':'1d8',
  };
  const CLASS_LIST=Object.keys(CLASS_HD);

  // ── Sezione Classi / Multiclasse ──
  if(!C.classes)C.classes=[];
  // Calcola livello totale dalle classi se presente, altrimenti usa C.lv
  const totalLv=C.classes.length>0?C.classes.reduce((s,cl)=>s+(Number(cl.lv)||0),0):C.lv||1;
  if(C.classes.length>0&&C.lv!==totalLv){C.lv=totalLv;}

  const classCard=CARD([]);
  classCard.appendChild(ROW([
    LBL('Classe / Multiclasse',{marginBottom:'0'}),
    BTN('+ Classe',()=>{
      const newCls={name:'Guerriero',sub:'',lv:1,hdType:'1d10',hdUsed:0};
      // Se è la prima classe, migra i dati esistenti
      if(C.classes.length===0&&C.cls){
        const matchedCls=CLASS_LIST.find(cn=>cn.toLowerCase()===C.cls.toLowerCase());
        newCls.name=matchedCls||'Personalizzata';
        if(!matchedCls)newCls.customName=C.cls;
        newCls.sub=C.sub||'';newCls.lv=C.lv||1;
        newCls.hdType=CLASS_HD[newCls.name]||C.hdType||'1d8';
      }
      C.classes.push(newCls);
      if(newCls.name==='Druido')C.showWildshape=true;
      save();render();
    },'sm gold')
  ],{justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}));

  if(C.classes.length===0){
    // Modalità singola classe (legacy)
    classCard.appendChild(GRID([
      DIV([LBL('Classe'),(()=>{
        const clsInp=TI(C.cls||'',v=>{
          const oldCls=(C.cls||'').toLowerCase().trim();
          const newCls=v.toLowerCase().trim();
          // Se il nome classe viene rimosso o cambiato, elimina i features taggati con la vecchia classe
          if(oldCls && oldCls!==newCls && C.classFeatures){
            C.classFeatures=C.classFeatures.filter(f=>{
              const ftag=(f.tag||'').toLowerCase().trim();
              return !ftag || ftag!==oldCls;
            });
          }
          // Disattiva Forma Selvatica se si rimuove Druido in modalità singola classe
          if(oldCls==='druido' && newCls!=='druido' && (!C.classes||C.classes.length===0)){
            C.showWildshape=false;C.wsUses={cur:2,max:2};
          }
          if(newCls==='druido')C.showWildshape=true;
          C.cls=v;save();
        },'',{fontSize:'12px'});
        return clsInp;
      })()]),
      DIV([LBL('Livello'),NI(C.lv,v=>{C.lv=Math.max(1,Math.min(20,v));if(!C.profManual)C.prof=profByLevel(C.lv);save();render();},1,20,{width:'100%'})]),
      DIV([LBL('Sottoclasse'),TI(C.sub||'',v=>{C.sub=v;save();},'',{fontSize:'12px'})]),
    ],'1fr 1fr 1fr',4));
  } else {
    // Modalità multiclasse
    C.classes.forEach((cl,ci)=>{
      const row=mk('div',{style:{display:'flex',alignItems:'center',gap:'6px',padding:'6px 0',borderBottom:'1px solid rgba(90,62,27,0.2)'}});
      // Tendina classe
      const clsSel=mk('select',{style:{flex:'1',fontSize:'12px',fontFamily:'var(--ft)',color:'var(--gl)',background:'var(--card)',border:'none',borderBottom:'1px solid var(--border)',outline:'none',minWidth:0}});
      CLASS_LIST.forEach(cn=>{const o=mk('option',{value:cn},[cn]);if(cl.name===cn)o.selected=true;clsSel.appendChild(o);});
      clsSel.addEventListener('change',ev=>{
        const oldName=(C.classes[ci].customName||C.classes[ci].name||'').toLowerCase().trim();
        const newName=ev.target.value.toLowerCase().trim();
        if(oldName && oldName!==newName && C.classFeatures){
          C.classFeatures=C.classFeatures.filter(f=>{
            const ftag=(f.tag||'').toLowerCase().trim();
            return !ftag || ftag!==oldName;
          });
        }
        const prevName=(C.classes[ci].customName||C.classes[ci].name||'').toLowerCase().trim();
        C.classes[ci].name=ev.target.value;
        C.classes[ci].hdType=CLASS_HD[ev.target.value]||'1d8';
        if(ci===0){C.cls=ev.target.value;}
        if(ev.target.value==='Druido'){C.showWildshape=true;}
        else if(prevName==='druido'){
          // Controllare se altri slot hanno ancora Druido
          const stillHas=C.classes.some(c=>(c.name||'').toLowerCase()==='druido'||(c.customName||'').toLowerCase()==='druido');
          if(!stillHas){C.showWildshape=false;C.wsUses={cur:2,max:2};}
        }
        save();render();
      });
      row.appendChild(clsSel);
      // Campo nome personalizzato (solo se Personalizzata)
      if(cl.name==='Personalizzata'||(!CLASS_LIST.includes(cl.name)&&cl.name)){
        const custInp=mk('input',{type:'text',value:cl.customName||cl.name||'',placeholder:'Nome classe...',style:{width:'80px',fontSize:'11px',color:'var(--gl)',background:'transparent',border:'none',borderBottom:'1px solid rgba(90,62,27,0.4)',outline:'none'}});
        custInp.addEventListener('change',ev=>{C.classes[ci].customName=ev.target.value;if(ci===0)C.cls=ev.target.value;save();});
        row.appendChild(custInp);
      }
      // Sottoclasse
      const subInp=mk('input',{type:'text',value:cl.sub||'',placeholder:'Sottoclasse',style:{width:'80px',fontSize:'11px',color:'var(--td)',background:'transparent',border:'none',borderBottom:'1px solid rgba(90,62,27,0.3)',outline:'none'}});
      subInp.addEventListener('change',ev=>{C.classes[ci].sub=ev.target.value;if(ci===0)C.sub=ev.target.value;save();});
      row.appendChild(subInp);
      // Livello
      const lvInp=mk('input',{type:'number',value:String(cl.lv||1),min:'1',max:'20',style:{width:'40px',textAlign:'center',fontSize:'13px',color:'var(--text)',background:'var(--card)',border:'1px solid var(--border)',borderRadius:'4px',padding:'2px 4px',outline:'none'}});
      lvInp.addEventListener('change',ev=>{
        const newLv=Math.max(1,Math.min(20,Number(ev.target.value)||1));
        C.classes[ci].lv=newLv;
        const tot=C.classes.reduce((s,c)=>s+(Number(c.lv)||0),0);
        C.lv=tot;
        if(!C.profManual)C.prof=profByLevel(C.lv);
        save();render();
      });
      row.appendChild(mk('span',{style:{color:'var(--tk)',fontSize:'11px',flexShrink:0}},['Lv']));
      row.appendChild(lvInp);
      // Dado vita auto
      const hdSel=SEL(cl.hdType||'1d8',[['1d6','1d6'],['1d8','1d8'],['1d10','1d10'],['1d12','1d12']],v=>{C.classes[ci].hdType=v;save();},{fontSize:'11px',width:'54px'});
      row.appendChild(hdSel);
      // Elimina
      row.appendChild(BTN('✕',()=>{
        const removedName=(cl.customName||cl.name||'').toLowerCase().trim();
        C.classes.splice(ci,1);
        // Rimuovi i privilegi di classe con tag corrispondente alla classe rimossa
        if(removedName && C.classFeatures){
          C.classFeatures=C.classFeatures.filter(f=>{
            const ftag=(f.tag||'').toLowerCase().trim();
            return !ftag || ftag!==removedName;
          });
        }
        // Disattiva Forma Selvatica se non ci sono più Druidi
        const stillHasDruido=C.classes.some(c=>(c.name||'').toLowerCase()==='druido'||(c.customName||'').toLowerCase()==='druido');
        if(!stillHasDruido && removedName==='druido'){C.showWildshape=false;C.wsUses={cur:2,max:2};}
        if(C.classes.length===0){C.lv=1;}else{C.lv=C.classes.reduce((s,c)=>s+(Number(c.lv)||0),0);}
        if(!C.profManual)C.prof=profByLevel(C.lv);
        save();render();
      },'ghost sm'));
      classCard.appendChild(row);
    });
    classCard.appendChild(mk('div',{style:{display:'flex',justifyContent:'flex-end',marginTop:'6px',gap:'8px',alignItems:'center'}},[ mk('span',{style:{color:'var(--td)',fontSize:'11px'}},['Livello Totale:']), mk('span',{style:{color:'var(--gl)',fontFamily:'var(--ft)',fontSize:'16px'}},[String(totalLv)]) ]));
  }

  const hCard=CARD([
    TI(C.name||'',v=>{C.name=v;save();document.getElementById('hn').textContent=v||'Nuovo Personaggio';},'Nome Personaggio',{fontSize:'16px',fontFamily:'var(--ft)',color:'var(--gl)',background:'transparent',border:'none',borderBottom:'1px solid var(--border)',borderRadius:'0',marginBottom:'12px',width:'100%'}),
    classCard,
    mk('div',{style:{height:'10px'}}),
    GRID([
      DIV([LBL('Razza'),TI(C.race||'',v=>{C.race=v;save();},'',{fontSize:'12px'})]),
      DIV([LBL('Background'),TI(C.bg||'',v=>{C.bg=v;save();},'',{fontSize:'12px'})]),
      DIV([LBL('Allineamento'),TI(C.align||'',v=>{C.align=v;save();},'',{fontSize:'12px'})]),
    ],'1fr 1fr 1fr',4),
    ROW([
      DIV([LBL('XP'),(()=>{
        const i=mk('input',{type:'text',value:String(C.xp||0),style:{width:'100%'}});
        i.addEventListener('change',ev=>{C.xp=Number(ev.target.value)||0;save();render();});
        return i;
      })()],{style:{flex:'1'}}),
      DIV([LBL('Comp.'),(()=>{const i=mk('input',{type:'text',value:String(C.prof||2),style:{width:'100%'}});i.addEventListener('change',ev=>{C.prof=Number(ev.target.value)||2;save();});return i;})()],{style:{flex:'1'}}),
      DIV([LBL('Vel.'),(()=>{const i=mk('input',{type:'text',value:String(C.spd||30),style:{width:'100%'}});i.addEventListener('change',ev=>{C.spd=Number(ev.target.value)||30;save();});return i;})()],{style:{flex:'1'}}),
      BTN('⚄',showDiceModal,'gold',{padding:'5px 10px'})
    ],{marginTop:'6px',alignItems:'flex-end'})
  ]);
  p.appendChild(hCard);

  // ── Tracker XP (se attivato) ──
  if(C.showXpTracker){
    const XP_TABLE=[0,300,900,2700,6500,14000,23000,34000,48000,64000,85000,100000,120000,140000,165000,195000,225000,265000,305000,355000];
    const currentLv=Math.min(20,C.lv||1);
    const xpCurrent=C.xp||0;
    const xpForThisLv=XP_TABLE[currentLv-1]||0;
    const xpForNextLv=XP_TABLE[currentLv]||XP_TABLE[19];
    const xpInLevel=xpCurrent-xpForThisLv;
    const xpNeeded=xpForNextLv-xpForThisLv;
    const pct=currentLv>=20?1:Math.min(1,Math.max(0,xpInLevel/xpNeeded));
    const barColor=pct>=1?'var(--gl)':'var(--gold)';
    const xpCard=CARD([
      ROW([
        mk('span',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'11px',letterSpacing:'1px'}},['⭐ PROGRESSIONE XP']),
        currentLv<20?mk('span',{style:{color:'var(--td)',fontSize:'11px'}},[xpInLevel+' / '+xpNeeded+' XP (prossimo: '+xpForNextLv+')']):mk('span',{style:{color:'var(--gl)',fontFamily:'var(--ft)',fontSize:'11px'}},['LIVELLO MASSIMO'])
      ],{justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}),
      mk('div',{style:{height:'8px',background:'var(--border)',borderRadius:'4px',overflow:'hidden'}},[
        mk('div',{style:{height:'100%',width:(pct*100).toFixed(1)+'%',background:barColor,borderRadius:'4px',transition:'width 0.4s'}})
      ]),
      ROW([
        mk('span',{style:{color:'var(--tk)',fontSize:'10px'}},['Lv '+currentLv]),
        currentLv<20?mk('span',{style:{color:'var(--tk)',fontSize:'10px'}},['Lv '+(currentLv+1)]):mk('span',{},['']),
      ],{justifyContent:'space-between',marginTop:'2px'})
    ]);
    p.appendChild(xpCard);
  }

  // Caratteristiche — solo input testo, niente +/-
  const statsGrid=GRID(SK.map(k=>{
    const modDiv=mk('div',{style:{fontSize:'24px',color:'var(--gl)',fontFamily:'var(--ft)',cursor:'pointer',lineHeight:'1',textAlign:'center'}},[fm(S[k])]);
    const inp=mk('input',{type:'text',value:String(C[k]),style:{width:'100%',fontSize:'12px',marginTop:'2px',textAlign:'center'}});
    inp.addEventListener('change',ev=>{C[k]=Math.max(1,Math.min(30,Number(ev.target.value)||10));modDiv.textContent=fm(sm(C[k]));save();});
    modDiv.addEventListener('click',()=>showRoll('1d20'+fm(sm(C[k])),SN[k]));
    const card=CARD([LBL(SN[k]),modDiv,inp],{textAlign:'center',padding:'8px'});
    return card;
  }),'repeat(3,1fr)',6);
  p.appendChild(statsGrid);

  // PF con cap
  function makePfCard(){
    const hpCol=C.hp<=0?'var(--rl)':C.hp<(C.maxHp*.5)?'#e8a030':'var(--greenl)';
    const hpGrid=GRID([
      CARD([LBL('PF Max'),(()=>{
        const i=mk('input',{type:'text',value:String(Math.max(0,C.maxHp||0)),style:{width:'100%',fontSize:'18px',textAlign:'center',color:'var(--text)'}});
        i.addEventListener('change',ev=>{C.maxHp=Math.max(0,Number(ev.target.value)||0);if(C.hp>C.maxHp)C.hp=C.maxHp;save();render();});
        return i;
      })()],{textAlign:'center',padding:'8px'}),
      CARD([LBL('PF Attuali'),(()=>{
        const i=mk('input',{type:'text',value:String(C.hp||0),style:{width:'100%',fontSize:'18px',textAlign:'center',color:hpCol}});
        i.addEventListener('change',ev=>{C.hp=Math.min(C.maxHp||0,Math.max(-999,Number(ev.target.value)||0));i.style.color=C.hp<=0?'var(--rl)':C.hp<(C.maxHp*.5)?'#e8a030':'var(--greenl)';save();});
        return i;
      })()],{textAlign:'center',padding:'8px'}),
      CARD([LBL('PF Temp.'),(()=>{
        const i=mk('input',{type:'text',value:String(C.thp||0),style:{width:'100%',fontSize:'18px',textAlign:'center',color:'var(--bluel)'}});
        i.addEventListener('change',ev=>{C.thp=Math.max(0,Number(ev.target.value)||0);save();});
        return i;
      })()],{textAlign:'center',padding:'8px'}),
    ],'1fr 1fr 1fr',6);
    return hpGrid;
  }
  p.appendChild(makePfCard());

  // CA
  const caCard=CARD([ROW([
    DIV([LBL('CA'),mk('div',{id:'ac-total',style:{fontSize:'26px',color:'var(--gl)',fontFamily:'var(--ft)',textAlign:'center'}},[String(acT)]),LBL('Base',{marginTop:'2px'}),(()=>{const i=mk('input',{type:'text',value:String(C.bac||10),style:{width:'100%',textAlign:'center'}});i.addEventListener('change',ev=>{C.bac=Number(ev.target.value)||10;const t=(C.bac||10)+(C.acm||[]).filter(m=>m.on).reduce((a,m)=>a+(Number(m.v)||0),0);const el=document.getElementById('ac-total');if(el)el.textContent=String(t);save();});return i;})()],{style:{textAlign:'center',minWidth:'65px'}}),
    DIV([
      ROW([LBL('Mod CA'),BTN('+',()=>{C.acm.push({n:'Scudo',v:2,on:false});save();render();},'sm')],{justifyContent:'space-between',alignItems:'center'}),
      ...(C.acm||[]).map((m,i)=>{
        const calcAc=()=>{const t=(C.bac||10)+(C.acm||[]).filter(m=>m.on).reduce((a,m)=>a+(Number(m.v)||0),0);const el=document.getElementById('ac-total');if(el)el.textContent=String(t);};
        const acvInp=mk('input',{type:'number',value:String(m.v||0),style:{width:'56px',textAlign:'center',padding:'6px 4px',border:'1px solid var(--border)',borderRadius:'var(--r)',background:'var(--card)',color:'var(--text)',fontSize:'15px',boxSizing:'border-box',flexShrink:'0'}});
        acvInp.addEventListener('input',ev=>{C.acm[i].v=Number(ev.target.value)||0;save();calcAc();});
        const wrap=mk('div',{style:{marginTop:'6px'}});
        wrap.appendChild(TI(m.n||'',v=>{C.acm[i].n=v;save();},'Nome modificatore',{width:'100%',fontSize:'14px',marginBottom:'4px',display:'block'}));
        wrap.appendChild(ROW([
          CHK(!!m.on,v=>{C.acm[i].on=v;save();calcAc();}),
          mk('span',{style:{color:'var(--td)',fontSize:'12px',flex:'1'}},['Valore:']),
          acvInp,
          BTN('✕',()=>{C.acm.splice(i,1);save();render();},'ghost sm')
        ],{gap:'6px',alignItems:'center'}));
        return wrap;
      })
    ],{style:{flex:'1',marginLeft:'10px'}})

      bonInp.addEventListener('change',ev=>{if(!C.passBonus)C.passBonus={perc:0,intu:0,indag:0};C.passBonus['perc']=Number(ev.target.value)||0;save();render();});

      const bonInp=mk('input',{type:'number',value:String(bonus),style:{width:'48px',textAlign:'center',fontSize:'11px',padding:'2px',border:'1px solid var(--bluel)',borderRadius:'var(--r)',background:'var(--card)',color:'var(--bluel)',boxSizing:'border-box'},placeholder:'+0',title:'Bonus extra (es. Observant +5)'});
      bonInp.addEventListener('change',ev=>{if(!C.passBonus)C.passBonus={perc:0,intu:0,indag:0};C.passBonus['intu']=Number(ev.target.value)||0;save();render();});
      wrap.appendChild(bonInp);

    })()],{textAlign:'center',padding:'6px'}),
    CARD([(()=>{
      if(!C.passBonus)C.passBonus={perc:0,intu:0,indag:0};
      const bonus=C.passBonus['indag']||0;
      const featB=(C.featPassBonus||{}).indag||0;

      const wrap=mk('div',{style:{textAlign:'center',padding:'6px'}});
      wrap.appendChild(LBL('Indag. Passivo'));
      wrap.appendChild(mk('div',{style:{fontSize:'20px',color:'var(--gold)',fontFamily:'var(--ft)',lineHeight:'1.1',marginBottom:'2px'}},[String(total)]));
      const bonInp=mk('input',{type:'number',value:String(bonus),style:{width:'48px',textAlign:'center',fontSize:'11px',padding:'2px',border:'1px solid var(--bluel)',borderRadius:'var(--r)',background:'var(--card)',color:'var(--bluel)',boxSizing:'border-box'},placeholder:'+0',title:'Bonus extra (es. Observant +5)'});
      bonInp.addEventListener('change',ev=>{if(!C.passBonus)C.passBonus={perc:0,intu:0,indag:0};C.passBonus['indag']=Number(ev.target.value)||0;save();render();});

  ],'1fr 1fr 1fr',6,{marginTop:'8px'});
  p.appendChild(passiveGrid);

  // Ispirazione — solo input, niente spinner
  const insRow=ROW([LBL('Ispirazione',{marginBottom:'0'}),
    DIV(Array.from({length:C.maxIns||1}).map((_,i)=>{
      const d=mk('div',{cls:'ic2'+(i<(C.ins||0)?' on':'')});
      if(i<(C.ins||0))d.textContent='✦';
      d.addEventListener('click',()=>{C.ins=(C.ins||0)>i?i:i+1;save();render();});
      return d;
    }),{display:'flex',gap:'4px'}),
    mk('span',{style:{color:'var(--td)',fontSize:'10px'}},['max']),
    (()=>{const i=mk('input',{type:'text',value:String(C.maxIns||1),style:{width:'36px',textAlign:'center'}});i.addEventListener('change',ev=>{C.maxIns=Math.max(1,Number(ev.target.value)||1);save();render();});return i;})()
  ]);
  p.appendChild(CARD([insRow]));

  // Tiri morte
  const dmCard=CARD([LBL('Tiri Salvezza Morte'),
    ROW([
      DIV([LBL('Successi',{color:'var(--greenl)'}),DIV([0,1,2].map(i=>{const d=mk('div',{cls:'dc'+(i<(C.ds||0)?' on':'')});d.addEventListener('click',()=>{C.ds=(C.ds||0)>i?i:i+1;save();render();});return d;}),{display:'flex',gap:'4px'})]),
      DIV([LBL('Fallimenti',{color:'var(--rl)'}),DIV([0,1,2].map(i=>{const d=mk('div',{cls:'dc f'+(i<(C.df||0)?' on':'')});d.addEventListener('click',()=>{C.df=(C.df||0)>i?i:i+1;save();render();});return d;}),{display:'flex',gap:'4px'})])
    ],{gap:'12px',marginTop:'4px'})
  ]);
  p.appendChild(dmCard);

  // Dado vita — multiclasse o singola classe
  const hdCard=CARD([]);
  hdCard.appendChild(LBL('Dadi Vita'));

  if(C.classes&&C.classes.length>0){
    // Multiclasse: una riga per classe
    C.classes.forEach((cl,ci)=>{
      const hdUsed=Number(cl.hdUsed)||0;
      const hdMax=Number(cl.lv)||1;
      const hdAvail=Math.max(0,hdMax-hdUsed);
      const clRow=ROW([
        mk('span',{style:{color:'var(--gl)',fontFamily:'var(--ft)',fontSize:'12px',flex:'1',minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},[cl.customName||cl.name||'Classe '+(ci+1)]),
        mk('span',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'12px',flexShrink:0}},[String(hdAvail)+'/'+String(hdMax)]),
        mk('span',{style:{color:'var(--td)',fontSize:'11px',flexShrink:0}},[cl.hdType||'1d8']),
        BTN('Usa',()=>{
          if(hdUsed>=hdMax)return;
          const cm=sm(C.con);const r=roll((cl.hdType||'1d8')+(cm>=0?'+'+cm:String(cm)));
          C.hp=Math.min(C.maxHp||0,(C.hp||0)+Math.max(1,r.t));
          C.classes[ci].hdUsed=(C.classes[ci].hdUsed||0)+1;save();render();
        },'gold sm',{style:{fontSize:'10px',padding:'2px 8px'}}),
      ],{gap:'6px',marginTop:'5px',alignItems:'center'});
      hdCard.appendChild(clRow);
    });
    // Riepilogo totale
    const totAvail=C.classes.reduce((s,cl)=>s+Math.max(0,(Number(cl.lv)||1)-(Number(cl.hdUsed)||0)),0);
    const totMax=C.classes.reduce((s,cl)=>s+(Number(cl.lv)||1),0);
    hdCard.appendChild(ROW([
      mk('span',{style:{color:'var(--td)',fontSize:'10px',flex:'1'}},['Totale disponibili:']),
      mk('span',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'13px'}},[String(totAvail)+'/'+String(totMax)]),
    ],{marginTop:'6px',justifyContent:'space-between'}));
  } else {
    // Singola classe
    const hdUsed=Number(C.hdUsed)||0;
    const hdMax=C.lv||1;
    const hdAvail=Math.max(0,hdMax-hdUsed);
    hdCard.appendChild(ROW([
      mk('span',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'13px'}},[String(hdAvail)+'/'+String(hdMax)]),
      SEL(C.hdType||'1d8',[['1d6','1d6'],['1d8','1d8'],['1d10','1d10'],['1d12','1d12']],v=>{C.hdType=v;save();render();},{fontSize:'12px',width:'70px'}),
    ],{gap:'8px',marginBottom:'8px',alignItems:'center'}));
    hdCard.appendChild(BTN('Usa Dado',()=>{
      if(hdUsed>=hdMax)return;
      const cm=sm(C.con);const r=roll((C.hdType||'1d8')+(cm>=0?'+'+cm:String(cm)));
      C.hp=Math.min(C.maxHp||0,(C.hp||0)+Math.max(1,r.t));
      C.hdUsed=(C.hdUsed||0)+1;save();render();
    },'gold sm'));
  }

  hdCard.appendChild(ROW([
    BTN('Riposo Breve',()=>{
      if(C.classes&&C.classes.length>0){
        C.classes.forEach((_,ci)=>{const toR=Math.ceil((Number(C.classes[ci].lv)||1)/2);C.classes[ci].hdUsed=Math.max(0,(Number(C.classes[ci].hdUsed)||0)-toR);});
      } else {C.hdUsed=Math.max(0,(C.hdUsed||0)-Math.ceil((C.lv||1)/2));}
      rechargeResources('short');
      if(C.pactMagic)C.pactMagic.u=0;
      if(C.wsUses){C.wsUses.cur=C.wsUses.max||2;} // Riposo Breve recupera usi Forma Selvatica
      save();render();
    },'sm',{style:{flex:'1',borderColor:'var(--bluel)',color:'var(--bluel)'}}),
    BTN('Riposo Lungo',()=>{
      C.hp=C.maxHp||0;C.thp=0;C.ds=0;C.df=0;
      if(C.classes&&C.classes.length>0){
        C.classes.forEach((_,ci)=>{const toR=Math.max(1,Math.floor((Number(C.classes[ci].lv)||1)/2));C.classes[ci].hdUsed=Math.max(0,(Number(C.classes[ci].hdUsed)||0)-toR);});
      } else {C.hdUsed=Math.max(0,(C.hdUsed||0)-Math.max(1,Math.floor((C.lv||1)/2)));}
      for(let l=1;l<=9;l++){if(C.ss[l])C.ss[l].u=0;}
      C.exhaustion=Math.max(0,(C.exhaustion||0)-1);
      rechargeResources('long');
      if(C.pactMagic)C.pactMagic.u=0;
      if(C.wsUses){C.wsUses.cur=C.wsUses.max||2;}
      save();render();
    },'sm',{style:{flex:'1',borderColor:'var(--greenl)',color:'var(--greenl)'}})
  ],{gap:'6px',marginTop:'8px',flexWrap:'wrap'}));
  p.appendChild(hdCard);

  // Slot Patto Warlock spostati in pgSpells e pgCombat

  // Esaurimento
  const exLevels2014=[
    'Nessun effetto',
    'Svantaggio alle prove di caratteristica',
    'Velocità dimezzata',
    'Svantaggio a tiri per colpire e TS',
    'Velocità massima 5 piedi',
    'Svantaggio a tiri per colpire, TS e prove',
    'Morte'
  ];
  const exLevels2024=[
    'Nessun effetto',
    '-2 a d20 test',
    '-4 a d20 test',
    '-6 a d20 test, velocità dimezzata',
    '-8 a d20 test',
    '-10 a d20 test, velocità 5 piedi',
    'Morte'
  ];
  const exEd=C.exhaustionEdition||'2014';
  const exLvl=C.exhaustion||0;
  const exDesc=(exEd==='2014'?exLevels2014:exLevels2024)[exLvl]||'';
  const exCard=CARD([
    ROW([
      LBL('Esaurimento',{marginBottom:'0'}),
      ROW([
        mk('button',{cls:'sm ghost',style:{padding:'2px 8px',fontSize:'11px'}},[' 2014 ']),
        mk('button',{cls:'sm ghost',style:{padding:'2px 8px',fontSize:'11px'}},[' 2024 '])
      ],{gap:'4px'})
    ],{justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}),
    ROW([
      BTN('▼',()=>{C.exhaustion=Math.max(0,(C.exhaustion||0)-1);save();render();},'ghost sm'),
      mk('div',{style:{flex:'1',textAlign:'center'}},[ mk('span',{style:{color:exLvl===0?'var(--greenl)':exLvl>=5?'var(--rl)':'#e8a030',fontFamily:'var(--ft)',fontSize:'18px'}},[String(exLvl)]),mk('span',{style:{color:'var(--td)',fontSize:'11px'}},['/ 5']) ]),
