function pgFeatures(){
  const p=mk('div',{cls:'page'});
  if(!C.classFeatures)C.classFeatures=[];
  if(!C.raceFeatures)C.raceFeatures=[];
  if(!C.selectedFeats)C.selectedFeats=[];

  const ACTION_TYPES=['Azione','Azione Bonus','Reazione','Movimento','Passiva','Turn Start','Risorsa','Altro'];
  const ACTION_COLORS={
    'Azione':'var(--rl)',
    'Azione Bonus':'var(--bluel)',
    'Reazione':'var(--purl)',
    'Movimento':'var(--greenl)',
    'Passiva':'var(--td)',
    'Turn Start':'var(--gold)',
    'Risorsa':'#e8a030',
    'Altro':'var(--tk)',
  };

  function makeFeatureSection(title,color,list,key){
    const sec=CARD([]);

    // Header con titolo e pulsante aggiungi
    sec.appendChild(ROW([
      LBL(title,{marginBottom:'0',color:color}),
      BTN('+ Aggiungi',()=>{C[key].push({name:'',desc:'',actionType:'Passiva',tag:''});save();render();},'sm')
    ],{justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}));

    if((list||[]).length===0){
      sec.appendChild(mk('div',{style:{color:'var(--tk)',fontSize:'12px',fontFamily:'var(--fb)',textAlign:'center',padding:'8px 0'}},[
        'Nessuna abilità. Clicca + Aggiungi per iniziare.'
      ]));
      return sec;
    }

    // Raggruppa per tipo azione
    const groups={};
    ACTION_TYPES.forEach(t=>{groups[t]=[];});
    (list||[]).forEach((f,i)=>{
      const t=f.actionType||'Passiva';
      if(!groups[t])groups[t]=[];
      groups[t].push({f,i});
    });

    ACTION_TYPES.forEach(type=>{
      const items=groups[type]||[];
      if(items.length===0)return;
      const groupColor=ACTION_COLORS[type]||'var(--td)';
      const groupKey=key+'_group_'+type;
      const isGroupOpen=(C._groupOpen||{})[groupKey]!==false;

      // Header gruppo collassabile
      const groupHdr=mk('div',{style:{
        display:'flex',alignItems:'center',gap:'8px',
        padding:'5px 8px',marginTop:'8px',marginBottom:'4px',
        background:'rgba(0,0,0,0.2)',borderRadius:'5px',
        cursor:'pointer',userSelect:'none',
        borderLeft:'3px solid '+groupColor,
      }});
      groupHdr.appendChild(mk('span',{style:{color:groupColor,fontSize:'11px',fontFamily:'var(--ft)',letterSpacing:'1px',flex:'1',textTransform:'uppercase'}},[type]));
      groupHdr.appendChild(mk('span',{style:{color:'var(--td)',fontSize:'10px',background:'rgba(255,255,255,0.05)',borderRadius:'8px',padding:'0 6px'}},[String(items.length)]));
      groupHdr.appendChild(mk('span',{style:{color:'var(--td)',fontSize:'11px'}},[isGroupOpen?'▲':'▼']));
      groupHdr.addEventListener('click',()=>{
        if(!C._groupOpen)C._groupOpen={};
        C._groupOpen[groupKey]=!isGroupOpen;
        save();render();
      });
      sec.appendChild(groupHdr);

      if(!isGroupOpen)return;

      items.forEach(({f,i})=>{
        const isOpen=f._open!==false;
        const card=mk('div',{style:{marginTop:'4px',border:'1px solid rgba(90,62,27,0.3)',borderRadius:'6px',overflow:'hidden'}});

        // Nome row con tipo azione e tag
        const nameRow=mk('div',{style:{display:'flex',alignItems:'center',gap:'6px',padding:'5px 8px',background:'rgba(0,0,0,0.15)'}});
        const tog=mk('span',{style:{color:'var(--td)',fontSize:'11px',cursor:'pointer',flexShrink:0}},[isOpen?'▲':'▼']);
        tog.addEventListener('click',()=>{C[key][i]._open=!isOpen;save();render();});
        nameRow.appendChild(tog);
        nameRow.appendChild(TI(f.name||'',v=>{C[key][i].name=v;save();},'Nome abilità...',{flex:'1',fontFamily:'var(--ft)',fontSize:'12px',background:'transparent',border:'none',borderBottom:'1px solid var(--border)',borderRadius:'0'}));
        // Tag classe/razza opzionale
        nameRow.appendChild(TI(f.tag||'',v=>{C[key][i].tag=v;save();},'Tag...',{width:'70px',fontSize:'10px',color:'var(--td)',background:'transparent',border:'none',borderBottom:'1px solid rgba(90,62,27,0.3)',borderRadius:'0'}));
        nameRow.appendChild(BTN('✕',()=>{C[key].splice(i,1);save();render();},'ghost sm'));
        card.appendChild(nameRow);

        if(isOpen){
          // Selettore tipo azione
          const typeSel=mk('select',{style:{background:'var(--card)',border:'none',borderBottom:'1px solid var(--border)',color:groupColor,borderRadius:'0',padding:'3px 6px',fontSize:'11px',width:'calc(100% - 12px)',margin:'4px 6px 0',display:'block'}});
          ACTION_TYPES.forEach(t=>{
            const o=mk('option',{value:t},[t]);
            if((f.actionType||'Passiva')===t)o.selected=true;
            typeSel.appendChild(o);
          });
          typeSel.addEventListener('change',ev=>{C[key][i].actionType=ev.target.value;save();render();});
          card.appendChild(typeSel);

          const ta=TA(f.desc||'',v=>{C[key][i].desc=v;save();},'Descrizione...');
          ta.style.margin='4px 6px 6px';ta.style.width='calc(100% - 12px)';ta.style.minHeight='70px';ta.style.fontSize='12px';
          card.appendChild(ta);
        }
        sec.appendChild(card);
      });
    });
    return sec;
  }

  p.appendChild(makeFeatureSection('⭐ Privilegi di Classe','var(--gold)',C.classFeatures,'classFeatures'));
  p.appendChild(makeFeatureSection('🌿 Tratti di Razza','var(--greenl)',C.raceFeatures,'raceFeatures'));

  // ── Talenti ──
  const featCard=CARD([]);
  featCard.appendChild(ROW([
    LBL('🏆 Talenti',{marginBottom:'0',color:'var(--gl)'}),

  ],{justifyContent:'space-between',alignItems:'center',marginTop:'12px',marginBottom:dbOpen?'6px':'0'});

    const featListDiv=mk('div',{style:{display:'flex',flexDirection:'column',gap:'4px',maxHeight:'300px',overflowY:'auto'}});

    function renderFeatList(filter, search){
    featListDiv.innerHTML='';
    const alreadySel=new Set((C.selectedFeats||[]).map(f=>f.name));

      if(!isAdded){

    fedSel.addEventListener('change',ev=>renderFeatList(ev.target.value,searchInp.value));

    featCard.appendChild(fedSel);

  p.appendChild(featCard);
  return p;
}

// FEAT_EFFECTS — effetti meccanici dei talenti
// Ogni talento può avere: passBonus, skBonus, spBonus, statBonus,
// profBonus, initBonus, acBonus, speedBonus, newProf, condImm
// ══════════════════════════════════════════════════════════
const FEAT_EFFECTS={
  // Osservatore / Observant
  'Osservatore':{passBonus:{perc:5,intu:0,indag:5}},
  // Allerta / Alert (2014)
  'Allerta':{initBonus:5},
  // Atletico — competenza Atletica
  'Atletico':{newProf:['atletica']},
  // Duro a Morire / Tough
  'Duro a Morire':{toughBonus:true}, // +2 PF per livello (gestito separatamente)
  // Mobile / Mobile
  'Mobile':{speedBonus:10},
  // Armatura Media / Medium Armor Master
  'Armatura Media':{},  // nessun valore fisso tracciabile
  // Armatura Pesante / Heavy Armor Master — riduzione danno (non tracciabile)
  // Furtivo / Skulker — nessun valore fisso
  // Fortunato / Lucky — nessun valore fisso (risorsa)
  // Attaccante Selvaggio — nessun valore
  // Resistente / Resilient — aggiunge competenza in un TS
  // (gestita manualmente dal giocatore)
  // Mago Guerriero 2024 / Incantatore Guerriero
  'Incantatore Guerriero':{},
  // Telecinetista
  'Telecinetista':{},
  // Telepatico
  'Telepatico':{},
};

// Applica gli effetti dei talenti attivi ai bonus passivi e iniziativa
function applyFeatEffects(){
  if(!C.selectedFeats||!C.selectedFeats.length)return;
  // Reset bonus derivati dai talenti (non toccare quelli manuali)
  if(!C._featBonusApplied)C._featBonusApplied={};
  // Azzerare solo i bonus applicati dai talenti, non i manuali
  // Usa un campo separato C.featPassBonus
  C.featPassBonus={perc:0,intu:0,indag:0};
  C.featInitBonus=0;
  C.featSpeedBonus=0;

  C.selectedFeats.forEach(ft=>{
    const eff=FEAT_EFFECTS[ft.name];
    if(!eff)return;
    // Bonus percezione passiva
    if(eff.passBonus){
      if(eff.passBonus.perc)C.featPassBonus.perc=(C.featPassBonus.perc||0)+eff.passBonus.perc;
      if(eff.passBonus.intu)C.featPassBonus.intu=(C.featPassBonus.intu||0)+eff.passBonus.intu;
      if(eff.passBonus.indag)C.featPassBonus.indag=(C.featPassBonus.indag||0)+eff.passBonus.indag;
    }
    // Bonus iniziativa
    if(eff.initBonus)C.featInitBonus=(C.featInitBonus||0)+eff.initBonus;
    // Bonus velocità
    if(eff.speedBonus)C.featSpeedBonus=(C.featSpeedBonus||0)+eff.speedBonus;
  });
}

    if(min<1)return 'pochi secondi fa';
    if(min===1)return '1 minuto fa';
    if(min<60)return min+' minuti fa';
    const h=Math.floor(min/60);

function updateHdr(){
  document.getElementById('hn').textContent=C.name||'Nuovo Personaggio';
  document.getElementById('hs').textContent=[C.cls,C.sub,C.lv&&'Lv '+C.lv].filter(Boolean).join(' · ');
  const cur=PAGES.find(pg=>pg.id===PG);
  document.getElementById('hp').textContent=cur?.tx||'';
  // Banner condizioni attive — solo in combat
  let condBanner=document.getElementById('cond-banner');
  if(PG==='combat'&&(C.conditions||[]).length>0){
    if(!condBanner){
      condBanner=mk('div',{id:'cond-banner',style:{background:'rgba(139,32,32,0.25)',borderBottom:'1px solid var(--rl)',padding:'3px 12px',display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap',fontSize:'11px',fontFamily:'var(--fb)'}});
      const hdrEl=document.getElementById('hdr');
      hdrEl.insertAdjacentElement('afterend',condBanner);
    }
    condBanner.innerHTML='';
    condBanner.appendChild(mk('span',{style:{color:'var(--rl)',fontFamily:'var(--ft)',fontSize:'10px',letterSpacing:'1px',flexShrink:0}},['⚠']));
    (C.conditions||[]).forEach(name=>{
      const chip=mk('span',{style:{color:'var(--rl)',background:'rgba(139,32,32,0.3)',border:'1px solid rgba(201,64,64,0.5)',borderRadius:'8px',padding:'0 6px',cursor:'pointer',userSelect:'none'}});
      chip.textContent=name;
      chip.title='Clicca per rimuovere';
      chip.addEventListener('click',()=>{C.conditions=C.conditions.filter(c=>c!==name);save();render();});
      condBanner.appendChild(chip);
    });
  } else if(condBanner){
    condBanner.remove();
  }

  // ── Tracker Azioni del Turno — solo in combat ──
  const actBar=document.getElementById('action-tracker');
  if(PG==='combat'){
    if(!C.turnActions)C.turnActions={a:false,ab:false,r:false,m:false};
    actBar.style.display='flex';
    // Posiziona subito sotto l'header, qualunque sia la sua altezza reale
    const hdrEl2=document.getElementById('hdr');
    if(hdrEl2)actBar.style.top=hdrEl2.offsetHeight+'px';
    actBar.innerHTML='';
    const ACTS=[['a','A'],['ab','AB'],['r','R'],['m','M']];
    const LABELS={a:'Azione',ab:'Azione Bonus',r:'Reazione',m:'Movimento'};
    ACTS.forEach(([key,short])=>{
      const used=!!C.turnActions[key];
      const btn=mk('button',{title:LABELS[key],style:{
        background:used?'rgba(139,32,32,0.25)':'var(--card)',
        border:'1px solid '+(used?'var(--rl)':'var(--border)'),
        color:used?'var(--rl)':'var(--td)',
        borderRadius:'5px',padding:'3px 10px',fontSize:'11px',fontFamily:'var(--ft)',
        cursor:'pointer',minWidth:'30px',textAlign:'center',flexShrink:0,
      }},[short+(used?' ✕':'')]);
      btn.addEventListener('click',()=>{C.turnActions[key]=!used;save();updateHdr();});
      actBar.appendChild(btn);
    });
    const resetBtn=mk('button',{title:'Reset turno',style:{
      background:'transparent',border:'1px solid var(--border)',color:'var(--gold)',
      borderRadius:'5px',padding:'3px 8px',fontSize:'12px',cursor:'pointer',flexShrink:0,marginLeft:'4px',
    }},['↺']);
    resetBtn.addEventListener('click',()=>{C.turnActions={a:false,ab:false,r:false,m:false};save();updateHdr();});
    actBar.appendChild(resetBtn);
  } else {

  }

let _isRendering=false;
let _renderErrorCount=0;
function render(){
  if(_isRendering){
    // Se siamo bloccati in rendering da troppo tempo, forza il reset
    _renderErrorCount++;
    if(_renderErrorCount>3){
      _isRendering=false;
      _renderErrorCount=0;
    } else {
      return;
    }

function sbUpdateSync(status) {
  const el = document.getElementById('sync-status');

  const map = {
    saving:  { text: '⟳ Salvataggio...', color: 'var(--td)'    },
    saved:   { text: '✓ Salvato',         color: 'var(--greenl)' },

async function sbOpenScheda(schedaId) {
  const ct = document.getElementById('content');
  ct.innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--td);font-family:var(--ft);font-size:13px;letter-spacing:1px">

    <button onclick="window._emergencyExit()" style="background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--td);font-size:11px;padding:6px 14px;cursor:pointer;font-family:var(--fb);letter-spacing:0">Bloccato? Vai alla lista personaggi</button>
  </div>`;
  window._emergencyExit = ()=>{
    localStorage.removeItem('dnd5_last_scheda_' + (sbUser?.id||''));
    sbSchedaId=null;
    // Forza la visualizzazione della lista offline se possibile, altrimenti ricarica
    location.reload();
  };

  // AbortController: forza l'interruzione della richiesta fetch dopo 8 secondi
  const ac = new AbortController();
  const abortTimer = setTimeout(() => ac.abort(), 8000);

  let data, error;
  try {
    const res = await sb.from('schede').select('*').eq('id', schedaId).abortSignal(ac.signal).single();
    data = res.data; error = res.error;
  } catch(e) {
    error = e;
  }
  clearTimeout(abortTimer);

  if (error || !data) {
    localStorage.removeItem('dnd5_last_scheda_' + (sbUser?.id||''));
    sbLoadSchedeList();
    return;
  }

  sbSchedaId = schedaId;
  if (sbUser) localStorage.setItem('dnd5_last_scheda_' + sbUser.id, schedaId);

  // Deep merge — preserva arrays come classes, notes, ecc.
  const savedData = data.data || {};
  const base = JSON.parse(JSON.stringify(DEF));
  C = { ...base, ...savedData };
  // Garantisce che gli array critici esistano sempre
  if(!C.classes)C.classes=[];
  if(!C.notes)C.notes=[];
  if(!C.noteTags)C.noteTags=[];
  if(!C.selectedFeats)C.selectedFeats=[];
  if(!C.classFeatures)C.classFeatures=[];
  if(!C.raceFeatures)C.raceFeatures=[];
  if(!C.conditions)C.conditions=[];
  if(!C.sp)C.sp={str:false,dex:false,con:false,int:false,wis:false,cha:false};
  if(!C.spBonus)C.spBonus={str:0,dex:0,con:0,int:0,wis:0,cha:0};
  if(!C.skBonus)C.skBonus={};
  if(!C.ss)C.ss={1:{m:0,u:0},2:{m:0,u:0},3:{m:0,u:0},4:{m:0,u:0},5:{m:0,u:0},6:{m:0,u:0},7:{m:0,u:0},8:{m:0,u:0},9:{m:0,u:0}};
  if(!C.sk||!C.sk.acrobazia)C.sk=JSON.parse(JSON.stringify(DEF.sk));

  // Registra i timestamp di backup basati sui dati appena caricati dal cloud
  try{
    localStorage.setItem('dnd5', JSON.stringify(C));
    localStorage.setItem('dnd5_last_local_save', String(Date.now()));
    if(data.updated_at){
      localStorage.setItem('dnd5_last_cloud_save', String(new Date(data.updated_at).getTime()));
    }
  }catch(e){}

  document.getElementById('nav').style.display = '';
  ct.innerHTML = '';

  try {
    render();
  } catch(e) {
    console.error('Render error after load:', e);
    PG = 'main';
    try { render(); } catch(e2) { console.error('Render main failed too:', e2); }
  }
  sbUpdateSync('saved');
}

// ╔══════════════════════════════════════════════════════════════╗
// ║              CREA NUOVA SCHEDA                               ║
// ╚══════════════════════════════════════════════════════════════╝
async function sbCreateScheda() {
  reset(); // funzione originale dell'app

  const { data, error } = await sb.from('schede')
    .insert({ user_id: sbUser.id, nome_scheda: 'Nuovo Personaggio', data: C })
    .select()
    .single();

  if (error) {
    alert('Errore nella creazione: ' + error.message);
    return;
  }

  sbSchedaId = data.id;
  document.getElementById('nav').style.display = '';
  document.getElementById('content').innerHTML = '';
  render();
  sbUpdateSync('saved');
}

// ╔══════════════════════════════════════════════════════════════╗
// ║              ELIMINA SCHEDA                                  ║
// ╚══════════════════════════════════════════════════════════════╝
async function sbDuplicaScheda(schedaId, btn) {
  if((await sb.from('schede').select('id',{count:'exact'}).eq('user_id',sbUser.id)).count>=SB_MAX_SCHEDE){
    alert('Hai raggiunto il limite di '+SB_MAX_SCHEDE+' personaggi. Elimina una scheda per duplicare.');
    return;
  }
  const orig=btn.textContent;
  btn.textContent='...';btn.disabled=true;
  const {data,error}=await sb.from('schede').select('*').eq('id',schedaId).single();
  if(error||!data){alert('Errore nel leggere la scheda.');btn.textContent=orig;btn.disabled=false;return;}
  const newData={...data.data,name:(data.data?.name||'Personaggio')+' (copia)'};
  const {error:e2}=await sb.from('schede').insert({user_id:sbUser.id,nome_scheda:newData.name,data:newData});
  if(e2){alert('Errore nella duplicazione: '+e2.message);btn.textContent=orig;btn.disabled=false;return;}
  sbLoadSchedeList();
}

async function sbDeleteScheda(schedaId, btn) {
  if (!confirm('Eliminare questo personaggio?\nQuesta azione è irreversibile.')) return;
  const orig = btn.textContent;
  btn.textContent = '...';
  btn.disabled = true;

  const { error } = await sb.from('schede').delete().eq('id', schedaId);

  if (error) {
    alert('Errore nell\'eliminazione: ' + error.message);
    btn.textContent = orig;
    btn.disabled = false;
    return;
  }
  sbLoadSchedeList();
}

// ╔══════════════════════════════════════════════════════════════╗
// ║              CARICA LISTA SCHEDE                             ║
// ╚══════════════════════════════════════════════════════════════╝
async function sbLoadSchedeList() {
  sbSchedaId = null;
  document.getElementById('nav').style.display = 'none';
  document.getElementById('content').innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--td);font-family:var(--ft);font-size:13px;letter-spacing:1px">
      <div>⟳ Caricamento schede...</div>
      <button onclick="window._emergencySignOut()" style="background:var(--card);border:1px solid var(--border);border-radius:4px;color:var(--td);font-size:11px;padding:6px 14px;cursor:pointer;font-family:var(--fb);letter-spacing:0">Bloccato? Esci e riprova</button>
    </div>`;
  window._emergencySignOut = async ()=>{
    try{await sb.auth.signOut();}catch(e){}
    location.reload();
  };

  let data, error;
  const ac2 = new AbortController();
  const abortTimer2 = setTimeout(() => ac2.abort(), 8000);
  try {
    const res = await sb.from('schede')
      .select('*')
      .eq('user_id', sbUser.id)
      .order('updated_at', { ascending: false })
      .abortSignal(ac2.signal);
    data = res.data; error = res.error;
  } catch(e) {
    error = e;
  }
  clearTimeout(abortTimer2);

  if (error) {
    document.getElementById('content').innerHTML = '';
    const isTimeout = error.name==='AbortError'||/abort/i.test(error.message||'');
    const errDiv=mk('div',{style:{minHeight:'80vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'16px',padding:'24px',textAlign:'center'}});
    errDiv.appendChild(mk('div',{style:{color:'var(--rl)',fontFamily:'var(--ft)',fontSize:'13px'}},[isTimeout?'⚠ Connessione lenta o assente':'⚠ Errore nel caricare le schede']));
    errDiv.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'12px',maxWidth:'260px'}},[isTimeout?'Il server non ha risposto in tempo. Controlla la tua connessione internet e riprova.':(error.message||'Errore sconosciuto')]));
    const retryBtn=BTN('↻ Riprova',()=>sbLoadSchedeList(),'gold');
    errDiv.appendChild(retryBtn);
    document.getElementById('content').appendChild(errDiv);
    return;
  }
  sbShowCharSelect(data || []);
}

// ╔══════════════════════════════════════════════════════════════╗
// ║              CAMBIO SCHEDA DALL'HEADER                       ║
// ╚══════════════════════════════════════════════════════════════╝
async function sbSwitchScheda() {
  if (sbSchedaId) await sbSaveToCloud();
  if (sbUser) localStorage.removeItem('dnd5_last_scheda_' + sbUser.id);
  sbLoadSchedeList();
}

// ╔══════════════════════════════════════════════════════════════╗
// ║              SCHERMATA LOGIN                                 ║
// ╚══════════════════════════════════════════════════════════════╝
function sbShowLogin() {
  document.getElementById('nav').style.display = 'none';
  document.getElementById('content').innerHTML = `
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px 24px;text-align:center">
      <div style="font-family:var(--ft);font-size:26px;color:var(--gl);letter-spacing:3px;line-height:1.4">⚔<br>D&amp;D Scheda</div>
      <div style="color:var(--td);font-size:13px;max-width:280px;line-height:1.7">
        Accedi per salvare i tuoi personaggi nel cloud e accedervi da qualsiasi dispositivo.
      </div>
      <button class="gold" style="padding:13px 36px;font-family:var(--ft);font-size:13px;letter-spacing:1.5px;margin-top:8px"
        onclick="sbSignIn()">☁ Accedi con Google</button>
      <div style="color:var(--tk);font-size:11px">I tuoi dati sono privati e accessibili solo da te.</div>
    </div>`;
}

// ╔══════════════════════════════════════════════════════════════╗
// ║              AUTH                                            ║
// ╚══════════════════════════════════════════════════════════════╝
async function sbSignIn() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.href }
  });
  if (error) alert('Errore nel login: ' + error.message);
}

async function sbSignOut() {
  if (sbSchedaId) await sbSaveToCloud();
  if (sbUser) localStorage.removeItem('dnd5_last_scheda_' + sbUser.id);
  await sb.auth.signOut();
  sbUser     = null;
  sbSchedaId = null;
  location.reload();
}

// ╔══════════════════════════════════════════════════════════════╗
// ║              UTILITY                                         ║
// ╚══════════════════════════════════════════════════════════════╝
function sbEsc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ╔══════════════════════════════════════════════════════════════╗
// ║              AVVIO — GESTISCE LA SESSIONE                    ║
// ╚══════════════════════════════════════════════════════════════╝
sb.auth.onAuthStateChange(async (event, session) => {
  const loginBtn = document.getElementById('login-btn');
  const userInfo = document.getElementById('user-info');
  const userName = document.getElementById('user-name');
  const syncEl   = document.getElementById('sync-status');

  if (session?.user) {
    // ── LOGGATO ──
    sbUser = session.user;
    if (loginBtn) loginBtn.style.display  = 'none';
    if (userInfo) userInfo.style.display  = 'flex';
    if (userName) userName.textContent    = sbUser.email.split('@')[0];
    if (syncEl)   syncEl.style.display    = 'inline';
    const saveBtn = document.getElementById('save-btn');
    if (saveBtn) saveBtn.style.display = 'inline-block';

    // Se la scheda è già aperta (es. TOKEN_REFRESHED), non fare nulla
    if (sbSchedaId) return;

    // Prova a riaprire l'ultima scheda usata
    const lastId = localStorage.getItem('dnd5_last_scheda_' + sbUser.id);
    if (lastId) {
      // Piccolo delay per assicurarsi che il DOM sia pronto
      setTimeout(() => sbOpenScheda(lastId), 100);
    } else {
      sbLoadSchedeList();
    }
  } else {
    // ── NON LOGGATO ──
    sbUser     = null;
    sbSchedaId = null;
    if (loginBtn) loginBtn.style.display  = 'inline-block';
    if (userInfo) userInfo.style.display  = 'none';
    if (syncEl)   syncEl.style.display    = 'none';
    sbShowLogin();
  }
});

// Salvataggio prima di chiudere la pagina
window.addEventListener('beforeunload', () => {
  if (sbUser && sbSchedaId) sbSaveToCloud();
});
</script>
