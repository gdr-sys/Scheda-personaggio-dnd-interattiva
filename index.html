  // Bottoni edizione esaurimento
  const exBtns=exCard.querySelectorAll('button');
  if(exBtns[0]){exBtns[0].className='sm'+(exEd==='2014'?' gold':'');exBtns[0].addEventListener('click',()=>{C.exhaustionEdition='2014';save();render();});}
  if(exBtns[1]){exBtns[1].className='sm'+(exEd==='2024'?' gold':'');exBtns[1].addEventListener('click',()=>{C.exhaustionEdition='2024';save();render();});}
  p.appendChild(exCard);

  // ── Auto-gestione risorse con dado scalabile (Ispirazione Bardica, Dadi Superiorità) ──
  // classLv: livello SPECIFICO nella classe (non il totale del personaggio)
  function ensureScalingResource(key, name, classLv, dieByLevel, maxByLevel){
    if(!C.res)C.res=[];
    const die=dieByLevel(classLv);
    let r=C.res.find(rr=>rr._scalingKey===key);
    if(!r){
      const initialMax=maxByLevel?maxByLevel(classLv):1;
      r={n:name,max:initialMax,cur:initialMax,recharge:'long',die:die,_scalingKey:key,auto:true};
      C.res.push(r);
    } else {
      r.die=die; // aggiorna il dado in base al livello di classe corrente
      r.max=maxByLevel?maxByLevel(classLv):r.max;
      if(r.cur>r.max)r.cur=r.max;
      if(!r.n)r.n=name;
    }
  }
  const SM_cha=sm(C.cha);
  // getClassLevel è ora globale
  const bardLv=getClassLevel('Bardo');
  const isBardo=bardLv>0;
  // Cerca la classe Guerriero (in qualunque posizione nel multiclasse) e legge la SUA sottoclasse
  function normalizeSubclass(s){return (s||'').toLowerCase().trim().replace(/\s+/g,' ');}
  const fighterClassObj=(C.classes&&C.classes.length>0)?C.classes.find(cl=>cl.name==='Guerriero'):null;
  const fighterSub=fighterClassObj?normalizeSubclass(fighterClassObj.sub):((C.cls||'').toLowerCase()==='guerriero'?normalizeSubclass(C.sub):'');
  const fighterLv=getClassLevel('Guerriero');
  const isBattleMaster=!!fighterSub && (
    fighterSub.includes('battle master')||fighterSub.includes('battlemaster')||
    fighterSub.includes('maestro di battaglia')||fighterSub.includes('maestro battaglia')
  );
  if(isBardo){
    ensureScalingResource('bardic','Ispirazione Bardica',bardLv,lv=>lv>=15?'1d12':lv>=10?'1d10':lv>=5?'1d8':'1d6',lv=>Math.max(1,SM_cha));
  }
  if(isBattleMaster){
    ensureScalingResource('superiority','Dadi Superiorità',fighterLv,lv=>lv>=18?'1d12':lv>=10?'1d10':'1d8',lv=>lv>=15?6:lv>=7?5:4);
  }

  // ── Edizione corrente ──
  const ed=C.baseEdition||'2014';

  // helper generico per aggiornare/creare una risorsa auto
  function upsertRes(key,name,maxVal,recharge,die){
    if(!C.res)C.res=[];
    let r=C.res.find(rr=>rr._scalingKey===key);
    if(!r){
      r={n:name,max:maxVal,cur:maxVal,recharge:recharge,die:die||'',_scalingKey:key,auto:true};
      C.res.push(r);
    } else {
      // aggiorna max/dado ma rispetta eventuali modifiche manuali al nome
      r.max=maxVal;
      r.die=die||r.die||'';
      if(r.cur>r.max)r.cur=r.max;
      if(!r.n)r.n=name;
    }
  }

  // ── Stregone: Punti Stregoneria ──
  // 2014: 0 al lv1, poi = livello dal lv2
  // 2024: = livello dal lv1 (in pratica identico perché al lv1 non esistono opzioni da comprare)
  // Entrambe le edizioni: max = livello classe
  const sorcLv=getClassLevel('Stregone');
  if(sorcLv>0){
    const sorcMax=sorcLv; // uguale in entrambe le edizioni
    upsertRes('sorcery','Punti Stregoneria',sorcMax,'long','');
  }

  // ── Chierico: Channel Divinity ──
  // 2014: 1 uso lv1-5 | 2 usi lv6-17 | 3 usi lv18+   — ricarica Riposo Breve
  // 2024: 2 usi lv2+  | 3 usi lv6+                    — ricarica Riposo Breve
  const chiericoLv=getClassLevel('Chierico');
  if(chiericoLv>0){
    let cdcMax;
    if(ed==='2024'){
      cdcMax=chiericoLv>=6?3:2; // 2024: parte da 2 usi al lv2
    } else {
      cdcMax=chiericoLv>=18?3:chiericoLv>=6?2:1; // 2014
    }
    upsertRes('channel_cleric','Channel Divinity (Chierico)',cdcMax,'short','');
  }

  // ── Paladino: Channel Divinity ──
  // 2014: 1 uso sempre (lv1-20)
  // 2024: 2 usi lv6+ | 3 usi lv11+                    — ricarica Riposo Breve
  const paladinoLv=getClassLevel('Paladino');
  if(paladinoLv>0){
    let cdpMax;
    if(ed==='2024'){
      cdpMax=paladinoLv>=11?3:paladinoLv>=6?2:1;
    } else {
      cdpMax=1; // 2014: sempre 1 uso
    }
    upsertRes('channel_paladin','Channel Divinity (Paladino)',cdpMax,'short','');
  }

  // ── Monaco: Punti Ki / Disciplina ──
  // Identici in entrambe le edizioni: = livello Monaco, ricarica Riposo Breve
  const monacoLv=getClassLevel('Monaco');
  if(monacoLv>0){
    const kiName=ed==='2024'?'Punti Disciplina':'Punti Ki';
    upsertRes('ki',kiName,monacoLv,'short','');
  }

  // ── Guerriero: Second Wind ──
  // 2014: cura 1d10 (dado fisso, nessun bonus livello)
  // 2024: cura 1d10 + livello Guerriero
  // Ricarica Riposo Breve in entrambe. 1 uso sempre.
  if(fighterLv>0){
    const swDie=ed==='2024'?'1d10+'+fighterLv:'1d10';
    upsertRes('second_wind','Second Wind',1,'short',swDie);

    // ── Guerriero: Action Surge ──
    // Identica in entrambe: 1 uso (2 al lv20), ricarica Riposo Breve
    const asMax=fighterLv>=20?2:1;
    upsertRes('action_surge','Action Surge',asMax,'short','');
  }

  // ── Barbaro: Furia (Rage) ──
  // Usi: 2@lv1 | 3@lv3 | 4@lv6 | 5@lv12 | 6@lv17 | illimitati@lv20
  // Bonus danno: +2 lv1-8 | +3 lv9-15 | +4 lv16+ (identico 2014 e 2024)
  // 2024: Rage aggiunge anche resistenza ai danni da Freddo — meccanica narrativa, no tracker
  const barbaroLv=getClassLevel('Barbaro');
  if(barbaroLv>0){
    const rageUses=barbaroLv>=20?999:barbaroLv>=17?6:barbaroLv>=12?5:barbaroLv>=6?4:barbaroLv>=3?3:2;
    const rageDmg=barbaroLv>=16?4:barbaroLv>=9?3:2;
    // Il "dado" lo usiamo per mostrare il bonus danno corrente
    const rageDie='+'+rageDmg+' danno (Furia)';
    const rageName=ed==='2024'?'Furia (Rage) 2024':'Furia (Rage)';
    // Per lv20 (usi illimitati) impostiamo max alto ma modificabile
    const rageMax=rageUses===999?99:rageUses;
    upsertRes('rage',rageName,rageMax,'long',rageDie);
  }

  // ── Paladino: Lay on Hands ──
  // Pool PF = 5 × livello Paladino, ricarica Riposo Lungo (identico 2014 e 2024)
  // Gestito come risorsa con max scalabile; il dado mostra "PF pool"
  if(paladinoLv>0){
    const lohMax=paladinoLv*5;
    // Usiamo una risorsa speciale: max = pool totale, cur = PF rimasti
    if(!C.res)C.res=[];
    let loh=C.res.find(rr=>rr._scalingKey==='lay_on_hands');
    if(!loh){
      loh={n:'Lay on Hands (pool PF)',max:lohMax,cur:lohMax,recharge:'long',die:'',_scalingKey:'lay_on_hands',auto:true};
      C.res.push(loh);
    } else {
      // Aggiorna solo se il pool è cambiato (es. cambio livello)
      if(loh.max!==lohMax){
        const diff=lohMax-loh.max;
        loh.max=lohMax;
        loh.cur=Math.min(lohMax,Math.max(0,(loh.cur||0)+diff));
      }
      if(!loh.n)loh.n='Lay on Hands (pool PF)';
    }
  }

  // ── Rimozione risorse auto quando la classe non è più presente ──
  const autoKeyClassMap={
    'sorcery':'Stregone','channel_cleric':'Chierico','channel_paladin':'Paladino',
    'ki':'Monaco','second_wind':'Guerriero','action_surge':'Guerriero',
    'bardic':'Bardo','superiority':'Guerriero',
    'rage':'Barbaro','lay_on_hands':'Paladino'
  };
  if(C.res){
    C.res=C.res.filter(r=>{
      if(!r._scalingKey||!r.auto)return true;
      const requiredClass=autoKeyClassMap[r._scalingKey];
      if(!requiredClass)return true;
      return getClassLevel(requiredClass)>0;
    });
  }

  // Risorse
  const resCard=CARD([
    ROW([LBL('Risorse'),BTN('+ Risorsa',()=>{C.res.push({n:'',max:1,cur:1,recharge:'long',die:''});save();render();},'sm')],{justifyContent:'space-between',alignItems:'center'}),
    ...(C.res||[]).map((r,i)=>mk('div',{style:{marginTop:'6px',display:'flex',flexDirection:'column',gap:'3px'}},[
      ROW([
        TI(r.n||'',v=>{C.res[i].n=v;save();},'Channel Divinity...',{flex:'1',fontSize:'12px'}),
        BTN('▼',()=>{C.res[i].cur=Math.max(0,(r.cur||0)-1);save();render();},'ghost sm'),
        mk('span',{style:{color:'var(--text)',fontFamily:'var(--ft)',fontSize:'14px',minWidth:'16px',textAlign:'center'}},[String(r.cur||0)]),
        mk('span',{style:{color:'var(--td)',fontSize:'11px'}},['/']),
        (()=>{const inp=mk('input',{type:'number',value:String(r.max||1),style:{width:'48px',textAlign:'center',fontSize:'14px',padding:'3px 2px',border:'1px solid var(--border)',borderRadius:'var(--r)',background:'var(--card)',color:'var(--text)',boxSizing:'border-box'}});inp.addEventListener('change',ev=>{C.res[i].max=Math.max(1,Number(ev.target.value)||1);if(C.res[i].cur>C.res[i].max)C.res[i].cur=C.res[i].max;save();render();});return inp;})(),
        BTN('▲',()=>{C.res[i].cur=Math.min(r.max||1,(r.cur||0)+1);save();render();},'ghost sm'),
        BTN('✕',()=>{C.res.splice(i,1);save();render();},'ghost sm')
      ]),
      ROW([
        mk('span',{style:{color:'var(--tk)',fontSize:'10px',flexShrink:0}},['Ricarica:']),
        SEL(r.recharge||'long',[['long','Riposo Lungo'],['short','Riposo Breve'],['none','Manuale']],v=>{C.res[i].recharge=v;save();},{fontSize:'10px',width:'105px'}),
        r.auto?mk('span',{style:{color:'var(--bluel)',fontSize:'9px',marginLeft:'2px'}},['🤖 Auto']):mk('span',{},['']),
      ]),
      ROW([
        mk('span',{style:{color:'var(--tk)',fontSize:'10px',flexShrink:0}},['Dado:']),
        r.auto
          ? mk('span',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'12px'}},[r.die||'—'])
          : TI(r.die||'',v=>{C.res[i].die=v;save();},'es. 1d6',{width:'56px',fontSize:'11px'}),
        (r.die||r.auto)?BTN('⚄ Tira',()=>showRoll(r.die||'1d6',r.n||'Risorsa'),'gold sm',{style:{padding:'1px 8px',fontSize:'10px'}}):mk('span',{},['']),
      ],{alignItems:'center'})
    ]))
  ]);
  p.appendChild(resCard);

  // ── Flexible Casting (Stregone) ──
  if(getClassLevel('Stregone')>0){
    const sorcRes=C.res&&C.res.find(r=>r._scalingKey==='sorcery');
    const sorcPts=sorcRes?Math.max(0,sorcRes.cur||0):0;
    const sorcMax=sorcRes?sorcRes.max||0:0;

    // Costo slot in punti (identico 2014/2024)
    const slotCost={1:2,2:3,3:5,4:6,5:7};
    // Punti ottenuti consumando uno slot
    const slotGain={1:2,2:3,3:5,4:6,5:7};

    const fcCard=CARD([
      ROW([
        mk('span',{style:{color:'var(--purl)',fontFamily:'var(--ft)',fontSize:'11px',letterSpacing:'1px'}},['✦ FLEXIBLE CASTING']),
        mk('span',{style:{color:'var(--purl)',fontFamily:'var(--ft)',fontSize:'12px'}},[sorcPts+'/'+sorcMax+' pt']),
      ],{justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}),

      // Slot → Punti
      mk('div',{style:{color:'var(--td)',fontSize:'10px',marginBottom:'4px'}},['Converti slot in punti:']),
      mk('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap',marginBottom:'8px'}},
        [1,2,3,4,5].map(lv=>{
          const s=C.ss[lv]||{m:0,u:0};
          const avail=Math.max(0,s.m-s.u);
          const gain=slotGain[lv];
          const btn=mk('button',{
            cls:'sm'+(avail===0?' ghost':''),
            style:{fontSize:'10px',padding:'2px 6px',opacity:avail===0?'0.4':'1',
                   borderColor:avail>0?'var(--purl)':'',color:avail>0?'var(--purl)':''}
          },[lv+'° (+'+gain+'pt)']);
          btn.disabled=avail===0;
          btn.addEventListener('click',()=>{
            if(C.ss[lv]&&C.ss[lv].u<C.ss[lv].m){
              C.ss[lv].u++;
              if(!C.res)C.res=[];
              const sr=C.res.find(r=>r._scalingKey==='sorcery');
              if(sr){sr.cur=Math.min(sr.max,(sr.cur||0)+gain);}
              save();render();
            }
          });
          return btn;
        })
      ),

      // Punti → Slot
      mk('div',{style:{color:'var(--td)',fontSize:'10px',marginBottom:'4px'}},['Crea slot da punti:']),
      mk('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap'}},
        [1,2,3,4,5].map(lv=>{
          const cost=slotCost[lv];
          const canAfford=sorcPts>=cost;
          const btn=mk('button',{
            cls:'sm'+(canAfford?'':' ghost'),
            style:{fontSize:'10px',padding:'2px 6px',opacity:canAfford?'1':'0.4',
                   borderColor:canAfford?'var(--gold)':'',color:canAfford?'var(--gold)':''}
          },[lv+'° (-'+cost+'pt)']);
          btn.disabled=!canAfford;
          btn.addEventListener('click',()=>{
            if(!C.res)return;
            const sr=C.res.find(r=>r._scalingKey==='sorcery');
            if(sr&&(sr.cur||0)>=cost){
              sr.cur-=cost;
              // Aggiungi uno slot temporaneo (aumenta max e lo lascia disponibile)
              if(!C.ss[lv])C.ss[lv]={m:0,u:0};
              C.ss[lv].m++;
              save();render();
            }
          });
          return btn;
        })
      ),
      mk('div',{style:{color:'var(--tk)',fontSize:'9px',marginTop:'6px'}},['I slot creati vengono aggiunti a quelli normali e si perdono col Riposo Lungo.']),
    ],{border:'1px solid rgba(138,80,192,0.4)',marginTop:'8px'});
    p.appendChild(fcCard);
  }

  // Effetti temporanei
  const teCard=CARD([
    ROW([LBL('Effetti Temporanei'),BTN('+ Effetto',()=>{C.te.push({n:'',d:'',dur:''});save();render();},'sm')],{justifyContent:'space-between',alignItems:'center'}),
    ...(C.te||[]).map((ef,i)=>mk('div',{style:{marginTop:'6px',background:'rgba(74,32,128,.15)',border:'1px solid var(--pur)',borderRadius:'4px',padding:'6px'}},[
      ROW([TI(ef.n||'',v=>{C.te[i].n=v;save();},'Scudo, Bless...',{flex:'1',fontSize:'12px'}),TI(ef.dur||'',v=>{C.te[i].dur=v;save();},'Durata',{width:'68px',fontSize:'11px'}),BTN('✕',()=>{C.te.splice(i,1);save();render();},'ghost sm')]),
      TI(ef.d||'',v=>{C.te[i].d=v;save();},'Descrizione',{marginTop:'4px',fontSize:'11px',width:'100%'})
    ]))
  ]);
  p.appendChild(teCard);

  return p;
}

function pgSkills(){
  const pb=C.prof||2;
  const S={str:sm(C.str),dex:sm(C.dex),con:sm(C.con),int:sm(C.int),wis:sm(C.wis),cha:sm(C.cha)};
  const SL={str:'FOR',dex:'DES',con:'COS',int:'INT',wis:'SAG',cha:'CAR'};
  if(!C.spBonus)C.spBonus={str:0,dex:0,con:0,int:0,wis:0,cha:0};
  if(!C.skBonus)C.skBonus={};
  function skB(k){const s=C.sk[k];return(S[s.s]||0)+(s.e?pb*2:s.p?pb:0)+(Number((C.skBonus||{})[k])||0);}
  const p=mk('div',{cls:'page'});

  // Tiri salvezza con modificatore
  const svCard=CARD([LBL('Tiri Salvezza'),
    GRID(['str','dex','con','int','wis','cha'].map(s=>{
      const total=S[s]+((C.sp||{})[s]?pb:0)+((C.spBonus||{})[s]||0);
      return ROW([
        CHK(!!(C.sp||{})[s],v=>{C.sp[s]=v;save();render();}),
        mk('span',{style:{color:'var(--td)',fontFamily:'var(--fb)',fontSize:'12px',flex:'1'}},[SL[s]]),
        (()=>{const bv=(C.spBonus||{})[s]||0;const inp=mk('input',{type:'number',value:String(bv),title:'Bonus extra',style:{width:'32px',textAlign:'center',fontSize:'10px',padding:'2px 1px',border:'1px solid '+(bv!==0?'var(--bluel)':'var(--border)'),borderRadius:'var(--r)',background:'var(--card)',color:'var(--bluel)',boxSizing:'border-box',opacity:bv!==0?'1':'0.5'}});inp.addEventListener('change',ev=>{if(!C.spBonus)C.spBonus={};C.spBonus[s]=Number(ev.target.value)||0;save();render();});return inp;})(),
        (()=>{const btn=BTN(fm(total),()=>showRoll('1d20'+fm(total),'TS '+SL[s]),'gold sm',{style:{minWidth:'42px',padding:'3px 6px',fontFamily:'var(--ft)',fontSize:'13px'}});return btn;})()
      ]);
    }),'1fr 1fr',4,{marginTop:'6px'})
  ]);
  p.appendChild(svCard);

  // Abilità con modificatore manuale
  const skList=mk('div',{style:{marginTop:'6px'}});
  Object.entries(C.sk||{}).sort(([a],[b])=>a.localeCompare(b,'it')).forEach(([name,s])=>{
    const row=mk('div',{style:{display:'flex',alignItems:'center',gap:'6px',padding:'4px 0',borderBottom:'1px solid rgba(90,62,27,.2)'}});
    row.appendChild(CHK(!!s.p,v=>{C.sk[name].p=v;save();render();}));
    row.appendChild(CHK(!!s.e,v=>{C.sk[name].e=v;save();render();}));
    const nm=mk('span',{style:{color:s.e?'var(--gl)':s.p?'var(--text)':'var(--td)',fontFamily:'var(--fb)',fontSize:'13px',flex:'1',textTransform:'capitalize'}});
    nm.textContent=name+' ('+SL[s.s]+')';
    row.appendChild(nm);
    const total=skB(name);
    const bonVal=(C.skBonus||{})[name]||0;
    // Campo bonus: piccolo, visibile solo con bordo se non zero
    const bonI=(()=>{const inp=mk('input',{type:'number',value:String(bonVal),title:'Bonus extra',style:{width:'32px',textAlign:'center',fontSize:'10px',padding:'2px 1px',border:'1px solid '+(bonVal!==0?'var(--bluel)':'var(--border)'),borderRadius:'var(--r)',background:'var(--card)',color:'var(--bluel)',boxSizing:'border-box',opacity:bonVal!==0?'1':'0.5'}});inp.addEventListener('change',ev=>{if(!C.skBonus)C.skBonus={};C.skBonus[name]=Number(ev.target.value)||0;save();render();});return inp;})();
    row.appendChild(bonI);
    const rollBtn=BTN(fm(total),()=>showRoll('1d20'+fm(total),name.charAt(0).toUpperCase()+name.slice(1)),'gold sm',{style:{minWidth:'44px',padding:'3px 6px',fontFamily:'var(--ft)',fontSize:'14px'}});
    row.appendChild(rollBtn);
    skList.appendChild(row);
  });
  p.appendChild(CARD([LBL('Abilità  ·  ✦=competenza  ✦✦=maestria  ·  campo blu=bonus extra  ·  tasto=tira'),skList]));

  // Competenze
  p.appendChild(CARD([LBL('Lingue & Competenze'),
    DIV([DIV([LBL('Lingue'),TA(C.lang||'',v=>{C.lang=v;save();})]),DIV([LBL('Armi'),TA(C.wprof||'',v=>{C.wprof=v;save();})]),DIV([LBL('Armature'),TA(C.aprof||'',v=>{C.aprof=v;save();})]),DIV([LBL('Strumenti'),TA(C.tprof||'',v=>{C.tprof=v;save();})])],{display:'flex',flexDirection:'column',gap:'6px',marginTop:'6px'})
  ]));
  return p;
}

function pgCombat(){
  const pb=C.prof||2;
  const S={str:sm(C.str),dex:sm(C.dex),con:sm(C.con),int:sm(C.int),wis:sm(C.wis),cha:sm(C.cha)};
  const p=mk('div',{cls:'page'});
  const rp=document.getElementById('rpop');
  function skB(k){const s=C.sk[k];return(S[s.s]||0)+(s.e?pb*2:s.p?pb:0)+(Number((C.skBonus||{})[k])||0);}

  if(!C.concentration)C.concentration=null;
  if(!C.resistances)C.resistances=[];
  if(!C.immunities)C.immunities=[];
  if(!C.vulnerabilities)C.vulnerabilities=[];

  // ── Rilevamento automatico Druido: mostra pulsante Forma Selvatica ──
  const hasDruido=(C.classes&&C.classes.length>0)
    ? C.classes.some(cl=>cl.name==='Druido')
    : (C.cls||'').toLowerCase()==='druido';
  if(hasDruido && !C.showWildshape){C.showWildshape=true;save();}
  if(hasDruido){
    const wsBtn=BTN('🐺 Vai a Forma Selvatica',()=>{PG='wildshape';C._lastPage='wildshape';save();render();},'gold sm',{style:{width:'100%',marginBottom:'8px'}});
    p.appendChild(wsBtn);
  }

  // ── Concentrazione ──
  const concCard=mk('div',{style:{
    marginBottom:'8px',
    border:'1px solid '+(C.concentration?'var(--bluel)':'rgba(90,62,27,0.3)'),
    borderRadius:'8px',padding:'8px 12px',
    background:C.concentration?'rgba(26,58,107,0.2)':'var(--card)',
    display:'flex',alignItems:'center',gap:'8px',
  }});
  concCard.appendChild(mk('span',{style:{color:'var(--bluel)',fontSize:'14px',flexShrink:0}},['🔵']));
  if(C.concentration){
    const concInfo=mk('div',{style:{flex:'1',minWidth:0}});
    concInfo.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',letterSpacing:'1px',fontFamily:'var(--ft)'}},[' CONCENTRAZIONE']));
    concInfo.appendChild(mk('div',{style:{color:'var(--bluel)',fontFamily:'var(--ft)',fontSize:'13px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},[C.concentration.name||'']));
    if(C.concentration.dur)concInfo.appendChild(mk('div',{style:{color:'var(--tk)',fontSize:'10px'}},[C.concentration.dur]));
    concCard.appendChild(concInfo);
    concCard.appendChild(BTN('Rompi',()=>{C.concentration=null;save();render();},'ghost sm',{style:{color:'var(--rl)',borderColor:'var(--rl)',flexShrink:0}}));
  } else {
    concCard.appendChild(mk('span',{style:{flex:'1',color:'var(--tk)',fontSize:'12px',fontFamily:'var(--fb)'}},[' Nessuna concentrazione attiva']));
    // Selettore rapido da incantesimi con Conc.
    const concSpells=[...(C.cn||[]),...[1,2,3,4,5,6,7,8,9].flatMap(l=>(C.sl[l]||[]))]
      .filter(s=>{const d=lkS(s.n);return d?.du&&d.du.includes('Conc');});
    if(concSpells.length>0){
      const cSel=mk('select',{style:{fontSize:'11px',background:'var(--card)',border:'1px solid var(--border)',color:'var(--td)',borderRadius:'4px',padding:'2px 4px',maxWidth:'140px'}});
      cSel.appendChild(mk('option',{value:''},[' Attiva...']));
      concSpells.forEach(s=>{const d=lkS(s.n);cSel.appendChild(mk('option',{value:s.n},[d?.it||s.n]));});
      cSel.addEventListener('change',ev=>{
        if(!ev.target.value)return;
        const d=lkS(ev.target.value);
        C.concentration={name:d?.it||ev.target.value,dur:d?.du||''};
        save();render();
      });
      concCard.appendChild(cSel);
    }
  }
  p.appendChild(concCard);

  // ── PF con Danno / Cura ──
  function makePfPanel(){
    const hpCol=C.hp<=0?'var(--rl)':C.hp<(C.maxHp||0)*.5?'#e8a030':'var(--greenl)';

    // PF Max — modificabile
    const maxInp=mk('input',{type:'text',value:String(C.maxHp||0),style:{fontSize:'18px',color:'var(--text)',textAlign:'center',width:'100%',background:'transparent',border:'none',borderBottom:'1px solid var(--border)',borderRadius:'0'}});
    maxInp.addEventListener('change',ev=>{C.maxHp=Math.max(0,Number(ev.target.value)||0);if(C.hp>C.maxHp)C.hp=C.maxHp;save();render();});

    // PF Temp — modificabile
    const thpInp=mk('input',{type:'text',value:String(C.thp||0),style:{fontSize:'18px',color:'var(--bluel)',textAlign:'center',width:'100%',background:'transparent',border:'none',borderBottom:'1px solid var(--border)',borderRadius:'0'}});
    thpInp.addEventListener('change',ev=>{C.thp=Math.max(0,Number(ev.target.value)||0);save();});

    // PF Attuali — solo display, non modificabile
    const hpEl=mk('div',{style:{fontSize:'28px',color:hpCol,fontFamily:'var(--ft)',textAlign:'center',lineHeight:'1.2',userSelect:'none'}},[String(C.hp||0)]);

    const pfRow=GRID([
      mk('div',{style:{textAlign:'center',padding:'6px'}},[LBL('PF Attuali'),hpEl]),
      mk('div',{style:{textAlign:'center',padding:'6px'}},[LBL('PF Max'),maxInp]),
      mk('div',{style:{textAlign:'center',padding:'6px'}},[LBL('PF Temp.'),thpInp]),
    ],'1fr 1fr 1fr',6);

    // Input numero — SOLO numeri interi, niente dadi
    const dInp=mk('input',{type:'number',placeholder:'0',min:'0',style:{flex:'1',fontSize:'18px',textAlign:'center',width:'80px',borderRadius:'6px',border:'2px solid var(--border)',background:'var(--card)',color:'var(--text)',padding:'4px 8px'}});

    function applyDamage(){
      const v=parseInt(dInp.value)||0;
      if(v<=0)return;
      let rem=v;
      const thpOld=C.thp||0;
      if(thpOld>0){const used=Math.min(thpOld,rem);C.thp=thpOld-used;rem-=used;}
      C.hp=Math.max(-999,Math.min(C.maxHp||0,(C.hp||0)-rem));
      // ── Se scende a 0 PF, rompi concentrazione automaticamente ──
      if(C.hp<=0 && C.concentration){
        C.concentration=null;
        // Il render successivo aggiornerà il banner
      }
      dInp.value='';save();render();
      // ── Promemoria concentrazione (solo se ancora vivi e in concentrazione) ──
      if(C.concentration && C.concentration.name){
        const dmgTaken=v;
        const conSave=Math.max(10,Math.floor(dmgTaken/2));
        const pb=C.prof||2;
        const conMod=Math.floor(((C.con||10)-10)/2);
        const rpop=document.getElementById('rpop');
        if(rpop){
          rpop.innerHTML='';
          rpop.appendChild(mk('div',{style:{color:'var(--bluel)',fontFamily:'var(--ft)',fontSize:'10px',letterSpacing:'1px',marginBottom:'4px'}},['⚠ CONCENTRAZIONE']));
          rpop.appendChild(mk('div',{style:{color:'var(--gl)',fontFamily:'var(--ft)',fontSize:'13px',marginBottom:'4px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},[C.concentration.name]));
          rpop.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'11px',marginBottom:'6px'}},['Danno subito: '+dmgTaken+' → TS Costituzione CD '+conSave]));
          const modStr=(conMod>=0?'+':'')+conMod+'(COS)+('+pb+' se comp.)';
          rpop.appendChild(mk('div',{style:{color:'var(--tk)',fontSize:'10px',marginBottom:'8px'}},[modStr]));
          // Funzione che mostra il risultato finale e gestisce successo/fallimento
          function showConcResult(r1, usedInspiration){
            const tot=r1+conMod;
            const success=tot>=conSave;
            const ed2=C.baseEdition||'2014';
            const hasIns2=(C.ins||0)>0;
            rpop.innerHTML='';
            rpop.appendChild(mk('div',{style:{color:'var(--bluel)',fontFamily:'var(--ft)',fontSize:'10px',letterSpacing:'1px',marginBottom:'4px'}},['TS CONCENTRAZIONE'+(usedInspiration?' ❆':'')]));
            rpop.appendChild(mk('div',{style:{color:success?'var(--greenl)':'var(--rl)',fontFamily:'var(--ft)',fontSize:'28px',lineHeight:'1',textAlign:'center'}},[String(tot)]));
            rpop.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',textAlign:'center',marginTop:'2px'}},['d20('+r1+')'+(conMod>=0?'+':'')+conMod+' vs CD '+conSave+(usedInspiration?' (Ispirazione)':'')]));
            if(!success){
              C.concentration=null;save();
              setTimeout(()=>{if(typeof render==='function')render();},300);
            }
            rpop.appendChild(mk('div',{style:{color:success?'var(--greenl)':'var(--rl)',fontFamily:'var(--ft)',fontSize:'13px',textAlign:'center',marginTop:'6px'}},[success?'✓ Concentrazione mantenuta':'✗ Concentrazione persa']));
            if(!success){
              rpop.appendChild(mk('div',{style:{color:'var(--tk)',fontSize:'10px',textAlign:'center',marginTop:'4px'}},['L’incantesimo è stato interrotto automaticamente.']));
              // 2024: offri Ispirazione Eroica (ritira) solo se non ancora usata
              if(!usedInspiration && hasIns2 && ed2==='2024'){
                const rerollBtn=BTN('✧ Usa Ispirazione Eroica — Ritira',()=>{
                  C.ins=Math.max(0,(C.ins||0)-1);save();
                  const r2=Math.floor(Math.random()*20)+1;
                  showConcResult(r2,true);
                },'gold sm',{style:{width:'100%',marginTop:'8px'}});
                rpop.appendChild(rerollBtn);
              }
            }
            addRpopCloseBtn(rpop);
            rpop.style.display='block';
            clearTimeout(window._rpt);window._rpt=setTimeout(()=>{rpop.style.display='none';},10000);
          }

          const rollBtn=BTN('🎲 Tira TS (1d20'+(conMod>=0?'+':'')+conMod+')',()=>{
            const ed=C.baseEdition||'2014';
            const hasIns=(C.ins||0)>0;
            if(hasIns && ed==='2014'){
              // 2014: ispirazione = vantaggio immediato, tira 2d20 prendi il migliore
              const r1=Math.floor(Math.random()*20)+1;
              const r2=Math.floor(Math.random()*20)+1;
              const best=Math.max(r1,r2);
              C.ins=Math.max(0,(C.ins||0)-1);save();
              rpop.innerHTML='';
              rpop.appendChild(mk('div',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'10px',letterSpacing:'1px',marginBottom:'4px'}},['TS CONCENTRAZIONE ♦ VANTAGGIO (Ispirazione 2014)']));
              rpop.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'11px',marginBottom:'6px',textAlign:'center'}},['['+r1+', '+r2+'] → migliore: '+best]));
              showConcResult(best,true);
            } else {
              // Tiro singolo; la 2024 offrirà la Heroic Inspiration dopo se fallisce
              const r1=Math.floor(Math.random()*20)+1;
              showConcResult(r1,false);
            }
          },'gold',{style:{width:'100%'}});
          rpop.appendChild(rollBtn);
          addRpopCloseBtn(rpop);
          rpop.style.display='block';
          clearTimeout(window._rpt);window._rpt=setTimeout(()=>rpop.style.display='none',10000);
        }
      }
    }
    function applyHeal(){
      const v=parseInt(dInp.value)||0;
      if(v<=0)return;
      C.hp=Math.min(C.maxHp||0,(C.hp||0)+v);
      dInp.value='';save();render();
    }

    const dcRow=ROW([
      BTN('💢 Danno',applyDamage,'sm',{style:{flex:'1',padding:'10px 4px',background:'rgba(139,32,32,0.2)',borderColor:'var(--rl)',color:'var(--rl)',fontSize:'13px'}}),
      dInp,
      BTN('💚 Cura',applyHeal,'sm',{style:{flex:'1',padding:'10px 4px',background:'rgba(42,107,58,0.2)',borderColor:'var(--greenl)',color:'var(--greenl)',fontSize:'13px'}}),
    ],{gap:'8px',marginTop:'10px',alignItems:'center'});
    dInp.addEventListener('keydown',ev=>{if(ev.key==='Enter')applyHeal();});

    // Long Rest rapido

  // ── Resistenze, Immunità, Vulnerabilità ──
  const DAMAGE_TYPES=['Acido','Freddo','Fuoco','Fulmine','Forza','Necrotici','Radianti','Psichici','Sonoro','Tuono','Veleno','Perforanti','Taglienti','Contundenti','Non magici P/T/C','Veleno Psichico'];

// Costruisce le opzioni categoria per gli incantesimi: fisse + custom create dall'utente
function buildSpellCatOptions(currentVal, selectEl){
  if(!C.spellCategories)C.spellCategories=[];
  const fixed=[['','—'],['attack','Attacco'],['buff','Buff e Debuff'],['heal','Cura']];
  const custom=C.spellCategories.map(cat=>[cat.key,cat.label]);
  [...fixed,...custom,['__new__','+ Nuova categoria...']].forEach(([v,lb])=>{
    const o=mk('option',{value:v},[lb]);
    if(currentVal===v)o.selected=true;
    selectEl.appendChild(o);
  });
}
function promptNewSpellCategory(onCreated){
  const label=prompt('Nome della nuova categoria (es. "Controllo", "Tiro Salvezza"):');
  if(!label||!label.trim())return null;
  const key='custom_'+label.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_');
  if(!C.spellCategories)C.spellCategories=[];
  if(!C.spellCategories.find(c=>c.key===key)){
    const colors=['var(--bluel)','var(--purl)','var(--greenl)','#e8a030','var(--rl)'];
    const color=colors[C.spellCategories.length%colors.length];
    C.spellCategories.push({key,label:label.trim(),color});
  }
  save();
  if(onCreated)onCreated(key);
  return key;
}

function pgSpells(){
  const spMod=sm(C[C.sca]||10);
  const p=mk('div',{cls:'page'});
  const caMap={A:'A',AB:'AB',R:'R'};
  const caCls={A:'cbA',AB:'cbAB',R:'cbR'};
  // Stato ricerca incantesimi
  if(!C._spellSearch)C._spellSearch='';
  const spSearchInp=mk('input',{type:'text',id:'spell-search-inp',placeholder:'🔍 Cerca incantesimo...',value:C._spellSearch||'',style:{width:'100%',fontSize:'13px',padding:'5px 8px',background:'var(--card)',border:'1px solid var(--border)',borderRadius:'6px',color:'var(--text)',marginBottom:'8px'}});
  const spHint=mk('div',{style:{color:'var(--tk)',fontSize:'10px',marginBottom:'8px',lineHeight:'1.5',padding:'4px 6px',background:'rgba(201,168,76,0.06)',borderRadius:'4px',border:'1px solid rgba(201,168,76,0.15)'}},
    ['💡 Per vedere un incantesimo in Combat servono ENTRAMBE le cose: ✓ Preparato (1° spunta) e una Categoria selezionata (Attacco/Buff/Cura/altro). I trucchetti non servono "preparati", basta la categoria.']
  );
  spSearchInp.addEventListener('input',ev=>{
    C._spellSearch=ev.target.value;
    // Non chiamare render() — aggiorna solo i risultati
    clearTimeout(window._spSearchTimer);
    window._spSearchTimer=setTimeout(()=>{
      const cur=document.activeElement;
      const curSel=[cur?.selectionStart,cur?.selectionEnd];
      render();
      // Riporta focus e cursore
      const newInp=document.querySelector('#spell-search-inp');
      if(newInp){newInp.focus();try{newInp.setSelectionRange(curSel[0],curSel[1]);}catch(e){}}
    },300);
  });
  const spQ=(C._spellSearch||'').toLowerCase().trim();

  // Incantatore - DC e bonus attacco con modificatori addizionali
  if(!C.dcMods)C.dcMods=[];
  if(!C.attMods)C.attMods=[];
  const dcBase=8+(C.prof||2)+spMod;
  const dcTotal=dcBase+(C.dcMods||[]).filter(m=>m.on).reduce((a,m)=>a+(Number(m.v)||0),0);
  const attBase=(C.prof||2)+spMod;
  const attTotal=attBase+(C.attMods||[]).filter(m=>m.on).reduce((a,m)=>a+(Number(m.v)||0),0);
  const scaOpts=[['str','FOR'],['dex','DES'],['con','COS'],['int','INT'],['wis','SAG'],['cha','CAR']];

  function modSection(label,mods,key,total,baseVal){
    const modsDiv=mk('div',{style:{flex:'1',minWidth:'0'}});
    function refresh(){
      modsDiv.innerHTML='';
      const t=baseVal+(C[key]||[]).filter(m=>m.on).reduce((a,m)=>a+(Number(m.v)||0),0);
      modsDiv.appendChild(ROW([
        LBL(label,{flex:'1',minWidth:'0',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}),
        mk('div',{id:'spell-'+key+'-total',style:{color:'var(--gl)',fontFamily:'var(--ft)',fontSize:'20px',lineHeight:'1',flexShrink:'0'}},[String(t)]),
        BTN('+',()=>{C[key].push({n:'',v:0,on:false});save();refresh();},'sm ghost',{style:{flexShrink:'0',marginLeft:'4px'}})
      ],{alignItems:'center',gap:'4px',marginBottom:'4px'}));
      (C[key]||[]).forEach((m,i)=>{
        // Campo nome + valore su una riga, con nome che prende tutto lo spazio
        const vInp=mk('input',{type:'number',value:String(m.v||0),style:{width:'48px',textAlign:'center',padding:'4px 2px',border:'1px solid var(--border)',borderRadius:'var(--r)',background:'var(--card)',color:'var(--text)',fontSize:'13px',boxSizing:'border-box',flexShrink:'0'}});
        vInp.addEventListener('input',ev=>{C[key][i].v=Number(ev.target.value)||0;save();refresh();});
        modsDiv.appendChild(ROW([

          BTN('✕',()=>{C[key].splice(i,1);save();refresh();},'ghost sm')

      });
    }
    refresh();
    return modsDiv;
  }

  const scaCard=CARD([
    ROW([LBL('Caratteristica Incantatore'),SEL(C.sca,scaOpts,v=>{C.sca=v;save();render();},{})],{gap:'8px',marginBottom:'10px',alignItems:'center'}),
    mk('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}},
      [modSection('DC Incantesimi','dcMods','dcMods',dcTotal,dcBase),
       modSection('Bonus Attacco','attMods','attMods',attTotal,attBase)]
    )

  p.appendChild(scaCard);

  // Slot incantesimi
  const slotDiv=mk('div',{style:{marginTop:'6px'}});

  function buildSlotRow(lv,container){
    container.innerHTML='';
    const s=C.ss[lv]||{m:0,u:0};
    const avail=Math.max(0,s.m-s.u);
    // Dots (display only)
    const dotsDiv=mk('div',{style:{display:'flex',gap:'3px',flex:'1'}});
    for(let i=0;i<s.m;i++){
      dotsDiv.appendChild(mk('div',{cls:'slotc'+(i<avail?'':' used')}));
    }
    const cntEl=mk('span',{style:{color:avail===0&&s.m>0?'var(--rl)':'var(--td)',fontFamily:'var(--ft)',fontSize:'11px',minWidth:'32px',textAlign:'center'}},[avail+'/'+s.m]);
    const usaBtn=mk('button',{cls:'sm',style:{padding:'1px 6px',fontSize:'10px',opacity:avail===0?0.5:1}},['Usa']);
    usaBtn.addEventListener('click',()=>{if(C.ss[lv].u<C.ss[lv].m){C.ss[lv].u++;save();buildSlotRow(lv,container);}});
    const recBtn=mk('button',{cls:'sm ghost',style:{padding:'1px 5px',fontSize:'13px',opacity:s.u===0?0.4:1}},['↺']);

    });

    container.appendChild(dotsDiv);
    container.appendChild(cntEl);
    container.appendChild(usaBtn);
    container.appendChild(recBtn);
    container.appendChild(mk('span',{style:{color:'var(--tk)',fontSize:'10px',flexShrink:0}},['max']));
    container.appendChild(maxI);
  }

  for(let l=1;l<=9;l++){

  resetBtn.addEventListener('click',()=>{
    for(let l=1;l<=9;l++){if(C.ss[l])C.ss[l].u=0;}

  p.appendChild(CARD([LBL('Slot Incantesimi'),slotDiv,resetBtn]));

    pactRow.appendChild(usaPact);
    pactRow.appendChild(recPact);
    pactRow.appendChild(mk('span',{style:{color:'var(--tk)',fontSize:'10px',flexShrink:0}},['Lv '+C.pactMagic.lv]));

    const pactNote=mk('div',{style:{color:'var(--tk)',fontSize:'10px',marginTop:'4px'}},['🔮 Slot Patto Warlock (Lv '+C.pactMagic.lv+') — si ricaricano col Riposo Breve']);
    const resetPactBtn=mk('button',{cls:'sm',style:{width:'100%',marginTop:'6px',color:'var(--purl)',borderColor:'var(--pur)',background:'rgba(74,32,128,0.1)'}},['↺ Riposo Breve — Recupera slot patto']);
    resetPactBtn.addEventListener('click',()=>{C.pactMagic.u=0;save();refreshPactRow();});
    p.appendChild(CARD([LBL('🔮 Slot Patto Warlock'),pactRow,pactNote,resetPactBtn],{border:'1px solid rgba(138,80,192,0.4)'}));
  })();

  // Aggiungi con ricerca autocomplete
  let newLv=0,newN='';
  if(!C.spellEdition)C.spellEdition='2014';

  const edSel=SEL(C.spellEdition,[['2014','SRD 2014'],['2024','SRD 2024']],v=>{C.spellEdition=v;save();render();},{});

  const suggestDiv=mk('div',{style:{position:'absolute',left:0,right:0,top:'100%',background:'var(--card)',border:'1px solid var(--border)',borderRadius:'4px',zIndex:200,maxHeight:'180px',overflowY:'auto',display:'none'}});

  const nInp=TI('',v=>{
    newN=v;
    // Show suggestions
    const SRD=C.spellEdition==='2024'?SRD24:SRD14;
    const q=v.toLowerCase().trim();
    suggestDiv.innerHTML='';
    if(q.length<2){suggestDiv.style.display='none';return;}
    const matches=Object.entries(SRD).filter(([k,sp])=>sp.it.toLowerCase().includes(q)||k.includes(q)).slice(0,8);
    if(!matches.length){suggestDiv.style.display='none';return;}
    matches.forEach(([k,sp])=>{
      const item=mk('div',{style:{padding:'6px 10px',cursor:'pointer',borderBottom:'1px solid var(--border)',fontSize:'12px',color:'var(--text)',fontFamily:'var(--fb)'}},
        [sp.it+(sp.lv===0?' (Trucchetto)':' (Lv '+sp.lv+')')]);
      item.addEventListener('mousedown',ev=>{ev.preventDefault();});
      item.addEventListener('click',()=>{
        nInp.value=sp.it;newN=sp.it;
        // Auto-set level
        const lvOpts=Array.from(lvSel.options);
        lvSel.value=String(sp.lv);newLv=sp.lv;
        suggestDiv.style.display='none';
      });
      item.addEventListener('mouseover',()=>item.style.background='rgba(201,168,76,0.15)');
      item.addEventListener('mouseout',()=>item.style.background='');
      suggestDiv.appendChild(item);
    });
    suggestDiv.style.display='block';
  },'Nome incantesimo...',{flex:'1'});

  nInp.addEventListener('blur',()=>setTimeout(()=>suggestDiv.style.display='none',200));

  const lvSel=mk('select',{style:{background:'var(--card)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:'4px',padding:'4px',fontSize:'12px',width:'80px'}});
  lvSel.appendChild(mk('option',{value:'0'},['Trucchetto']));
  for(let l=1;l<=9;l++)lvSel.appendChild(mk('option',{value:String(l)},['Lv '+l]));
  lvSel.addEventListener('change',ev=>newLv=Number(ev.target.value));

  const inputWrap=mk('div',{style:{flex:'1',position:'relative'}});
  inputWrap.appendChild(nInp);
  inputWrap.appendChild(suggestDiv);

  p.appendChild(CARD([
    ROW([LBL('Aggiungi Incantesimo'),ROW([mk('span',{style:{color:'var(--td)',fontSize:'11px'}},['Edizione:']),edSel],{gap:'4px'})],{justifyContent:'space-between',alignItems:'center'}),
    ROW([lvSel,inputWrap,BTN('+',()=>{
      const n=nInp.value.trim();if(!n)return;
      const lv=Number(lvSel.value)||newLv;
      if(lv===0)C.cn.push({n});else C.sl[lv].push({n,pr:false});
      nInp.value='';suggestDiv.style.display='none';save();render();
    },'gold')],{marginTop:'6px',gap:'6px'})
  ]));

  // Barra ricerca incantesimi
  p.appendChild(spSearchInp);
  p.appendChild(spHint);

  // Trucchetti
  const filteredCn=(C.cn||[]).filter((s,_i)=>!spQ||s.n.toLowerCase().includes(spQ)||(lkS(s.n)?.it||'').toLowerCase().includes(spQ));
  if(filteredCn.length>0){
    const tCard=CARD([LBL('Trucchetti')]);
    filteredCn.forEach((s)=>{
      const i=(C.cn||[]).indexOf(s);
      const db=lkS(s.n);const cu=(C.csp||{})[(s.n||'').toLowerCase()]||null;let d=cu||db;if(cu&&!d.da&&!d.sv&&d.de){const auto=autoDetectSpellDice(d.de);d={...d,da:d.da||auto.da,daHigher:d.daHigher||auto.daHigher,sv:d.sv||auto.sv};}
      const row=mk('div',{cls:'srow'});
      // Riga superiore: nome + badge + dado
      const top=mk('div',{cls:'srow-top'});
      const nm=mk('span',{style:{flex:'1',color:d?'var(--gl)':'var(--text)',fontFamily:'var(--fb)',fontSize:'15px',cursor:'pointer',textDecoration:d?'underline':'none',textDecorationStyle:'dotted',minWidth:'0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}});
      nm.textContent=cu?.it||d?.it||s.n;
      nm.addEventListener('click',()=>showSpellModal(s.n));
      top.appendChild(nm);
      if(d?.ca)top.appendChild(mk('span',{cls:caCls[d.ca]||'cbA'},[d.ca]));
      if(d?.du&&d.du.includes('Conc')){const cb=mk('span',{style:{background:'rgba(26,58,107,0.3)',border:'1px solid var(--blue)',color:'var(--bluel)',borderRadius:'3px',padding:'0 4px',fontSize:'10px',fontFamily:'monospace',cursor:'pointer'},title:'Clicca per attivare concentrazione'},['C']);cb.addEventListener('click',()=>{C.concentration={name:cu?.it||d?.it||s.n,dur:d?.du||''};save();render();});top.appendChild(cb);}
      if(d?.da||d?.sv){const diceBtn=BTN('⚄',()=>showSpellRollPopup(cu?.it||d?.it||s.n,d?.da||null,d?.sv||null,0,d?.daHigher||null,true),'gold sm',{style:{padding:'2px 7px',fontSize:'12px',flexShrink:'0'}});top.appendChild(diceBtn);}
      row.appendChild(top);
      // Riga inferiore: categoria + componenti + ✕
      const bot=mk('div',{cls:'srow-bot'});
      const catSel=mk('select',{style:{background:'var(--card)',border:'1px solid var(--border)',color:'var(--td)',borderRadius:'3px',padding:'2px 4px',fontSize:'11px',flex:'1',minWidth:'0'}});
      buildSpellCatOptions(s.cat||'',catSel);
      catSel.addEventListener('change',ev=>{
        if(ev.target.value==='__new__'){
          const newKey=promptNewSpellCategory();
          if(newKey){C.cn[i].cat=newKey;render();}else{ev.target.value=s.cat||'';}
          return;
        }
        C.cn[i].cat=ev.target.value;save();
      });
      bot.appendChild(catSel);
      if(d?.co){d.co.split(',').map(c=>c.trim()).filter(Boolean).forEach(c=>{bot.appendChild(mk('span',{style:{background:'rgba(90,62,27,0.2)',border:'1px solid var(--border)',color:'var(--td)',borderRadius:'3px',padding:'0 3px',fontSize:'9px',fontFamily:'monospace'}},[c]));});}
      bot.appendChild(BTN('✕',()=>{C.cn.splice(i,1);save();render();},'ghost sm',{style:{marginLeft:'auto'}}));
      row.appendChild(bot);
      tCard.appendChild(row);
    });
    p.appendChild(tCard);
  }

  // Livelli
  for(let l=1;l<=9;l++){
    const list=(C.sl[l]||[]).filter(s=>!spQ||s.n.toLowerCase().includes(spQ)||(lkS(s.n)?.it||'').toLowerCase().includes(spQ));
    if(!list.length&&!(C.ss[l]?.m))continue;
    const lCard=CARD([LBL('Livello '+l)]);
    list.forEach((s)=>{
      const i=(C.sl[l]||[]).indexOf(s);
      const db=lkS(s.n);const cu=(C.csp||{})[(s.n||'').toLowerCase()]||null;let d=cu||db;if(cu&&!d.da&&!d.sv&&d.de){const auto=autoDetectSpellDice(d.de);d={...d,da:d.da||auto.da,daHigher:d.daHigher||auto.daHigher,sv:d.sv||auto.sv};}
      const row=mk('div',{cls:'srow'});
      // Riga superiore: nome incantesimo + badge + dado
      const top=mk('div',{cls:'srow-top'});
      const nm=mk('span',{style:{flex:'1',color:d?'var(--gl)':'var(--text)',fontFamily:'var(--fb)',fontSize:'15px',cursor:'pointer',textDecoration:d?'underline':'none',textDecorationStyle:'dotted',minWidth:'0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}});
      nm.textContent=cu?.it||d?.it||s.n;
      nm.addEventListener('click',()=>showSpellModal(s.n));
      top.appendChild(nm);
      if(d?.ca)top.appendChild(mk('span',{cls:caCls[d.ca]||'cbA'},[d.ca]));
      if(d?.du&&d.du.includes('Conc')){const cb=mk('span',{style:{background:'rgba(26,58,107,0.3)',border:'1px solid var(--blue)',color:'var(--bluel)',borderRadius:'3px',padding:'0 4px',fontSize:'10px',fontFamily:'monospace',cursor:'pointer'},title:'Clicca per attivare concentrazione'},['C']);cb.addEventListener('click',()=>{C.concentration={name:cu?.it||d?.it||s.n,dur:d?.du||''};save();render();});top.appendChild(cb);}
      if(d?.da||d?.sv){const diceBtn=BTN('⚄',()=>showSpellRollPopup(cu?.it||d?.it||s.n,d?.da||null,d?.sv||null,l,d?.daHigher||null,false),'gold sm',{style:{padding:'2px 7px',fontSize:'12px',flexShrink:'0'}});top.appendChild(diceBtn);}
      row.appendChild(top);
      // Riga inferiore: check + categoria + componenti + ✕
      const bot=mk('div',{cls:'srow-bot'});
      const chkEl=CHK(!!s.pr,v=>{C.sl[l][i].pr=v;save();render();});
      bot.appendChild(chkEl);
      const catSel=mk('select',{style:{background:'var(--card)',border:'1px solid var(--border)',color:'var(--td)',borderRadius:'3px',padding:'2px 4px',fontSize:'11px',flex:'1',minWidth:'0'}});
      buildSpellCatOptions(s.cat||'',catSel);
      catSel.addEventListener('change',ev=>{
        if(ev.target.value==='__new__'){
          const newKey=promptNewSpellCategory();
          if(newKey){C.sl[l][i].cat=newKey;render();}else{ev.target.value=s.cat||'';}
          return;
        }
        C.sl[l][i].cat=ev.target.value;save();
      });
      bot.appendChild(catSel);
      if(d?.co){d.co.split(',').map(c=>c.trim()).filter(Boolean).forEach(c=>{bot.appendChild(mk('span',{style:{background:'rgba(90,62,27,0.2)',border:'1px solid var(--border)',color:'var(--td)',borderRadius:'3px',padding:'0 3px',fontSize:'9px',fontFamily:'monospace'}},[c]));});}
      bot.appendChild(BTN('✕',()=>{C.sl[l].splice(i,1);save();render();},'ghost sm',{style:{marginLeft:'auto'}}));
      row.appendChild(bot);
      lCard.appendChild(row);
    });
    p.appendChild(lCard);
  }
  return p;
}

function pgInventory(){
  const attCnt=(C.mi||[]).filter(i=>i.attuned===true).length;
  const slots=C.ats||3;
  const p=mk('div',{cls:'page'});
  if(!C._invSearch)C._invSearch='';
  const invQ=(C._invSearch||'').toLowerCase().trim();
  const invSearchInp=mk('input',{type:'text',id:'inv-search-inp',placeholder:'🔍 Cerca oggetto...',value:C._invSearch||'',style:{width:'100%',fontSize:'13px',padding:'5px 8px',background:'var(--card)',border:'1px solid var(--border)',borderRadius:'6px',color:'var(--text)',marginBottom:'8px'}});
  invSearchInp.addEventListener('input',ev=>{
    C._invSearch=ev.target.value;
    clearTimeout(window._invSearchTimer);
    window._invSearchTimer=setTimeout(()=>{
      const pos=[document.activeElement?.selectionStart,document.activeElement?.selectionEnd];
      render();
      const newInp=document.querySelector('#inv-search-inp');
      if(newInp){newInp.focus();try{newInp.setSelectionRange(pos[0],pos[1]);}catch(e){}}
    },300);
  });

  // Monete — due portafogli separati
  if(!C.coins)C.coins={pp:0,gp:0,ep:0,sp:0,cp:0};
  // Migrazione: converti vecchio sistema a nuovo
  if(C.coins.coinsBag!==undefined){
    delete C.coins.coinsBag;
  }
  ['pp','gp','ep','sp','cp'].forEach(k=>{
    if(C.coins[k+'Bag']!==undefined&&typeof C.coins[k+'Bag']==='boolean'){
      // Vecchio sistema: bool → converti in quantità (sposta tutto)
      if(C.coins[k+'Bag'])C.coins[k+'BagAmt']=C.coins[k]||0;
      delete C.coins[k+'Bag'];
    }
    if(C.coins[k+'BagAmt']===undefined)C.coins[k+'BagAmt']=0;
  });

  const COIN_LABELS={pp:'MP',gp:'MO',ep:'ME',sp:'MA',cp:'MR'};
  const COIN_COLORS={pp:'#a8a8d8',gp:'var(--gold)',ep:'#90a8b0',sp:'#b8b8b8',cp:'#c87040'};

  const coinsCard=CARD([]);
  // Header con due colonne
  coinsCard.appendChild(ROW([
    LBL('Monete',{marginBottom:'0'}),
    mk('div',{style:{display:'flex',gap:'4px',alignItems:'center'}},[ 
      mk('span',{style:{fontSize:'10px',color:'var(--td)',width:'80px',textAlign:'center'}},['  ']),
      mk('span',{style:{fontSize:'10px',color:'var(--bluel)',width:'80px',textAlign:'center'}},['🎒 Borsa Conservante']),
    ])
  ],{justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}));

  ['pp','gp','ep','sp','cp'].forEach(k=>{
    const col=COIN_COLORS[k];
    const row=mk('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'4px'}});
    // Label
    row.appendChild(mk('div',{style:{color:col,fontFamily:'var(--ft)',fontSize:'12px',width:'24px',textAlign:'center',flexShrink:0}},[COIN_LABELS[k]]));
    // Borsello
    const bInput=mk('input',{type:'number',value:String(C.coins[k]||0),min:'0',style:{flex:'1',textAlign:'center',color:col,fontSize:'13px',background:'rgba(0,0,0,0.1)',border:'1px solid var(--border)',borderRadius:'4px',padding:'3px 4px'}});
    bInput.addEventListener('change',ev=>{C.coins[k]=Math.max(0,Number(ev.target.value)||0);save();});
    row.appendChild(bInput);
    // Separatore
    row.appendChild(mk('span',{style:{color:'var(--border)',fontSize:'14px',flexShrink:0}},['|']));
    // Borsa conservante
    const bgInput=mk('input',{type:'number',value:String(C.coins[k+'BagAmt']||0),min:'0',style:{flex:'1',textAlign:'center',color:'var(--bluel)',fontSize:'13px',background:'rgba(74,122,203,0.08)',border:'1px solid var(--bluel)',borderRadius:'4px',padding:'3px 4px'}});
    bgInput.addEventListener('change',ev=>{C.coins[k+'BagAmt']=Math.max(0,Number(ev.target.value)||0);save();});
    row.appendChild(bgInput);
    coinsCard.appendChild(row);
  });

  p.appendChild(coinsCard);
  p.appendChild(invSearchInp);

  // ── Peso Inventario ──
  const carryNormal=C.str*5;
  const carryMax=C.str*10;
  const totalWeight=
    (C.wea||[]).reduce((s,i)=>s+(Number(i.weight)||0)*(Number(i.qty)||1),0)
    + (C.arm||[]).reduce((s,i)=>s+(Number(i.weight)||0),0)
    + (C.gen||[]).reduce((s,i)=>s+(Number(i.weight)||0)*(Number(i.qty)||1),0)
    + (C.mi||[]).reduce((s,i)=>s+(Number(i.weight)||0),0);
  const weightPct=Math.min(1,totalWeight/carryMax);
  const weightColor=totalWeight>carryMax?'var(--rl)':totalWeight>carryNormal?'#e8a030':'var(--greenl)';
  const weightLabel=totalWeight>carryMax?'Sovraccaricat*!':totalWeight>carryNormal?'Carico pesante':'OK';
  const weightCard=CARD([
    ROW([
      LBL('⚖ Peso Trasportato',{marginBottom:'0'}),
      mk('span',{style:{color:weightColor,fontFamily:'var(--ft)',fontSize:'13px'}},[totalWeight.toFixed(1)+' / '+carryMax+' kg ('+weightLabel+')'])
    ],{justifyContent:'space-between',alignItems:'center',marginBottom:'6px'}),
    mk('div',{style:{height:'6px',background:'var(--border)',borderRadius:'3px',overflow:'hidden'}},[
      mk('div',{style:{height:'100%',width:(weightPct*100).toFixed(0)+'%',background:weightColor,borderRadius:'3px',transition:'width 0.3s'}})
    ]),
    mk('div',{style:{color:'var(--tk)',fontSize:'10px',marginTop:'3px'}},['Normale: '+carryNormal+' kg | Max: '+carryMax+' kg | Basato su FOR '+C.str])
  ]);
  p.appendChild(weightCard);

  // Sintonizzazione
  const dotsDiv=mk('div',{style:{display:'flex',gap:'3px'}});
  for(let i=0;i<slots;i++){
    dotsDiv.appendChild(mk('div',{style:{width:'12px',height:'12px',borderRadius:'50%',border:'2px solid var(--gold)',background:i<attCnt?'rgba(201,168,76,.7)':'transparent'}}));
  }
  p.appendChild(CARD([ROW([LBL('Sintonizzazione',{marginBottom:'0'}),NI(slots,v=>{C.ats=v;save();},undefined,undefined,{width:'36px'}),dotsDiv,mk('span',{style:{color:attCnt>slots?'var(--rl)':'var(--greenl)',fontFamily:'var(--ft)',fontSize:'13px'}},[attCnt+'/'+slots])],{flexWrap:'wrap',gap:'8px'})]));

  // Oggetti magici
  const mgCard=mk('div',{cls:'card',style:{border:'1px solid var(--purl)'}});
  mgCard.appendChild(mk('div',{style:{position:'absolute',top:'0',left:'0',right:'0',height:'2px',background:'linear-gradient(90deg,transparent,var(--purl),transparent)',borderRadius:'8px 8px 0 0'}}));
  mgCard.appendChild(ROW([LBL('✨ Oggetti Magici',{color:'var(--purl)'}),BTN('+ Aggiungi',()=>{C.mi.push({name:'',desc:'',rarity:'',type:'',requiresAttunement:false,attuned:false,bagOfHolding:false});save();render();showMagicModal(C.mi.length-1);},'sm')],{justifyContent:'space-between',alignItems:'center'}));
  (C.mi||[]).filter(item=>!invQ||( (item.name||'').toLowerCase().includes(invQ)||(item.desc||'').toLowerCase().includes(invQ) )).forEach((item,_,arr)=>{
    const i=(C.mi||[]).indexOf(item);
    const rarC={comune:'var(--td)',non_comune:'var(--greenl)',raro:'var(--bluel)','molto raro':'var(--purl)',leggendario:'var(--gl)'};
    const row=mk('div',{cls:'mgrow'});
    if(item.requiresAttunement){
      const d=mk('div',{cls:'dotc'+(item.attuned?' on':'')});
      d.addEventListener('click',()=>{C.mi[i].attuned=!item.attuned;save();render();});
      row.appendChild(d);
    }else{row.appendChild(mk('div',{style:{width:'13px'}}));}
    const nm=mk('span',{style:{flex:'1',color:'var(--purl)',fontFamily:'var(--fb)',fontSize:'13px',cursor:'pointer',textDecoration:'underline',textDecorationStyle:'dotted'}});
    nm.textContent=item.name||'(senza nome)';
    nm.addEventListener('click',()=>showMagicModal(i));
    row.appendChild(nm);
    if(item.rarity)row.appendChild(mk('span',{style:{color:rarC[item.rarity]||'var(--td)',fontSize:'11px'}},['●']));
    if(item.attuned)row.appendChild(mk('span',{style:{color:'var(--gold)',fontSize:'10px'}},['✦']));
    if(item.bagOfHolding){
      const bagBtn=mk('span',{style:{color:'var(--bluel)',fontSize:'11px',cursor:'pointer',border:'1px solid var(--bluel)',borderRadius:'8px',padding:'1px 6px',whiteSpace:'nowrap',fontFamily:'var(--fb)',background:'rgba(74,122,203,0.15)'}},['🎒 Borsa']);
      bagBtn.title='Rimuovi dalla Borsa Conservante';
      bagBtn.addEventListener('click',()=>{C.mi[i].bagOfHolding=false;save();render();});
      row.appendChild(bagBtn);
    } else {
      const bagBtn=mk('span',{style:{color:'var(--tk)',fontSize:'11px',cursor:'pointer',border:'1px solid var(--border)',borderRadius:'8px',padding:'1px 6px',whiteSpace:'nowrap',fontFamily:'var(--fb)'}},['🎒']);
      bagBtn.title='Metti nella Borsa Conservante';
      bagBtn.addEventListener('click',()=>{C.mi[i].bagOfHolding=true;save();render();});
      row.appendChild(bagBtn);
    }
    row.appendChild(BTN('✕',()=>{C.mi.splice(i,1);save();render();},'ghost sm'));
    mgCard.appendChild(row);
  });
  if(!(C.mi||[]).length)mgCard.appendChild(mk('div',{style:{color:'var(--tk)',fontSize:'12px',textAlign:'center',padding:'8px'}},['Nessun oggetto — clicca + per aggiungere']));
  p.appendChild(mgCard);

  // Sezioni generali
  function genSec(title,key,fields,def){
    const allItems=(C[key]||[]);
    const items=allItems
      .map((it,i)=>({it,i}))
      .filter(({it})=>!invQ||(it.name||'').toLowerCase().includes(invQ)||(it.desc||'').toLowerCase().includes(invQ))
      .sort((a,b)=>(a.it.name||'').localeCompare(b.it.name||'','it'));
    const card=CARD([ROW([LBL(title),BTN('+ Aggiungi',()=>{C[key].push({...def});save();render();},'sm')],{justifyContent:'space-between',alignItems:'center'})]);
    if(items.length===0&&invQ){card.appendChild(mk('div',{style:{color:'var(--tk)',fontSize:'12px',padding:'6px 0',fontFamily:'var(--fb)'}},[`Nessun risultato per "${invQ}"`]));}
    items.forEach(({it:item,i})=>{
      const irow=mk('div',{cls:'irow'});
      const bcTog=mk('span',{style:{fontSize:'11px',cursor:'pointer',flexShrink:0,color:item.borsa?'var(--bluel)':'var(--tk)',border:'1px solid '+(item.borsa?'var(--bluel)':'var(--border)'),borderRadius:'10px',padding:'1px 6px',whiteSpace:'nowrap',fontFamily:'var(--fb)'}},['🎒 Borsa']);
      bcTog.addEventListener('click',()=>{C[key][i].borsa=!item.borsa;save();render();});
      const hrow=ROW([
        TI(item.name||'',v=>{C[key][i].name=v;save();},'Nome',{flex:'1',fontSize:'12px'}),        fields.includes('qty')&&NI(item.qty||1,v=>{C[key][i].qty=v;save();},undefined,undefined,{width:'42px'}),
        bcTog,
        BTN(item._exp?'▲':'▼',()=>{C[key][i]._exp=!item._exp;save();render();},'ghost sm'),
        BTN('✕',()=>{C[key].splice(i,1);save();render();},'ghost sm')
      ].filter(Boolean));
      irow.appendChild(hrow);
      if(item._exp){
        const exp=mk('div',{style:{marginTop:'5px',display:'flex',flexDirection:'column',gap:'4px'}});
        if(fields.includes('weight'))exp.appendChild(DIV([LBL('Peso (kg)'),TI(item.weight||'',v=>{C[key][i].weight=v;save();},'kg',{})]));
        exp.appendChild(DIV([LBL('Note'),(()=>{
          const ta=TA(item.desc||'',v=>{C[key][i].desc=v;save();},'Note...');
          ta.addEventListener('input',ev=>{
            C[key][i].desc=ev.target.value;
            clearTimeout(ta._t);ta._t=setTimeout(()=>save(),800);
          });
          return ta;
        })()]));

        irow.appendChild(exp);
      }
      card.appendChild(irow);
    });
    return card;
  }
  p.appendChild(genSec('⚔ Armi','wea',['qty','weight'],{name:'',qty:1,weight:'',desc:''}));

  p.appendChild(genSec('🎒 Inventario','gen',['qty','weight'],{name:'',qty:1,weight:'',desc:''}));

    });

  const bagCard=CARD([]);
  const bagHeader=ROW([
    mk('span',{style:{color:'var(--bluel)',fontFamily:'var(--ft)',fontSize:'13px',letterSpacing:'1px'}},['🎒 Borsa Conservante']),
    mk('span',{style:{color:'var(--td)',fontSize:'11px'}},[bagItems.length+' oggett'+(bagItems.length===1?'o':'i')])
  ],{justifyContent:'space-between',alignItems:'center',marginBottom:'8px'});
  bagCard.appendChild(bagHeader);
  if(bagItems.length===0){
    bagCard.appendChild(mk('div',{style:{color:'var(--tk)',fontSize:'12px',textAlign:'center',padding:'8px',fontFamily:'var(--fb)'}},[
      'Nessun oggetto nella borsa. Usa il pulsante 🎒 accanto a ogni oggetto per aggiungerlo.'
    ]));
  } else {
    bagItems.forEach(item=>{
      const row=mk('div',{style:{display:'flex',alignItems:'center',gap:'8px',padding:'4px 0',borderBottom:'1px solid rgba(90,62,27,0.15)'}});
      row.appendChild(mk('span',{style:{color:'var(--bluel)',fontSize:'12px'}},['🎒']));
      row.appendChild(mk('span',{style:{flex:'1',color:'var(--text)',fontFamily:'var(--fb)',fontSize:'13px'}},[item.name+(item.qty&&item.qty>1?' ×'+item.qty:'')]));
      row.appendChild(mk('span',{style:{color:'var(--tk)',fontSize:'10px',fontFamily:'monospace',border:'1px solid var(--border)',borderRadius:'3px',padding:'0 4px'}},[item.src]));
      bagCard.appendChild(row);
    });
  }
  p.appendChild(bagCard);

  return p;
}

function pgCombo(){
  const p=mk('div',{cls:'page'});
  if(!C.combos)C.combos=[];

  // Collect all spells from spell page
  function getAllSpells(){
    const all=[];
    (C.cn||[]).forEach(s=>{
      const db=lkS(s.n);const cu=(C.csp||{})[s.n?.toLowerCase()]||null;const d=cu||db;
      all.push({n:s.n,label:d?.it||s.n,lv:0,conc:!!(d?.du&&d.du.includes('Conc')),ca:d?.ca||''});
    });
    for(let l=1;l<=9;l++){
      (C.sl[l]||[]).forEach(s=>{
        const db=lkS(s.n);const cu=(C.csp||{})[s.n?.toLowerCase()]||null;const d=cu||db;
        all.push({n:s.n,label:d?.it||s.n,lv:l,conc:!!(d?.du&&d.du.includes('Conc')),ca:d?.ca||''});
      });
    }
    return all;
  }

  function hasConcentration(steps){
    return steps.some(st=>st.type==='spell'&&st.conc);
  }

  function renderCombo(combo,ci){
    const card=CARD([]);
    // Header: nome combo + pulsanti
    const isOpen=combo._open!==false; // default open
    const toggleBtn=mk('span',{style:{color:'var(--td)',fontSize:'12px',cursor:'pointer',userSelect:'none',flexShrink:0}},[ isOpen?'▲':'▼' ]);
    const nameI=TI(combo.name||'',v=>{C.combos[ci].name=v;save();},'Nome combo...',{flex:'1',fontFamily:'var(--ft)',fontSize:'14px',color:'var(--gl)',background:'transparent',border:'none',borderBottom:'1px solid var(--border)',borderRadius:'0'});
    // Click on name or arrow to toggle
    function toggleCombo(){C.combos[ci]._open=!isOpen;save();render();}
    toggleBtn.addEventListener('click',toggleCombo);
    card.appendChild(ROW([toggleBtn,nameI,BTN('✕',()=>{C.combos.splice(ci,1);save();render();},'ghost sm')],{marginBottom:'10px',gap:'6px'}));

    // Steps
    const stepsDiv=mk('div');
    (combo.steps||[]).forEach((st,si)=>{
      const stepEl=mk('div',{style:{background:'rgba(0,0,0,0.3)',border:'1px solid var(--border)',borderRadius:'6px',padding:'8px',marginBottom:'6px'}});

      // Step header: numero + tipo + costo azione + riordina + elimina
      const actCost=st.type==='spell'?(st.ca||'A'):st.actCost||'A';
      const actColor={'A':'var(--greenl)','AB':'var(--bluel)','R':'var(--rl)','—':'var(--td)'}[actCost]||'var(--td)';
      const actLabel={'A':'Azione','AB':'Az. Bonus','R':'Reazione','—':'—'}[actCost]||actCost;
      const moveRow=ROW([
        mk('span',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'11px',minWidth:'18px'}},[(si+1)+'.']),
        mk('span',{style:{color:'var(--td)',fontSize:'11px',flex:'1'}},[st.type==='spell'?'🔮 Incantesimo':st.type==='action'?'⚔ Azione':'📝 Altro']),
        mk('span',{style:{background:actColor==='var(--td)'?'transparent':'rgba(0,0,0,0.3)',border:'1px solid '+actColor,borderRadius:'3px',padding:'0 5px',fontSize:'10px',color:actColor,fontFamily:'monospace',flexShrink:0}},[actLabel]),
        si>0&&BTN('↑',()=>{const tmp=combo.steps[si-1];C.combos[ci].steps[si-1]=st;C.combos[ci].steps[si]=tmp;save();render();},'ghost sm'),
        si<combo.steps.length-1&&BTN('↓',()=>{const tmp=combo.steps[si+1];C.combos[ci].steps[si+1]=st;C.combos[ci].steps[si]=tmp;save();render();},'ghost sm'),
        BTN('✕',()=>{C.combos[ci].steps.splice(si,1);save();render();},'ghost sm'),
      ].filter(Boolean));
      stepEl.appendChild(moveRow);

      if(st.type==='spell'){
        // Spell selector
        const allSpells=getAllSpells();
        const concAlready=combo.steps.slice(0,si).some(s=>s.type==='spell'&&s.conc);
        const available=concAlready?allSpells.filter(s=>!s.conc):allSpells;

        if(available.length===0){
          stepEl.appendChild(mk('div',{style:{color:'var(--rl)',fontSize:'12px',marginTop:'6px'}},['⚠ Concentrazione già attiva — nessun altro incantesimo di concentrazione disponibile']));
        } else {
          // ── Tipo azione (sempre visibile) ──
          stepEl.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',marginTop:'6px',marginBottom:'2px'}},['Tipo di azione:']));
          stepEl.appendChild(SEL(st.ca||'A',[['A','⚔ Azione'],['AB','⚡ Azione Bonus'],['R','🔄 Reazione'],['special','✦ Speciale']],v=>{
            C.combos[ci].steps[si].ca=v;save();render();
          },{width:'100%'}));
          // ── Incantesimo ──
          stepEl.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',marginTop:'6px',marginBottom:'2px'}},['Incantesimo:']));
          const opts=[['','— Scegli incantesimo —'],...available.map(s=>[s.n,s.label+(s.lv===0?' (Trucchetto)':' (Lv '+s.lv+')')+(s.conc?' [C]':'')])];
          const sel=SEL(st.spell||'',opts,v=>{
            const sp=available.find(s=>s.n===v);
            C.combos[ci].steps[si].spell=v;
            C.combos[ci].steps[si].conc=sp?.conc||false;
            C.combos[ci].steps[si].label=sp?.label||v;
            save();render();
          },{width:'100%'});
          stepEl.appendChild(sel);
          if(st.conc){
            stepEl.appendChild(mk('div',{style:{color:'var(--bluel)',fontSize:'11px',marginTop:'4px'}},['🔵 Questo incantesimo richiede concentrazione']));
          }
        }
      } else {
        // Action cost selector for non-spell steps
        const costSel=SEL(st.actCost||'A',[['A','Azione'],['AB','Azione Bonus'],['R','Reazione'],['—','Nessuna']],v=>{C.combos[ci].steps[si].actCost=v;save();render();},{width:'100%',marginTop:'6px'});
        stepEl.appendChild(costSel);
        const descI=TI(st.desc||'',v=>{C.combos[ci].steps[si].desc=v;save();},'Descrivi l\'azione...',{width:'100%',marginTop:'4px'});
        stepEl.appendChild(descI);
      }

      // Note per lo step
      const noteI=TI(st.note||'',v=>{C.combos[ci].steps[si].note=v;save();},'Note (opzionale)...',{width:'100%',marginTop:'4px',fontSize:'11px',color:'var(--td)'});
      stepEl.appendChild(noteI);

      stepsDiv.appendChild(stepEl);
    });
    if(isOpen){
      card.appendChild(stepsDiv);

      // Action summary warning
      const steps=combo.steps||[];
      const aCount=steps.filter(s=>(s.type==='spell'?(s.ca||'A'):s.actCost||'A')==='A').length;
      const abCount=steps.filter(s=>(s.type==='spell'?(s.ca||'A'):s.actCost||'A')==='AB').length;
      const rCount=steps.filter(s=>(s.type==='spell'?(s.ca||'A'):s.actCost||'A')==='R').length;
      if(steps.length>0){
        const warns=[];
        if(aCount>1)warns.push('⚠ '+aCount+' Azioni (hai solo 1 per turno)');
        if(abCount>1)warns.push('⚠ '+abCount+' Azioni Bonus (hai solo 1 per turno)');
        if(rCount>1)warns.push('⚠ '+rCount+' Reazioni (hai solo 1 per round)');
        const summary=[];
        if(aCount)summary.push(aCount+'× Azione');
        if(abCount)summary.push(abCount+'× Az. Bonus');
        if(rCount)summary.push(rCount+'× Reazione');
        const sumDiv=mk('div',{style:{marginTop:'8px',marginBottom:'4px',padding:'6px 8px',background:'rgba(0,0,0,0.3)',borderRadius:'4px'}});
        sumDiv.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'11px'}},[summary.join(' · ')||'Nessuna azione']));
        warns.forEach(w=>sumDiv.appendChild(mk('div',{style:{color:'var(--rl)',fontSize:'11px',marginTop:'2px'}},[w])));
        card.appendChild(sumDiv);
      }

      // Add step buttons
      card.appendChild(ROW([
        BTN('+ Incantesimo',()=>{if(!C.combos[ci].steps)C.combos[ci].steps=[];C.combos[ci].steps.push({type:'spell',spell:'',label:'',conc:false,note:''});save();render();},'sm gold'),
        BTN('+ Azione',()=>{if(!C.combos[ci].steps)C.combos[ci].steps=[];C.combos[ci].steps.push({type:'action',desc:'',note:''});save();render();},'sm'),
        BTN('+ Altro',()=>{if(!C.combos[ci].steps)C.combos[ci].steps=[];C.combos[ci].steps.push({type:'other',desc:'',note:''});save();render();},'sm ghost'),
      ],{gap:'6px',marginTop:'8px',flexWrap:'wrap'}));
    } else {
      // Collapsed: show step count summary
      const cnt=(combo.steps||[]).length;
      if(cnt>0)card.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'11px',marginTop:'-4px'}},[cnt+' step'+(cnt!==1?'s':'')]));
    }

    return card;
  }

  // Header pagina
  p.appendChild(ROW([
    mk('span',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'14px'}},['⚡ Combo']),
    BTN('+ Nuova Combo',()=>{C.combos.push({name:'',steps:[]});save();render();},'gold sm')
  ],{justifyContent:'space-between',alignItems:'center',marginBottom:'4px'}));

  if(!C.combos||C.combos.length===0){
    p.appendChild(mk('div',{style:{color:'var(--tk)',fontSize:'13px',textAlign:'center',padding:'24px',fontFamily:'var(--fb)'}},[
      'Nessuna combo — clicca + per crearne una.',mk('br'),'Una combo è una sequenza di azioni/incantesimi da eseguire in ordine.'
    ]));
  } else {
    C.combos.forEach((combo,ci)=>p.appendChild(renderCombo(combo,ci)));
  }

  return p;
}

// CR numerico per confronto (gestisce frazioni come "1/4")
function crToNumber(cr){
  if(typeof cr==='number')return cr;
  if(cr.includes('/')){const[n,d]=cr.split('/');return Number(n)/Number(d);}
  return Number(cr);
}
// Calcola il CR massimo e le velocità sbloccate in base a livello/circolo Druido ed edizione
function getWildshapeLimits(){
  const lv=C.lv||1;
  const isMoon=(C.sub||'').toLowerCase().includes('luna')||(C.sub||'').toLowerCase().includes('moon');
  const ed=C.baseEdition||'2014';
  let maxCR=0,canSwim=false,canFly=false;
  if(ed==='2024'){
    if(isMoon){
      if(lv>=18)maxCR=6;else if(lv>=15)maxCR=5;else if(lv>=12)maxCR=4;else if(lv>=9)maxCR=3;else if(lv>=6)maxCR=2;else if(lv>=3)maxCR=1;
      canSwim=lv>=4;canFly=lv>=8;
    } else {
      if(lv>=8){maxCR=1;canFly=true;canSwim=true;}
      else if(lv>=4){maxCR=0.5;canSwim=true;}
      else if(lv>=2){maxCR=0.25;}
    }
  } else {
    if(isMoon){
      if(lv>=18)maxCR=6;else if(lv>=15)maxCR=5;else if(lv>=12)maxCR=4;else if(lv>=9)maxCR=3;else if(lv>=8){maxCR=2;canFly=true;canSwim=true;}else if(lv>=6)maxCR=2;else if(lv>=4){maxCR=1;canSwim=true;}else if(lv>=2)maxCR=1;
      if(lv>=8){canFly=true;canSwim=true;}
    } else {
      if(lv>=8){maxCR=1;canFly=true;canSwim=true;}
      else if(lv>=4){maxCR=0.5;canSwim=true;}
      else if(lv>=2){maxCR=0.25;}
    }
  }
  return{maxCR,canSwim,canFly,lv,isMoon,ed};
}

function showWildshapeBestiary(onSelect){
  const limits=getWildshapeLimits();
  const box=CARD([]);
  box.appendChild(ROW([
    mk('span',{style:{color:'var(--gl)',fontFamily:'var(--ft)',fontSize:'14px'}},['🐺 Scegli dal Bestiario']),
    BTN('✕',closeModal,'ghost sm')
  ],{justifyContent:'space-between',marginBottom:'6px'}));
  box.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'11px',marginBottom:'10px',lineHeight:'1.5'}},[
    'In base al tuo livello ('+limits.lv+') e circolo'+(limits.isMoon?' (Luna)':'')+', edizione '+limits.ed+': CR massimo '+limits.maxCR+
    (limits.canSwim?' · Nuoto sbloccato':' · Nuoto non sbloccato')+
    (limits.canFly?' · Volo sbloccato':' · Volo non sbloccato')
  ]));

  const listDiv=mk('div',{style:{display:'flex',flexDirection:'column',gap:'5px',maxHeight:'320px',overflowY:'auto'}});
  WILD_BESTIARY.forEach(beast=>{
    const crNum=crToNumber(limits.ed==='2024'?beast.cr24:beast.cr14);
    const needsSwim=beast.swim>0;
    const needsFly=beast.fly>0;
    const isUnlocked=crNum<=limits.maxCR && (!needsSwim||limits.canSwim) && (!needsFly||limits.canFly);
    const row=mk('div',{style:{padding:'8px 10px',borderRadius:'6px',border:'1px solid '+(isUnlocked?'var(--border)':'rgba(90,62,27,0.15)'),background:isUnlocked?'var(--card)':'rgba(0,0,0,0.15)',cursor:isUnlocked?'pointer':'not-allowed',opacity:isUnlocked?'1':'0.5'}});

      mk('span',{style:{color:isUnlocked?'var(--gl)':'var(--tk)',fontFamily:'var(--ft)',fontSize:'13px',flex:'1'}},[beast.name]),
      mk('span',{style:{color:'var(--td)',fontSize:'10px'}},['CR '+(limits.ed==='2024'?beast.cr24:beast.cr14)]),
    ]));
    row.appendChild(mk('div',{style:{color:'var(--tk)',fontSize:'10px',marginTop:'2px'}},[
      beast.size+' · '+beast.type+' · PF '+beast.hp14+' · CA '+(limits.ed==='2024'?beast.ac24:beast.ac14)+
      (needsSwim?' · 🌊':'')+(needsFly?' · 🪽':'')
    ]));
    if(!isUnlocked)row.appendChild(mk('div',{style:{color:'var(--rl)',fontSize:'9px',marginTop:'2px'}},['🔒 Non ancora sbloccato']));
    if(isUnlocked)row.addEventListener('click',()=>{onSelect(beast,limits.ed);closeModal();});
    listDiv.appendChild(row);
  });
  box.appendChild(listDiv);
  showModal(box);
}

function applyBeastToCompanion(beast,edition){
  const comp=makeBlankCompanion();
  comp.name=beast.name;
  comp.creature=beast.name;
  comp.type=beast.type;
  comp.size=beast.size;
  comp.str=beast.str;comp.dex=beast.dex;comp.con=beast.con;
  comp.int=beast.int;comp.wis=beast.wis;comp.cha=beast.cha;
  comp.bac=edition==='2024'?beast.ac24:beast.ac14;
  comp.spd=beast.spd*1;comp.swim=beast.swim;comp.fly=beast.fly;comp.burrow=beast.burrow||0;comp.climb=beast.climb||0;
  comp.maxHp=beast.hp14;comp.hp=beast.hp14;
  const hdMatch=(beast.hd14||'').match(/(\d+)d(\d+)/);
  if(hdMatch){comp.hdMax=Number(hdMatch[1]);comp.hdType='1d'+hdMatch[2];}
  comp.senses=beast.senses||'';
  comp.skills=beast.skills||'';
  const traits=edition==='2024'?beast.traits24:beast.traits14;
  if(traits){
    comp.racialFeatures=traits.split('\n').filter(Boolean).map(line=>{
      const parts=line.split(':');
      return{name:(parts[0]||'').trim(),desc:(parts.slice(1).join(':')||'').trim()};
    });
  }
  comp.actions=(beast.actions||[]).map(a=>({name:a.n,desc:'Attacco: +'+a.atk+' a colpire. Danno: '+a.dmg+' '+a.type+'. '+(a.desc||'')}));
  comp.weapons=(beast.actions||[]).map(a=>({n:a.n,atk:a.atk,dmg:a.dmg,type:a.type}));
  return comp;
}

        DIV([LBL('Nome'),TI(w.n||'',v=>{C[listKey][ci].weapons[wi].n=v;save();},'Artigli',{fontSize:'11px'})]),
        DIV([LBL('Bonus Colpire'),NI(w.atk||0,v=>{C[listKey][ci].weapons[wi].atk=v;save();},undefined,undefined,{width:'100%'})]),
        DIV([LBL('Dado Danno'),TI(w.dmg||'',v=>{C[listKey][ci].weapons[wi].dmg=v;save();},'1d6',{fontSize:'11px'})]),
        DIV([LBL('Tipo Danno'),TI(w.type||'',v=>{C[listKey][ci].weapons[wi].type=v;save();},'Tagliente',{fontSize:'11px'})]),

          const hitR=roll('1d20'+fm(w.atk||0));
          const dmgR=roll(w.dmg||'1d6');
          const isCrit=hitR.r[0]===20;
          const rRow=mk('div',{style:{display:'flex',gap:'10px',alignItems:'flex-start'}});
          const hitCol=mk('div',{style:{textAlign:'center',flex:'1'}});
          hitCol.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',marginBottom:'2px'}},['COLPIRE']));
          hitCol.appendChild(mk('div',{style:{color:isCrit?'var(--gl)':'var(--text)',fontFamily:'var(--ft)',fontSize:'22px',lineHeight:'1'}},[String(hitR.t)]));
          rRow.appendChild(hitCol);
          rRow.appendChild(mk('div',{style:{width:'1px',background:'var(--border)',alignSelf:'stretch'}}));
          const dmgCol=mk('div',{style:{textAlign:'center',flex:'1'}});
          dmgCol.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'10px',marginBottom:'2px'}},['DANNI']));

          dmgCol.appendChild(mk('div',{style:{color:'var(--td)',fontSize:'9px',marginTop:'2px'}},[w.dmg+(w.type?' '+w.type:'')]));
          rRow.appendChild(dmgCol);
          p2.appendChild(rRow);
          if(typeof addRpopCloseBtn==='function')addRpopCloseBtn(p2);
          p2.style.display='block';
          clearTimeout(rpt);rpt=setTimeout(()=>p2.style.display='none',6000);
        },'gold sm',{style:{flex:'1'}}),
        BTN('✕',()=>{C[listKey][ci].weapons.splice(wi,1);save();render();},'ghost sm'),
      ],{gap:'6px',marginTop:'4px'});

      wpSec.appendChild(wRow);
    });
    body.appendChild(wpSec);

    [
      ['racialFeatures','🌿 Tratti Razziali'],
      ['actions','⚔ Azione'],
      ['bonusActions','⚡ Azione Bonus'],
      ['reactions','🛡 Reazione'],

        const featCard2=mk('div',{style:{marginTop:'4px',border:'1px solid rgba(90,62,27,0.3)',borderRadius:'5px',padding:'5px'}});

        const ta2=TA(feat.desc||'',v=>{C[listKey][ci][fKey][fi].desc=v;},'Descrizione');
        ta2.style.marginTop='3px';ta2.style.fontSize='11px';
        featCard2.appendChild(ta2);
        fSec.appendChild(featCard2);
      });
      body.appendChild(fSec);
    });

    // Equipaggiamento, Personalità, Aspetto
    body.appendChild(DIV([LBL('Equipaggiamento'),TA(comp.equipment||'',v=>{C[listKey][ci].equipment=v;})],{marginTop:'8px'}));
    body.appendChild(DIV([LBL('Personalità'),TA(comp.personality||'',v=>{C[listKey][ci].personality=v;})],{marginTop:'8px'}));
    body.appendChild(DIV([LBL('Aspetto'),TA(comp.appearance||'',v=>{C[listKey][ci].appearance=v;})],{marginTop:'8px'}));

    card.appendChild(body);
    p.appendChild(card);
  });

  return p;
}

function pgHomebrew(){
  const p=mk('div',{cls:'page'});
  const hdr=ROW([mk('span',{style:{color:'var(--gold)',fontFamily:'var(--ft)',fontSize:'13px'}},['⚗ Sezioni Personalizzate']),BTN('+ Sezione',()=>{C.cs.push({t:'Nuova Sezione',c:''});save();render();},'gold sm')],{justifyContent:'space-between',alignItems:'center'});
  p.appendChild(hdr);
  (C.cs||[]).forEach((s,i)=>{
    p.appendChild(CARD([
      ROW([TI(s.t||'',v=>{C.cs[i].t=v;save();},'',{flex:'1',fontFamily:'var(--ft)',fontSize:'13px'}),BTN('✕',()=>{C.cs.splice(i,1);save();render();},'ghost sm')],{marginBottom:'6px'}),
      TA(s.c||'',v=>{C.cs[i].c=v;save();},'Contenuto libero...',{width:'100%',minHeight:'70px'})
    ]));
  });

  const trkCard=CARD([ROW([LBL('⏱ Tracker Attività'),BTN('+ Attività',()=>{C.ta.push({n:'',cur:0,goal:10});save();render();},'sm')],{justifyContent:'space-between',alignItems:'center'})]);
  (C.ta||[]).forEach((a,i)=>{
    const pct=Math.min(100,Math.round(((a.cur||0)/(a.goal||1))*100));
    const trow=mk('div',{style:{marginTop:'8px'}});
    trow.appendChild(ROW([TI(a.n||'',v=>{C.ta[i].n=v;save();},'Nome attività',{flex:'1',fontSize:'12px'}),BTN('✕',()=>{C.ta.splice(i,1);save();render();},'ghost sm')]));
    const pbFill=mk('div',{cls:'pbf',style:{width:pct+'%'}});
    const pctLbl=mk('div',{style:{textAlign:'right',color:'var(--td)',fontSize:'10px'}},[pct+'%']);
    function updateBar(){const p2=Math.min(100,Math.round(((C.ta[i].cur||0)/(C.ta[i].goal||1))*100));pbFill.style.width=p2+'%';pctLbl.textContent=p2+'%';}
    trow.appendChild(ROW([
      BTN('−',()=>{C.ta[i].cur=Math.max(0,(C.ta[i].cur||0)-1);save();updateBar();},'sm'),
      NI(a.cur||0,v=>{C.ta[i].cur=v;save();updateBar();},undefined,undefined,{width:'46px'}),
      mk('span',{style:{color:'var(--td)',fontSize:'12px'}},['/']),
      NI(a.goal||10,v=>{C.ta[i].goal=v;save();updateBar();},undefined,undefined,{width:'46px'}),
      BTN('+',()=>{C.ta[i].cur=Math.min(C.ta[i].goal||10,(C.ta[i].cur||0)+1);save();updateBar();},'sm'),
    ],{marginTop:'4px'}));
    trow.appendChild(mk('div',{cls:'pb'},[pbFill]));
    trow.appendChild(pctLbl);
    trkCard.appendChild(trow);
  });
  p.appendChild(trkCard);
  return p;
}
